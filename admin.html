        // 기획본부 소통 창구 페이지
        function AbpCommunicationPage() {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedTeamFilter, setSelectedTeamFilter] = useState('all');
            const [selectedAuthorFilter, setSelectedAuthorFilter] = useState('all');
            const [authors, setAuthors] = useState([]);
            const [branchManagerMap, setBranchManagerMap] = useState({}); // 지점-담당자 매핑
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [selectedInquiry, setSelectedInquiry] = useState(null);

            // 페이지네이션 상태
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 20;

            // 선택 삭제 관련 상태
            const [selectedAbpInquiries, setSelectedAbpInquiries] = useState([]);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            // 새 문의 작성 모달 상태
            const [showNewInquiryModal, setShowNewInquiryModal] = useState(false);
            const [newInquiry, setNewInquiry] = useState({
                targetTeam: '',
                authorName: '',
                content: ''
            });
            const [isSubmittingNew, setIsSubmittingNew] = useState(false);

            const userPickedCategoryRef = useRef(false);
            const [categoryDefRows, setCategoryDefRows] = useState([]);
            const [detailRouteMajorId, setDetailRouteMajorId] = useState('');
            const [detailRouteMinorDocId, setDetailRouteMinorDocId] = useState('');
            const [detailManualTargetTeamId, setDetailManualTargetTeamId] = useState('');
            const [savingCategoryRoute, setSavingCategoryRoute] = useState(false);
            const [replyText, setReplyText] = useState('');
            const [replyAuthor, setReplyAuthor] = useState('');
            const [replyAttachedFiles, setReplyAttachedFiles] = useState([]);
            const [isReplying, setIsReplying] = useState(false);

            // 기획본부 문의 목록 로드
            useEffect(() => {
                const unsubscribe = db.collection('abpInquiries')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);

                        // 작성자 목록 추출
                        const authorSet = new Set();
                        data.forEach(inquiry => {
                            if (inquiry.authorName) authorSet.add(inquiry.authorName);
                        });
                        setAuthors([...authorSet].sort());

                        setLoading(false);
                    }, (error) => {
                        console.error('기획본부 문의 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        setCategoryDefRows(snapshot.docs.map((d) => ({ id: d.id, ...d.data() })));
                    },
                    (err) => console.error('[inquiryCategoryDefinitions] 로드:', err)
                );
                return () => unsub();
            }, []);

            // 지점-담당자 매핑 로드 (users 컬렉션에서)
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const mapping = {};
                        snapshot.docs.forEach(doc => {
                            const userData = doc.data();
                            if (userData.branchName && userData.manager) {
                                mapping[userData.branchName] = userData.manager;
                            }
                        });
                        setBranchManagerMap(mapping);
                    }, (error) => {
                        console.error('지점-담당자 매핑 로드 오류:', error);
                    });

                return () => unsubscribe();
            }, []);

            const routeMajorOptions = useMemo(() => {
                const m = new Map();
                (categoryDefRows || []).forEach((r) => {
                    if (r.active === false || !r.majorId) return;
                    if (!m.has(r.majorId)) m.set(r.majorId, r.majorLabel || r.majorId);
                });
                const list = Array.from(m.entries())
                    .map(([majorId, majorLabel]) => ({ majorId, majorLabel }))
                    .sort((a, b) => a.majorLabel.localeCompare(b.majorLabel, 'ko'));
                return [{ majorId: ABP_MANUAL_TEAM_MAJOR_ID, majorLabel: '담당부서 지정' }, ...list];
            }, [categoryDefRows]);

            const routeMinorOptions = useMemo(() => {
                if (!detailRouteMajorId) return [];
                if (detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID) return [];
                return (categoryDefRows || [])
                    .filter((r) => r.active !== false && r.majorId === detailRouteMajorId)
                    .slice()
                    .sort((a, b) => (a.minorLabel || '').localeCompare(b.minorLabel || '', 'ko'));
            }, [categoryDefRows, detailRouteMajorId]);

            useEffect(() => {
                if (!showDetailModal || !selectedInquiry) return;
                if (userPickedCategoryRef.current) return;
                const inv = selectedInquiry;
                if (inv.inquiryMajor === ABP_MANUAL_TEAM_MAJOR_ID) {
                    setDetailRouteMajorId(ABP_MANUAL_TEAM_MAJOR_ID);
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId(inv.targetTeam || inv.abpTargetTeam || inv.inquiryMinor || '');
                    return;
                }
                const hit = categoryDefRows.find(
                    (r) =>
                        r.active !== false &&
                        r.majorId === inv.inquiryMajor &&
                        String(r.minorId ?? '') === String(inv.inquiryMinor ?? '')
                );
                if (hit) {
                    setDetailRouteMajorId(hit.majorId || '');
                    setDetailRouteMinorDocId(hit.id || '');
                    setDetailManualTargetTeamId('');
                } else {
                    setDetailRouteMajorId('');
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId('');
                }
            }, [showDetailModal, selectedInquiry, categoryDefRows]);

            // 필터링된 목록
            const filteredInquiries = inquiries.filter(inquiry => {
                if (selectedTeamFilter !== 'all' && inquiry.targetTeam !== selectedTeamFilter) return false;
                if (selectedAuthorFilter !== 'all' && inquiry.authorName !== selectedAuthorFilter) return false;
                return true;
            });

            // 페이지네이션 계산
            const totalPages = Math.ceil(filteredInquiries.length / ITEMS_PER_PAGE);
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const paginatedInquiries = filteredInquiries.slice(startIndex, endIndex);

            // 필터 변경 시 페이지 리셋
            useEffect(() => {
                setCurrentPage(1);
            }, [selectedTeamFilter, selectedAuthorFilter]);

            // 팀별 통계 계산
            const getAbpTeamStats = () => {
                return ABP_TEAMS.map(team => {
                    const teamInquiries = inquiries.filter(i => i.targetTeam === team.id);
                    const total = teamInquiries.length;
                    const pending = teamInquiries.filter(i => i.status === 'pending').length;
                    const answered = teamInquiries.filter(i => i.status === 'answered').length;
                    const completionRate = total > 0 ? ((answered / total) * 100).toFixed(1) : 0;

                    return {
                        name: team.name,
                        total,
                        pending,
                        answered,
                        completionRate
                    };
                });
            };

            const abpTeamStats = getAbpTeamStats();

            // 전체 통계 계산
            const totalAbpInquiries = inquiries.length;
            const totalAbpPending = inquiries.filter(i => i.status === 'pending').length;
            const totalAbpAnswered = inquiries.filter(i => i.status === 'answered').length;
            const totalAbpCompletionRate = totalAbpInquiries > 0 ? ((totalAbpAnswered / totalAbpInquiries) * 100).toFixed(1) : 0;

            // 날짜 포맷
            const formatDateLocal = (timestamp) => {
                if (!timestamp) return '-';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            // 체크박스 - 개별 선택
            const handleSelectAbpInquiry = (id) => {
                setSelectedAbpInquiries(prev => {
                    if (prev.includes(id)) {
                        return prev.filter(inquiryId => inquiryId !== id);
                    } else {
                        return [...prev, id];
                    }
                });
            };

            // 체크박스 - 현재 페이지 전체 선택
            const handleSelectAllAbpInquiries = () => {
                if (paginatedInquiries.length > 0 && paginatedInquiries.every(inquiry => selectedAbpInquiries.includes(inquiry.id))) {
                    // 현재 페이지의 선택 해제
                    setSelectedAbpInquiries(prev => prev.filter(id => !paginatedInquiries.find(inquiry => inquiry.id === id)));
                } else {
                    // 현재 페이지 전체 선택
                    const newSelections = [...new Set([...selectedAbpInquiries, ...paginatedInquiries.map(inquiry => inquiry.id)])];
                    setSelectedAbpInquiries(newSelections);
                }
            };

            // 삭제 모달 열기
            const openAbpDeleteModal = () => {
                if (selectedAbpInquiries.length === 0) {
                    alert('삭제할 항목을 선택해주세요.');
                    return;
                }
                setDeletePassword('');
                setShowDeleteModal(true);
            };

            // 선택 삭제 실행
            const handleConfirmAbpDelete = async (e) => {
                e.preventDefault();

                if (!deletePassword) {
                    alert('고유 비밀번호를 입력해주세요.');
                    return;
                }

                setIsDeleting(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (deletePassword !== storedPassword) {
                        alert('비밀번호가 올바르지 않습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    const abpRowsToPurge = selectedAbpInquiries
                        .map((id) => inquiries.find((i) => i.id === id))
                        .filter(Boolean);
                    const linkedInquiryRows = await loadInquiryRowsForAbpAttachmentPurge(abpRowsToPurge);
                    await deleteInquiryAttachmentStorageFromRows([...abpRowsToPurge, ...linkedInquiryRows]);

                    const deleteRefs = [];
                    selectedAbpInquiries.forEach((id) => deleteRefs.push(db.collection('abpInquiries').doc(id)));
                    const originalInquiryIdsToDelete = new Set(
                        abpRowsToPurge
                            .map((r) => r.originalInquiryId)
                            .filter((id) => typeof id === 'string' && id.length > 0)
                    );
                    originalInquiryIdsToDelete.forEach((oid) => deleteRefs.push(db.collection('inquiries').doc(oid)));
                    await commitBatchedDeletes(deleteRefs);

                    alert(`${selectedAbpInquiries.length}개 항목이 삭제되었습니다.`);
                    setSelectedAbpInquiries([]);
                    setShowDeleteModal(false);
                } catch (error) {
                    console.error('삭제 오류:', error);
                    alert('삭제에 실패했습니다: ' + error.message);
                } finally {
                    setIsDeleting(false);
                    setDeletePassword('');
                }
            };

            // 팀명 가져오기
            const getTeamName = (teamId) => {
                if (!teamId) return '-';
                const team = ABP_TEAM_BY_ID[teamId] || ABP_TEAMS.find(t => t.id === teamId);
                if (team) return team.name;
                if (LEGACY_ABP_TEAM_NAMES[teamId]) return LEGACY_ABP_TEAM_NAMES[teamId];
                return teamId;
            };

            // 상태 배지
            const getStatusBadge = (status) => {
                const styles = {
                    pending: { bg: '#fff3e0', color: '#f57c00', text: '대기중' },
                    answered: { bg: '#e8f5e9', color: '#388e3c', text: '답변완료' }
                };
                const style = styles[status] || styles.pending;
                return (
                    <span style={{
                        background: style.bg,
                        color: style.color,
                        padding: '4px 10px',
                        borderRadius: '20px',
                        fontSize: '12px',
                        fontWeight: '500',
                        whiteSpace: 'nowrap'
                    }}>
                        {style.text}
                    </span>
                );
            };

            const getInquiryCategoryText = (inquiry) => {
                const major = inquiry?.inquiryMajorLabel || inquiry?.inquiryMajor || '';
                const minor = inquiry?.inquiryMinorLabel || inquiry?.inquiryMinor || '';
                if (!major && !minor) return '-';
                if (!minor) return major || '-';
                if (!major) return minor || '-';
                return `${major} › ${minor}`;
            };

            // 상세보기 (abp.html과 동일: 답변 폼 초기화 + 지점 inquiries 병합)
            const openDetail = (inquiry) => {
                userPickedCategoryRef.current = false;
                setReplyText(inquiry.reply || '');
                setReplyAuthor(inquiry.replyAuthor || '');
                setReplyAttachedFiles([]);
                setSelectedInquiry(inquiry);
                setShowDetailModal(true);
                if (inquiry.originalInquiryId) {
                    db.collection('inquiries')
                        .doc(inquiry.originalInquiryId)
                        .get()
                        .then((snap) => {
                            if (!snap.exists) return;
                            const d = snap.data();
                            setSelectedInquiry((prev) => {
                                if (!prev || prev.id !== inquiry.id) return prev;
                                return {
                                    ...prev,
                                    inquiryMajor: prev.inquiryMajor || d.inquiryMajor,
                                    inquiryMinor: prev.inquiryMinor || d.inquiryMinor,
                                    inquiryMajorLabel: prev.inquiryMajorLabel || d.inquiryMajorLabel,
                                    inquiryMinorLabel: prev.inquiryMinorLabel || d.inquiryMinorLabel,
                                    attachments: Array.isArray(d.attachments) ? d.attachments : prev.attachments
                                };
                            });
                        })
                        .catch((err) => console.warn('inquiries 보강 로드:', err));
                }
            };

            const handleSaveInquiryCategoryRoute = async () => {
                if (!selectedInquiry) return;
                if (!detailRouteMajorId) {
                    alert('대분류를 선택해주세요.');
                    return;
                }
                setSavingCategoryRoute(true);
                const isManual = detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID;
                const str = (v) => (v != null && v !== undefined ? String(v) : '');
                let abpPayload;
                let invPayload;
                if (isManual) {
                    if (!detailManualTargetTeamId) {
                        alert('담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(detailManualTargetTeamId)) {
                        alert('유효한 담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const teamMeta = ABP_TEAM_BY_ID[detailManualTargetTeamId];
                    abpPayload = {
                        targetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId),
                        abpRoutedBy: 'manual_team'
                    };
                    invPayload = {
                        abpTargetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId)
                    };
                } else {
                    if (!detailRouteMinorDocId) {
                        alert('중분류를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const def = categoryDefRows.find((r) => r.id === detailRouteMinorDocId);
                    if (!def || !def.targetTeam) {
                        alert('선택한 분류를 찾을 수 없습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(def.targetTeam)) {
                        alert('분류에 연결된 담당 팀이 올바르지 않습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    abpPayload = {
                        targetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel),
                        abpRoutedBy: 'firestore'
                    };
                    invPayload = {
                        abpTargetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel)
                    };
                }
                try {
                    await db.collection('abpInquiries').doc(selectedInquiry.id).update({
                        ...abpPayload,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    let inquiriesSyncFailed = false;
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db
                                .collection('inquiries')
                                .doc(selectedInquiry.originalInquiryId)
                                .update({
                                    ...invPayload,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                        } catch (syncErr) {
                            inquiriesSyncFailed = true;
                            console.error('inquiries 동기화 오류(분류):', syncErr);
                            alert(
                                '기획본부함에는 반영되었습니다.\n\n' +
                                    '다만 지점 문의(inquiries) 동기화에 실패했습니다. Firestore 규칙에서 관리자 계정이 해당 지점 문의를 수정할 수 있는지 확인해 주세요.\n\n' +
                                    (syncErr.code ? `[${syncErr.code}] ` : '') +
                                    (syncErr.message || String(syncErr))
                            );
                        }
                    }

                    setSelectedInquiry((prev) =>
                        prev
                            ? {
                                  ...prev,
                                  ...abpPayload
                              }
                            : prev
                    );
                    userPickedCategoryRef.current = false;
                    if (!inquiriesSyncFailed) {
                        alert('담당 팀이 선택한 분류에 맞게 반영되었습니다.');
                    }
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('abpInquiries 분류 반영 오류:', error);
                    alert(
                        '기획본부 문의(abpInquiries) 저장에 실패했습니다.\n\n' +
                            (error.code ? `[${error.code}] ` : '') +
                            (error.message || String(error))
                    );
                } finally {
                    setSavingCategoryRoute(false);
                }
            };

            const handleAbpAdminReply = async () => {
                if (!selectedInquiry?.id) return;
                if (!replyText.trim()) {
                    alert('답변 내용을 입력해주세요.');
                    return;
                }
                if (!replyAuthor.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }
                const existingReplyAttachments = Array.isArray(selectedInquiry?.replyAttachments)
                    ? selectedInquiry.replyAttachments
                    : [];
                if (existingReplyAttachments.length + (replyAttachedFiles?.length || 0) > 5) {
                    alert('첨부파일은 최대 5개까지 가능합니다.');
                    return;
                }

                setIsReplying(true);

                try {
                    const abpRef = db.collection('abpInquiries').doc(selectedInquiry.id);
                    const newReplyAttachments = await uploadAbpReplyAttachments({
                        files: replyAttachedFiles,
                        inquiryId: selectedInquiry.id
                    });
                    const payload = {
                        reply: replyText.trim(),
                        replyAuthor: replyAuthor.trim(),
                        status: 'answered',
                        repliedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        replyAttachments: [...existingReplyAttachments, ...newReplyAttachments]
                    };

                    await abpRef.update(payload);

                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db.collection('inquiries').doc(selectedInquiry.originalInquiryId).update(payload);
                        } catch (syncErr) {
                            console.error('inquiries 동기화 오류:', syncErr);
                            alert(
                                '기획본부 문의에는 답변이 저장되었습니다.\n\n' +
                                    '다만 지점 문의(inquiries)에 반영되지 않았습니다. (Firestore 규칙 확인)\n' +
                                    (syncErr.message || String(syncErr))
                            );
                            setShowDetailModal(false);
                            return;
                        }
                    }

                    alert('답변이 저장되었습니다.');
                    setReplyAttachedFiles([]);
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('답변 저장 오류:', error);
                    alert('답변 저장에 실패했습니다: ' + (error.message || error));
                } finally {
                    setIsReplying(false);
                }
            };

            // 새 문의 저장
            const handleNewInquirySubmit = async () => {
                if (!newInquiry.targetTeam) {
                    alert('문의할 부서를 선택해주세요.');
                    return;
                }
                if (!newInquiry.content.trim()) {
                    alert('문의 내용을 입력해주세요.');
                    return;
                }
                if (!newInquiry.authorName.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }

                setIsSubmittingNew(true);

                try {
                    await db.collection('abpInquiries').add({
                        // 원본 지점 문의 없이 직접 작성
                        originalInquiryId: null,
                        originalInquiry: null,
                        branchName: '',
                        team: '',
                        position: '',

                        // 기획본부 문의 정보
                        targetTeam: newInquiry.targetTeam,
                        content: newInquiry.content.trim(),
                        authorName: newInquiry.authorName.trim(),

                        // 메타 정보
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('문의가 등록되었습니다.');
                    setShowNewInquiryModal(false);
                } catch (error) {
                    console.error('문의 저장 오류:', error);
                    alert('문의 저장에 실패했습니다.');
                } finally {
                    setIsSubmittingNew(false);
                }
            };

            // 엑셀 다운로드
            const handleAbpExcelDownload = () => {
                try {
                    // 엑셀 데이터 준비
                    const excelData = filteredInquiries.map((inquiry, index) => ({
                        '번호': index + 1,
                        '담당부서': getTeamName(inquiry.targetTeam),
                        '문의 유형': getInquiryCategoryText(inquiry),
                        '지점명': inquiry.branchName || '-',
                        '지점 담당자': branchManagerMap[inquiry.branchName] || '-',
                        '직함': inquiry.position || '-',
                        '문의 내용': inquiry.content || '-',
                        '원본 문의 제목': inquiry.originalInquiry?.title || '-',
                        '원본 문의 내용': inquiry.originalInquiry?.content || '-',
                        '상태': inquiry.status === 'answered' ? '답변완료' : '대기중',
                        '답변': inquiry.reply || '-',
                        '작성일': formatDateLocal(inquiry.createdAt),
                        '답변 작성자': inquiry.replyAuthor || '-',
                        '답변 작성일시': inquiry.repliedAt ? formatDateLocal(inquiry.repliedAt) : '-'
                    }));

                    // 워크시트 생성
                    const ws = XLSX.utils.json_to_sheet(excelData);

                    // 컬럼 너비 설정
                    const colWidths = [
                        { wch: 8 },   // 번호
                        { wch: 20 },  // 담당부서
                        { wch: 28 },  // 문의 유형
                        { wch: 20 },  // 지점명
                        { wch: 15 },  // 지점 담당자
                        { wch: 12 },  // 직함
                        { wch: 50 },  // 문의 내용
                        { wch: 30 },  // 원본 문의 제목
                        { wch: 50 },  // 원본 문의 내용
                        { wch: 12 },  // 상태
                        { wch: 50 },  // 답변
                        { wch: 18 },  // 작성일
                        { wch: 15 },  // 답변 작성자
                        { wch: 18 }   // 답변 작성일시
                    ];
                    ws['!cols'] = colWidths;

                    // 워크북 생성
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, '기획본부 문의 목록');

                    // 파일명 생성 (현재 날짜 포함)
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                    const filename = `기획본부_소통_창구_${dateStr}.xlsx`;

                    // 다운로드
                    XLSX.writeFile(wb, filename);
                } catch (error) {
                    console.error('엑셀 다운로드 오류:', error);
                    alert('엑셀 다운로드에 실패했습니다.');
                }
            };

            if (loading) {
                return (
                    <div className="loading-spinner">
                        <p>기획본부 문의 목록을 불러오는 중...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">기획본부 소통 창구</h2>
                        <p className="page-subtitle">기획본부에 보낸 문의와 답변을 확인합니다</p>
                    </div>

                    {/* 전체 통계 대시보드 */}
                    <div style={{marginBottom: '30px'}}>
                        <div className="stat-card" style={{
                            background: 'linear-gradient(135deg, #0d3b36 0%, #1a5c54 100%)',
                            padding: '30px'
                        }}>
                            <h3 style={{fontSize: '16px', marginBottom: '25px', opacity: 1}}>전체 현황</h3>
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: 'repeat(4, 1fr)',
                                gap: '30px'
                            }}>
                                <div style={{textAlign: 'center', borderRight: '1px solid rgba(255,255,255,0.15)'}}>
                                    <div style={{fontSize: '13px', opacity: 0.8, marginBottom: '10px'}}>전체 문의</div>
                                    <div style={{fontSize: '36px', fontWeight: '700'}}>{totalAbpInquiries}</div>
                                </div>
                                <div style={{textAlign: 'center', borderRight: '1px solid rgba(255,255,255,0.15)'}}>
                                    <div style={{fontSize: '13px', opacity: 0.8, marginBottom: '10px'}}>대기중</div>
                                    <div style={{fontSize: '36px', fontWeight: '700', color: '#fbbf24'}}>{totalAbpPending}</div>
                                </div>
                                <div style={{textAlign: 'center', borderRight: '1px solid rgba(255,255,255,0.15)'}}>
                                    <div style={{fontSize: '13px', opacity: 0.8, marginBottom: '10px'}}>답변완료</div>
                                    <div style={{fontSize: '36px', fontWeight: '700', color: '#34d399'}}>{totalAbpAnswered}</div>
                                </div>
                                <div style={{textAlign: 'center'}}>
                                    <div style={{fontSize: '13px', opacity: 0.8, marginBottom: '10px'}}>답변 완료율</div>
                                    <div style={{fontSize: '36px', fontWeight: '700', color: '#60a5fa'}}>{totalAbpCompletionRate}%</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 팀별 통계 대시보드 */}
                    <div className="stats-grid">
                        {abpTeamStats.map((team, index) => (
                            <div key={team.name} className="stat-card" style={{
                                background: `linear-gradient(135deg, ${['#0d3b36', '#1a5f7a', '#0f3460', '#159895', '#1a1a2e'][index]} 0%, ${['#1a5c54', '#159895', '#1a5f7a', '#0d3b36', '#16213e'][index]} 100%)`
                            }}>
                                <h3>{team.name}</h3>
                                <div className="value">{team.completionRate}%</div>
                                <div style={{
                                    fontSize: '13px',
                                    opacity: 0.85,
                                    marginTop: '12px',
                                    display: 'flex',
                                    justifyContent: 'space-between'
                                }}>
                                    <span>전체 {team.total}건</span>
                                    <span>대기 {team.pending}건</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="content-area">
                        <div className="page-header-actions">
                            <div style={{display: 'flex', alignItems: 'center', gap: '15px'}}>
                                <h3 className="section-title" style={{marginBottom: 0}}>
                                    문의 목록 ({filteredInquiries.length}건)
                                </h3>
                                {selectedAbpInquiries.length > 0 && (
                                    <span style={{fontSize: '14px', color: '#10b981'}}>{selectedAbpInquiries.length}개 선택됨</span>
                                )}
                            </div>
                            <div style={{display: 'flex', gap: '10px'}}>
                                <button
                                    onClick={handleAbpExcelDownload}
                                    style={{
                                        padding: '8px 16px',
                                        background: 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)',
                                        color: 'white',
                                        border: 'none',
                                        borderRadius: '6px',
                                        fontSize: '13px',
                                        fontWeight: '600',
                                        cursor: 'pointer',
                                        boxShadow: '0 2px 8px rgba(59, 130, 246, 0.3)',
                                        transition: 'all 0.3s ease',
                                        whiteSpace: 'nowrap'
                                    }}
                                    onMouseOver={(e) => {
                                        e.target.style.transform = 'translateY(-2px)';
                                        e.target.style.boxShadow = '0 4px 12px rgba(59, 130, 246, 0.4)';
                                    }}
                                    onMouseOut={(e) => {
                                        e.target.style.transform = 'translateY(0)';
                                        e.target.style.boxShadow = '0 2px 8px rgba(59, 130, 246, 0.3)';
                                    }}
                                >
                                    📊 엑셀 다운로드
                                </button>
                                {selectedAbpInquiries.length > 0 && (
                                    <button className="btn btn-danger btn-sm" onClick={openAbpDeleteModal}>
                                        선택 삭제 ({selectedAbpInquiries.length})
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* 필터 영역 */}
                        <div style={{

                            gap: '20px',
                            alignItems: 'center',
                            flexWrap: 'wrap',
                            padding: '15px 20px',
                            background: '#f8f9fa',
                            borderRadius: '10px',
                            marginBottom: '20px'
                        }}>
                            {/* 부서 필터 */}
                            <div style={{display: 'flex', gap: '8px', alignItems: 'center'}}>
                                <label style={{fontSize: '14px', color: '#666', fontWeight: '500'}}>부서:</label>
                                <select
                                    value={selectedTeamFilter}
                                    onChange={(e) => {
                                        setSelectedTeamFilter(e.target.value);
                                        setSelectedAbpInquiries([]);
                                    }}
                                    style={{
                                        padding: '8px 12px',
                                        borderRadius: '6px',
                                        border: '2px solid #e0e0e0',
                                        fontSize: '14px',
                                        minWidth: '180px'
                                    }}
                                >
                                    <option value="all">전체 부서</option>
                                    {ABP_TEAMS.map(team => (
                                        <option key={team.id} value={team.id}>{team.name}</option>
                                    ))}
                                </select>
                            </div>

                            {/* 작성자 필터 */}
                            <div style={{display: 'flex', gap: '8px', alignItems: 'center'}}>
                                <label style={{fontSize: '14px', color: '#666', fontWeight: '500'}}>작성자:</label>
                                <select
                                    value={selectedAuthorFilter}
                                    onChange={(e) => {
                                        setSelectedAuthorFilter(e.target.value);
                                        setSelectedAbpInquiries([]);
                                    }}
                                    style={{
                                        padding: '8px 12px',
                                        borderRadius: '6px',
                                        border: '2px solid #e0e0e0',
                                        fontSize: '14px',
                                        minWidth: '150px'
                                    }}
                                >
                                    <option value="all">전체 작성자</option>
                                    {authors.map(author => (
                                        <option key={author} value={author}>{author}</option>
                                    ))}
                                </select>
                            </div>

                            {/* 필터 초기화 */}
                            {(selectedTeamFilter !== 'all' || selectedAuthorFilter !== 'all') && (
                                <button
                                    onClick={() => {
                                        setSelectedTeamFilter('all');
                                        setSelectedAuthorFilter('all');
                                        setSelectedAbpInquiries([]);
                                    }}
                                    style={{
                                        padding: '8px 16px',
                                        borderRadius: '6px',
                                        border: 'none',
                                        background: '#6c757d',
                                        color: 'white',
                                        fontSize: '13px',
                                        cursor: 'pointer'
                                    }}
                                >
                                    필터 초기화
                                </button>
                            )}
                        </div>

                        {filteredInquiries.length === 0 ? (
                            <div className="empty-state">
                                <p>기획본부에 보낸 문의가 없습니다.</p>
                            </div>
                        ) : (
                            <>
                            <div style={{ overflowX: 'auto', width: '100%' }}>
                            <table className="data-table" style={{ minWidth: '1580px' }}>
                                <thead>
                                    <tr>
                                        <th style={{width: '40px', textAlign: 'center'}}>
                                            <input
                                                type="checkbox"
                                                checked={paginatedInquiries.length > 0 && paginatedInquiries.every(inquiry => selectedAbpInquiries.includes(inquiry.id))}
                                                onChange={handleSelectAllAbpInquiries}
                                                style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                            />
                                        </th>
                                        <th style={{width: '50px', textAlign: 'center'}}>No</th>
                                        <th style={{width: '100px', textAlign: 'center'}}>상태</th>
                                        <th style={{width: '150px', textAlign: 'center'}}>담당부서</th>
                                        <th style={{width: '200px', textAlign: 'center', whiteSpace: 'nowrap'}}>문의 유형</th>
                                        <th style={{minWidth: '220px', textAlign: 'center', whiteSpace: 'nowrap'}}>지점</th>
                                        <th style={{width: '120px', textAlign: 'center', whiteSpace: 'nowrap'}}>지점 담당자</th>
                                        <th style={{width: '180px'}}>문의 내용</th>
                                        <th style={{width: '100px', textAlign: 'center', whiteSpace: 'nowrap'}}>직함</th>
                                        <th style={{width: '180px', textAlign: 'center', whiteSpace: 'nowrap'}}>작성일</th>
                                        <th style={{width: '120px', textAlign: 'center', whiteSpace: 'nowrap'}}>답변 작성자</th>
                                        <th style={{width: '180px', textAlign: 'center', whiteSpace: 'nowrap'}}>답변 작성일시</th>

                                <tbody>

                                        >

                                                    type="checkbox"
                                                    checked={selectedAbpInquiries.includes(inquiry.id)}
                                                    onChange={() => handleSelectAbpInquiry(inquiry.id)}
                                                    style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                                />
                                            </td>
                                            <td onClick={() => openDetail(inquiry)} style={{textAlign: 'center', color: '#888', fontSize: '13px'}}>{startIndex + index + 1}</td>
                                            <td onClick={() => openDetail(inquiry)} style={{textAlign: 'center'}}>{getStatusBadge(inquiry.status)}</td>
                                            <td onClick={() => openDetail(inquiry)} style={{textAlign: 'center'}}>
                                                <span style={{
                                                    background: '#d1fae5',
                                                    color: '#047857',
                                                    padding: '4px 10px',
                                                    borderRadius: '4px',
                                                    fontSize: '12px',
                                                    fontWeight: '600'
                                                }}>
                                                    {getTeamName(inquiry.targetTeam)}
