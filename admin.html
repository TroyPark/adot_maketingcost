                    )}

                    {/* 원본 지점 문의 모달 (겹창) */}
                    {showOriginalModal && originalInquiryData && (
                        <div className="modal-overlay" style={{zIndex: 1100}} onClick={() => setShowOriginalModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '650px'}}>
                                <div className="modal-header">
                                    <h3 style={{color: '#0369a1'}}>📋 원본 지점 문의</h3>
                                    <button className="modal-close" onClick={() => setShowOriginalModal(false)}>×</button>
                                </div>
                                <div style={{maxHeight: '60vh', overflowY: 'auto'}}>
                                    {/* 문의 정보 */}
                                    <div style={{marginBottom: '20px'}}>
                                        <div style={{display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '15px', flexWrap: 'wrap'}}>
                                            <span style={{
                                                background: originalInquiryData.status === 'answered' ? '#e8f5e9' : '#fff3e0',
                                                color: originalInquiryData.status === 'answered' ? '#388e3c' : '#f57c00',
                                                padding: '4px 10px',
                                                borderRadius: '20px',
                                                fontSize: '12px',
                                                fontWeight: '500'
                                            }}>
                                                {originalInquiryData.status === 'answered' ? '답변완료' : '대기중'}
                                            </span>
                                            <span style={{
                                                background: '#f07c00',
                                                color: 'white',
                                                padding: '4px 10px',
                                                borderRadius: '4px',
                                                fontSize: '12px',
                                                fontWeight: '600'
                                            }}>
                                                {originalInquiryData.branchName}
                                            </span>
                                            {originalInquiryData.team && (
                                                <span style={{
                                                    background: '#e3f2fd',
                                                    color: '#1976d2',
                                                    padding: '4px 10px',
                                                    borderRadius: '4px',
                                                    fontSize: '12px',
                                                    fontWeight: '500'
                                                }}>
                                                    {originalInquiryData.team}
                                                </span>
                                            )}
                                        </div>
                                        
                                        <h4 style={{fontSize: '18px', fontWeight: '600', color: '#1a1a2e', marginBottom: '15px'}}>
                                            {originalInquiryData.title}
                                        </h4>
                                        
                                        <div style={{fontSize: '13px', color: '#666', marginBottom: '10px'}}>
                                            작성자: {originalInquiryData.position || originalInquiryData.userName || '-'} 
                                            {originalInquiryData.userEmail && ` (${originalInquiryData.userEmail})`}
                                        </div>
                                        
                                        <div style={{
                                            background: '#f8f9fa',
                                            padding: '16px',
                                            borderRadius: '8px',
                                            whiteSpace: 'pre-wrap',
                                            lineHeight: '1.6',
                                            color: '#333'
                                        }}>
                                            {originalInquiryData.content}
                                        </div>
                                    </div>

                                    {/* 답변 작성 영역 */}
                                    <div style={{
                                        borderTop: '1px solid #eee',
                                        paddingTop: '20px'
                                    }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '8px',
                                            marginBottom: '12px'
                                        }}>
                                            <span style={{
                                                background: '#e94560',
                                                color: 'white',
                                                padding: '4px 10px',
                                                borderRadius: '4px',
                                                fontSize: '12px',
                                                fontWeight: '600'
                                            }}>
                                                관리자 답변
                                            </span>
                                            {originalInquiryData.repliedAt && (
                                                <span style={{fontSize: '13px', color: '#666'}}>
                                                    {formatDateLocal(originalInquiryData.repliedAt)}
                                                </span>
                                            )}
                                        </div>
                                        <div className="form-group">
                                            <textarea
                                                rows="5"
                                                value={originalReplyText}
                                                onChange={(e) => setOriginalReplyText(e.target.value)}
                                                placeholder="답변 내용을 입력하세요"
                                                style={{
                                                    width: '100%',
                                                    padding: '12px 16px',
                                                    borderRadius: '8px',
                                                    border: '2px solid #e0e0e0',
                                                    fontSize: '14px',
                                                    resize: 'vertical'
                                                }}
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div className="modal-actions" style={{padding: '15px 0 0', borderTop: '1px solid #eee'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowOriginalModal(false)}
                                        disabled={isReplyingOriginal}
                                    >
                                        닫기
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleOriginalReply}
                                        disabled={isReplyingOriginal}
                                    >
                                        {isReplyingOriginal ? '저장 중...' : '답변 저장'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 새 문의 작성 모달 */}
                    {showNewInquiryModal && (
                        <div className="modal-overlay" onClick={() => setShowNewInquiryModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '600px'}}>
                                <div className="modal-header">
                                    <h3 style={{color: '#10b981'}}>📝 기획본부 문의 작성</h3>
                                    <button className="modal-close" onClick={() => setShowNewInquiryModal(false)}>×</button>
                                </div>
                                <div style={{maxHeight: '70vh', overflowY: 'auto'}}>
                                    {/* 문의 부서 선택 */}
                                    <div className="form-group">
                                        <label>문의할 부서 *</label>
                                        <select
                                            value={newInquiry.targetTeam}
                                            onChange={(e) => setNewInquiry({...newInquiry, targetTeam: e.target.value})}
                                            style={{
                                                width: '100%',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                border: '2px solid #e0e0e0',
                                                fontSize: '14px',
                                                background: 'white'
                                            }}
                                        >
                                            <option value="">-- 부서를 선택하세요 --</option>
                                            {ABP_TEAMS.map(team => (
                                                <option key={team.id} value={team.id}>{team.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 작성자 이름 */}
                                    <div className="form-group">
                                        <label>작성자 이름 *</label>
                                        <input
                                            type="text"
                                            value={newInquiry.authorName}
                                            onChange={(e) => setNewInquiry({...newInquiry, authorName: e.target.value})}
                                            placeholder="작성자 이름을 입력하세요"
                                        />
                                    </div>

                                    {/* 문의 내용 */}
                                    <div className="form-group">
                                        <label>문의 내용 *</label>
                                        <textarea
                                            rows="6"
                                            value={newInquiry.content}
                                            onChange={(e) => setNewInquiry({...newInquiry, content: e.target.value})}
                                            placeholder="문의 내용을 입력하세요"
                                            style={{
                                                width: '100%',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                border: '2px solid #e0e0e0',
                                                fontSize: '14px',
                                                resize: 'vertical'
                                            }}
                                        />
                                    </div>
                                </div>
                                <div className="modal-actions" style={{padding: '15px 0 0', borderTop: '1px solid #eee'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowNewInquiryModal(false)}
                                        disabled={isSubmittingNew}
                                    >
                                        취소
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleNewInquirySubmit}
                                        disabled={isSubmittingNew}
                                        style={{background: '#10b981'}}
                                    >
                                        {isSubmittingNew ? '등록 중...' : '문의 등록'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 사이드바 컴포넌트
        function Sidebar({ currentPage, setCurrentPage, user, onLogout, onRoundAccess }) {
            const menuItems = [
                { id: 'inquiry', name: '지점 문의 창구', icon: Icons.Inquiry },
                { id: 'abpComm', name: '기획본부 소통 창구', icon: Icons.AbpComm },
                { id: 'cost', name: '마케팅 비용', icon: Icons.Cost },
                { id: 'round', name: 'Round 관리', icon: Icons.Round },
                { id: 'users', name: '사용자 관리', icon: Icons.Users },
                { id: 'settings', name: '설정', icon: Icons.Settings }
            ];

            // 메뉴 클릭 핸들러
            const handleMenuClick = (itemId) => {
                if (itemId === 'round') {
                    onRoundAccess();
                } else {
                    setCurrentPage(itemId);
                }
            };

            return (
                <aside className="sidebar">
                    <div className="sidebar-header">
                        <div className="admin-badge">ADMIN</div>
                        <h1>관리자 페이지</h1>
                        <p>Marketing Cost Compilater</p>
                    </div>

                    <nav className="sidebar-nav">
                        {menuItems.map(item => (
                            <div
                                key={item.id}
                                className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                                onClick={() => handleMenuClick(item.id)}
                            >
                                <item.icon />
                                <span>{item.name}</span>
                            </div>
                        ))}
                    </nav>

                    <div className="sidebar-footer">
                        <div className="user-info-sidebar">
                            <div className="user-avatar">
                                {user?.email?.charAt(0).toUpperCase()}
                            </div>
                            <div className="user-details">
                                <div className="name">{user?.email}</div>
                                <div className="role">관리자</div>
                            </div>
                        </div>
                        <button className="logout-btn" onClick={onLogout}>
                            로그아웃
                        </button>
                    </div>
                </aside>
            );
        }

        // 메인 앱 컴포넌트
        function App() {
            const [currentPage, setCurrentPage] = useState('inquiry');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            
            // Round 관리 접근 관련 상태
            const [showRoundPasswordModal, setShowRoundPasswordModal] = useState(false);
            const [roundPassword, setRoundPassword] = useState('');
            const [roundAccessGranted, setRoundAccessGranted] = useState(false);
            const [isVerifying, setIsVerifying] = useState(false);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    // 사용자 생성 중이면 리다이렉트만 하지 않음 (상태는 업데이트)
                    if (isCreatingUser) {
                        console.log('사용자 생성 중... 리다이렉트 스킵');
                        // 관리자 계정이면 상태만 업데이트
                        if (currentUser && currentUser.email === ADMIN_EMAIL) {
                            setUser(currentUser);
                            setLoading(false);
                        }
                        return;
                    }
                    
                    if (!currentUser) {
                        window.location.href = 'index.html';
                    } else if (currentUser.email !== ADMIN_EMAIL) {
                        window.location.href = 'user.html';
                    } else {
                        setUser(currentUser);
                        setLoading(false);
                    }
                });

                // ===== 보안: 이메일 변조 실시간 감시 시작 =====
                const emailMonitorInterval = startEmailMonitoring();

                return () => {
                    unsubscribe();
                    // 감시 중지
                    if (emailMonitorInterval) {
                        clearInterval(emailMonitorInterval);
                    }
                };
            }, []);

            // Round 관리 페이지 접근 시도
            const handleRoundAccess = () => {
                if (roundAccessGranted) {
                    setCurrentPage('round');
                } else {
                    setRoundPassword('');
                    setShowRoundPasswordModal(true);
                }
            };

            // Round 비밀번호 확인 (Firestore에서 검증)
            const handleRoundPasswordSubmit = async (e) => {
                e.preventDefault();
                setIsVerifying(true);
                
                try {
                    // Firestore에서 비밀번호 가져오기
                    const doc = await db.collection('settings').doc('roundPassword').get();
                    
                    if (!doc.exists) {
                        // 비밀번호가 설정되지 않은 경우 기본값으로 생성
                        await db.collection('settings').doc('roundPassword').set({
                            password: 'round1234',
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert('Round 비밀번호가 초기 설정되었습니다. 기본 비밀번호: round1234');
                        setIsVerifying(false);
                        return;
                    }
                    
                    const storedPassword = doc.data().password;
                    
                    if (roundPassword === storedPassword) {
                        setRoundAccessGranted(true);
                        setShowRoundPasswordModal(false);
                        setCurrentPage('round');
                        setRoundPassword('');
                    } else {
                        alert('비밀번호가 올바르지 않습니다.');
                        setRoundPassword('');
                    }
                } catch (error) {
                    console.error('비밀번호 확인 오류:', error);
                    alert('비밀번호 확인에 실패했습니다.');
                } finally {
                    setIsVerifying(false);
                }
            };

            const handleLogout = async () => {
                if (confirm('로그아웃 하시겠습니까?')) {
                    const result = await logout();
                    if (result.success) {
                        window.location.href = 'index.html';
                    } else {
                        alert('로그아웃 실패: ' + result.message);
                    }
                }
            };

            if (loading) {
                return <div className="loading">로딩 중...</div>;
            }

            const renderPage = () => {
                switch (currentPage) {
                    case 'cost':
                        return <MarketingCostPage />;
                    case 'inquiry':
                        return <InquiryPage />;
                    case 'abpComm':
                        return <AbpCommunicationPage />;
                    case 'round':
                        return <RoundManagementPage />;
                    case 'users':
                        return <UsersPage />;
                    case 'settings':
                        return <SettingsPage />;
                    default:
                        return <MarketingCostPage />;
                }
            };

            return (
                <div className="app-container">
                    <Sidebar
                        currentPage={currentPage}
                        setCurrentPage={setCurrentPage}
                        user={user}
                        onLogout={handleLogout}
                        onRoundAccess={handleRoundAccess}
                    />
                    <main className="main-content">
                        {renderPage()}
                    </main>

                    {/* Round 관리 비밀번호 모달 */}
                    {showRoundPasswordModal && (
                        <div className="modal-overlay" onClick={() => setShowRoundPasswordModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>🔒 Round 관리 접근</h3>
                                    <button className="modal-close" onClick={() => setShowRoundPasswordModal(false)}>×</button>
                                </div>
                                <form onSubmit={handleRoundPasswordSubmit}>
                                    <div className="modal-body">
                                        <p style={{marginBottom: '10px', color: '#666'}}>
                                            Round 관리에 접근하려면 고유 비밀번호를 입력하세요.
                                        </p>
                                        <p style={{marginBottom: '15px', fontSize: '13px', color: '#888'}}>
                                            담당자 : 박영주 / 010-4037-0928
                                        </p>
                                        <div className="form-group">
                                            <label>비밀번호</label>
                                            <input 
                                                type="password"
                                                value={roundPassword}
                                                onChange={(e) => setRoundPassword(e.target.value)}
                                                placeholder="고유 비밀번호를 입력하세요"
                                                required
                                                autoFocus
                                            />
                                        </div>
                                    </div>
                                    <div className="modal-actions" style={{padding: '15px 20px', borderTop: '1px solid #eee', display: 'flex', gap: '10px', justifyContent: 'flex-end'}}>
                                        <button 
                                            type="button" 
                                            className="btn btn-secondary btn-sm"
                                            onClick={() => setShowRoundPasswordModal(false)}
                                            disabled={isVerifying}
                                        >
                                            취소
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="btn btn-sm"
                                            disabled={isVerifying}
                                        >
                                            {isVerifying ? '확인 중...' : '확인'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // React 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
