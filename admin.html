                                        <p style={{fontSize: '14px', color: '#555', lineHeight: '1.5'}}>
                                            {selectedInquiry.content?.substring(0, 200)}
                                            {selectedInquiry.content?.length > 200 ? '...' : ''}
                                        </p>
                                    </div>

                                    {/* 문의 부서 선택 */}
                                    <div className="form-group">
                                        <label>문의할 부서 *</label>
                                        <select
                                            value={abpTargetTeam}
                                            onChange={(e) => setAbpTargetTeam(e.target.value)}
                                            style={{
                                                width: '100%',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                border: '2px solid #e0e0e0',
                                                fontSize: '14px',
                                                background: 'white'
                                            }}
                                        >
                                            <option value="">-- 부서를 선택하세요 --</option>
                                            {ABP_TEAMS.map(team => (
                                                <option key={team.id} value={team.id}>{team.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 작성자 이름 */}
                                    <div className="form-group">
                                        <label>작성자 이름 *</label>
                                        <input
                                            type="text"
                                            value={abpAuthorName}
                                            onChange={(e) => setAbpAuthorName(e.target.value)}
                                            placeholder="작성자 이름을 입력하세요"
                                        />
                                    </div>

                                    {/* 문의 내용 */}
                                    <div className="form-group">
                                        <label>문의 내용 *</label>
                                        <textarea
                                            rows="5"
                                            value={abpContent}
                                            onChange={(e) => setAbpContent(e.target.value)}
                                            placeholder="기획본부에 문의할 내용을 입력하세요"
                                            style={{
                                                width: '100%',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                border: '2px solid #e0e0e0',
                                                fontSize: '14px',
                                                resize: 'vertical'
                                            }}
                                        />
                                    </div>
                                </div>
                                <div className="modal-actions" style={{padding: '15px 0 0', borderTop: '1px solid #eee'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowAbpModal(false)}
                                        disabled={isSubmittingAbp}
                                    >
                                        취소
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleAbpSubmit}
                                        disabled={isSubmittingAbp}
                                        style={{background: '#10b981'}}
                                    >
                                        {isSubmittingAbp ? '전송 중...' : '문의 전송'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }


        // —— abp.html 이식: 전체·팀별 문의함 (TeamInquiryPage) ——
        function TeamInquiryPage({ teamId, allTeams }) {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [selectedInquiry, setSelectedInquiry] = useState(null);
            const [replyText, setReplyText] = useState('');
            const [replyAuthor, setReplyAuthor] = useState('');
            const [replyAttachedFiles, setReplyAttachedFiles] = useState([]); // File[]
            const [isReplying, setIsReplying] = useState(false);

            const [categoryDefRows, setCategoryDefRows] = useState([]);
            const [detailRouteMajorId, setDetailRouteMajorId] = useState('');
            const [detailRouteMinorDocId, setDetailRouteMinorDocId] = useState('');
            const [detailManualTargetTeamId, setDetailManualTargetTeamId] = useState('');
            const [savingCategoryRoute, setSavingCategoryRoute] = useState(false);
            const userPickedCategoryRef = useRef(false);

            const team = allTeams ? null : ABP_TEAMS_NAV.find(t => t.id === teamId);

            const routeMajorOptions = useMemo(() => {
                const m = new Map();
                (categoryDefRows || []).forEach((r) => {
                    if (r.active === false || !r.majorId) return;
                    if (!m.has(r.majorId)) m.set(r.majorId, r.majorLabel || r.majorId);
                });
                const list = Array.from(m.entries())
                    .map(([majorId, majorLabel]) => ({ majorId, majorLabel }))
                    .sort((a, b) => a.majorLabel.localeCompare(b.majorLabel, 'ko'));
                // 「담당부서 지정」은 코드 주입 (Firestore 정의에 없어도 항상 노출)
                return [{ majorId: ABP_MANUAL_TEAM_MAJOR_ID, majorLabel: '담당부서 지정' }, ...list];
            }, [categoryDefRows]);

            const routeMinorOptions = useMemo(() => {
                if (!detailRouteMajorId) return [];
                if (detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID) return [];
                return (categoryDefRows || [])
                    .filter((r) => r.active !== false && r.majorId === detailRouteMajorId)
                    .slice()
                    .sort((a, b) => (a.minorLabel || '').localeCompare(b.minorLabel || '', 'ko'));
            }, [categoryDefRows, detailRouteMajorId]);

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        const list = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
                        setCategoryDefRows(list);
                    },
                    (err) => console.error('[inquiryCategoryDefinitions] 로드:', err)
                );
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!showDetailModal || !selectedInquiry) return;
                if (userPickedCategoryRef.current) return;
                const inv = selectedInquiry;
                if (inv.inquiryMajor === ABP_MANUAL_TEAM_MAJOR_ID) {
                    setDetailRouteMajorId(ABP_MANUAL_TEAM_MAJOR_ID);
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId(inv.targetTeam || inv.abpTargetTeam || inv.inquiryMinor || '');
                    return;
                }
                const hit = categoryDefRows.find(
                    (r) =>
                        r.active !== false &&
                        r.majorId === inv.inquiryMajor &&
                        String(r.minorId ?? '') === String(inv.inquiryMinor ?? '')
                );
                if (hit) {
                    setDetailRouteMajorId(hit.majorId || '');
                    setDetailRouteMinorDocId(hit.id || '');
                    setDetailManualTargetTeamId('');
                } else {
                    setDetailRouteMajorId('');
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId('');
                }
            }, [showDetailModal, selectedInquiry, categoryDefRows]);

            // 해당 팀 또는 전체 문의글 로드
            useEffect(() => {
                const base = db.collection('abpInquiries');
                const unsubscribe = (allTeams ? base : base.where('targetTeam', '==', teamId))
                    .onSnapshot((snapshot) => {
                        let data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 전체 문의함: 팀 미배정·구 스키마 문의는 팀함과 합계가 맞도록 제외
                        if (allTeams) {
                            data = data.filter((row) => isKnownAbpTargetTeam(row.targetTeam));
                        }
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);
                        setLoading(false);
                    }, (error) => {
                        console.error('문의글 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, [teamId, allTeams]);

            // 상세보기
            const openDetail = (inquiry) => {
                userPickedCategoryRef.current = false;
                setReplyText(inquiry.reply || '');
                setReplyAuthor(inquiry.replyAuthor || '');
                setReplyAttachedFiles([]);
                setSelectedInquiry(inquiry);
                setShowDetailModal(true);
                if (inquiry.originalInquiryId) {
                    db.collection('inquiries')
                        .doc(inquiry.originalInquiryId)
                        .get()
                        .then((snap) => {
                            if (!snap.exists) return;
                            const d = snap.data();
                            setSelectedInquiry((prev) => {
                                if (!prev || prev.id !== inquiry.id) return prev;
                                return {
                                    ...prev,
                                    inquiryMajor: prev.inquiryMajor || d.inquiryMajor,
                                    inquiryMinor: prev.inquiryMinor || d.inquiryMinor,
                                    inquiryMajorLabel: prev.inquiryMajorLabel || d.inquiryMajorLabel,
                                    inquiryMinorLabel: prev.inquiryMinorLabel || d.inquiryMinorLabel,
                                    // 문의자 첨부는 Firestore inquiries 에만 있음 — 상세 표시용 병합
                                    attachments: Array.isArray(d.attachments) ? d.attachments : prev.attachments
                                };
                            });
                        })
                        .catch((err) => console.warn('inquiries 보강 로드:', err));
                }
            };

            const handleSaveInquiryCategoryRoute = async () => {
                if (!selectedInquiry) return;
                if (!detailRouteMajorId) {
                    alert('대분류를 선택해주세요.');
                    return;
                }
                setSavingCategoryRoute(true);
                const isManual = detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID;
                const str = (v) => (v != null && v !== undefined ? String(v) : '');
                let abpPayload;
                let invPayload;
                if (isManual) {
                    if (!detailManualTargetTeamId) {
                        alert('담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(detailManualTargetTeamId)) {
                        alert('유효한 담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const teamMeta = ABP_TEAM_BY_ID[detailManualTargetTeamId];
                    abpPayload = {
                        targetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId),
                        abpRoutedBy: 'manual_team'
                    };
                    invPayload = {
                        abpTargetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId)
                    };
                } else {
                    if (!detailRouteMinorDocId) {
                        alert('중분류를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const def = categoryDefRows.find((r) => r.id === detailRouteMinorDocId);
                    if (!def || !def.targetTeam) {
                        alert('선택한 분류를 찾을 수 없습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(def.targetTeam)) {
                        alert('분류에 연결된 담당 팀이 올바르지 않습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    abpPayload = {
                        targetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel),
                        abpRoutedBy: 'firestore'
                    };
                    invPayload = {
                        abpTargetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel)
                    };
                }
                try {
                    await db.collection('abpInquiries').doc(selectedInquiry.id).update({
                        ...abpPayload,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    let inquiriesSyncFailed = false;
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db
                                .collection('inquiries')
                                .doc(selectedInquiry.originalInquiryId)
                                .update({
                                    ...invPayload,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                        } catch (syncErr) {
                            inquiriesSyncFailed = true;
                            console.error('inquiries 동기화 오류(분류):', syncErr);
                            alert(
                                '기획본부함에는 반영되었습니다.\n\n' +
                                    '다만 지점 문의(inquiries) 동기화에 실패했습니다. Firestore 규칙에서 기획본부 계정이 해당 지점 문의 문서를 수정할 수 있는지 확인해 주세요.\n\n' +
                                    (syncErr.code ? `[${syncErr.code}] ` : '') +
                                    (syncErr.message || String(syncErr))
                            );
                        }
                    }

                    setSelectedInquiry((prev) =>
                        prev
                            ? {
                                  ...prev,
                                  ...abpPayload
                              }
                            : prev
                    );
                    userPickedCategoryRef.current = false;
                    if (!inquiriesSyncFailed) {
                        alert('담당 팀이 선택한 분류에 맞게 반영되었습니다.');
                    }
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('abpInquiries 분류 반영 오류:', error);
                    alert(
                        '기획본부 문의(abpInquiries) 저장에 실패했습니다.\n\n' +
                            (error.code ? `[${error.code}] ` : '') +
                            (error.message || String(error))
                    );
                } finally {
                    setSavingCategoryRoute(false);
                }
            };

            // 답변 저장
            const handleReply = async () => {
                if (!replyText.trim()) {
                    alert('답변 내용을 입력해주세요.');
                    return;
                }
                if (!replyAuthor.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }
                const existingReplyAttachments = Array.isArray(selectedInquiry?.replyAttachments)
                    ? selectedInquiry.replyAttachments
                    : [];
                if (existingReplyAttachments.length + (replyAttachedFiles?.length || 0) > 5) {
                    alert('첨부파일은 최대 5개까지 가능합니다.');
                    return;
                }

                setIsReplying(true);

                try {
                    const abpRef = db.collection('abpInquiries').doc(selectedInquiry.id);
                    const newReplyAttachments = await uploadInquiryAttachments({
                        files: replyAttachedFiles,
                        inquiryId: selectedInquiry.id
                    });
                    const payload = {
                        reply: replyText.trim(),
                        replyAuthor: replyAuthor.trim(),
                        status: 'answered',
                        repliedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        replyAttachments: [...existingReplyAttachments, ...newReplyAttachments]
                    };

                    // 1) 기획본부 문의에만 먼저 저장 (배치에 inquiries를 넣으면 규칙/문서 문제 시 전부 실패할 수 있음)
                    await abpRef.update(payload);

                    // 2) 지점 원본 문의(inquiries) 동기화 — 사용자 화면은 inquiries만 구독함
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db.collection('inquiries').doc(selectedInquiry.originalInquiryId).update(payload);
                        } catch (syncErr) {
                            console.error('inquiries 동기화 오류:', syncErr);
                            alert(
                                '기획본부 문의에는 답변이 저장되었습니다.\n\n' +
                                '다만 지점 문의(inquiries)에 반영되지 않았습니다. (Firestore 규칙에서 기획본부 계정의 inquiries 업데이트 허용 여부를 확인해 주세요.)\n' +
                                (syncErr.message || String(syncErr))
                            );
                            setShowDetailModal(false);
                            return;
                        }
                    }

                    alert('답변이 저장되었습니다.');
                    setReplyAttachedFiles([]);
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('답변 저장 오류:', error);
                    alert('답변 저장에 실패했습니다: ' + (error.message || error));
                } finally {
                    setIsReplying(false);
                }
            };

            // 상태 배지
            const getStatusBadge = (status) => {
                if (status === 'answered') {
                    return <span className="status-badge answered">답변완료</span>;
                }
                return <span className="status-badge pending">대기중</span>;
            };

            const getInquiryTeamMeta = (inquiry) => {
                const t = inquiry?.targetTeam && ABP_TEAM_BY_ID[inquiry.targetTeam];
                return t || { name: inquiry?.targetTeam || '-', className: '' };
            };

            const getInquiryCategoryText = (inquiry) => {
                const major = inquiry?.inquiryMajorLabel || inquiry?.inquiryMajor || '';
                const minor = inquiry?.inquiryMinorLabel || inquiry?.inquiryMinor || '';
                if (!major && !minor) return '-';
                if (!minor) return major || '-';
                if (!major) return minor || '-';
                return `${major} › ${minor}`;
            };

            if (loading) {
                return (
                    <div className="loading-spinner">
                        <p>문의 목록을 불러오는 중...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">{allTeams ? '전체 문의함' : team?.name}</h2>
                        <p className="page-subtitle">
                            {allTeams
                                ? '팀별 문의함에 분산된 문의를 한곳에서 최신순으로 확인합니다'
                                : '지점에서 접수된 문의사항에 답변합니다'}
                        </p>
                    </div>

                    {/* 통계 카드 */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <h3>전체 문의</h3>
                            <div className="value">{inquiries.length}</div>
                        </div>
                        <div className="stat-card">
                            <h3>대기중</h3>
                            <div className="value">{inquiries.filter(i => i.status === 'pending').length}</div>
                        </div>
                        <div className="stat-card">
                            <h3>답변완료</h3>
                            <div className="value">{inquiries.filter(i => i.status === 'answered').length}</div>
                        </div>
                    </div>

                    <div className="content-area">
                        <div className="page-header-actions">
                            <h3 className="section-title" style={{ marginBottom: 0 }}>
                                문의 목록 ({inquiries.length}건)
                            </h3>
                        </div>

                        {inquiries.length === 0 ? (
                            <div className="empty-state">
                                <p>접수된 문의가 없습니다.</p>
                            </div>
                        ) : (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th style={{width: '50px', textAlign: 'center'}}>No</th>
                                        <th style={{width: '100px'}}>상태</th>
                                        {allTeams && (
                                            <th style={{width: '120px'}}>담당 팀</th>
                                        )}
                                        <th style={{width: '210px'}}>문의 유형</th>
                                        <th>문의 내용</th>
                                        <th style={{width: '100px'}}>작성자</th>
                                        <th style={{width: '160px'}}>작성일</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {inquiries.map((inquiry, index) => (
                                        <tr
                                            key={inquiry.id}
                                            onClick={() => openDetail(inquiry)}
                                            style={{
                                                cursor: 'pointer'
                                            }}
                                        >
                                            <td style={{textAlign: 'center', color: '#888', fontSize: '13px'}}>{index + 1}</td>
                                            <td>{getStatusBadge(inquiry.status)}</td>
                                            {allTeams && (
                                                <td style={{fontSize: '13px'}}>
                                                    <span className={`team-badge ${getInquiryTeamMeta(inquiry).className}`}>
                                                        {getInquiryTeamMeta(inquiry).name}
                                                    </span>
                                                </td>
                                            )}
                                            <td style={{ fontSize: '13px', color: '#334155' }}>
                                                {getInquiryCategoryText(inquiry)}
                                            </td>
                                            <td style={{
                                                maxWidth: '300px',
                                                overflow: 'hidden',
                                                textOverflow: 'ellipsis',
                                                whiteSpace: 'nowrap'
                                            }}>
                                                {inquiry.content}
                                            </td>
                                            <td style={{fontSize: '13px'}}>{inquiry.authorName || '-'}</td>
                                            <td style={{fontSize: '13px', color: '#666'}}>{formatDate(inquiry.createdAt)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>

                    {/* 문의 상세/답변 모달 */}
                    {showDetailModal && selectedInquiry && (
                        <div className="modal-overlay" onClick={() => setShowDetailModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>문의 상세</h3>
                                    <button className="modal-close" onClick={() => setShowDetailModal(false)}>×</button>
                                </div>
                                <div style={{maxHeight: '70vh', overflowY: 'auto'}}>
                                    {/* 문의 정보 */}
                                    <div style={{marginBottom: '20px'}}>
                                        <div style={{display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '15px'}}>
                                            {getStatusBadge(selectedInquiry.status)}
                                            <span style={{fontSize: '13px', color: '#666', marginLeft: 'auto'}}>
                                                {formatDate(selectedInquiry.createdAt)}
                                            </span>
                                        </div>

                                        {/* 원본 지점 문의 내용 */}
                                        {selectedInquiry.originalInquiry && (
                                            <div className="original-inquiry-box">
                                                <p><strong>{selectedInquiry.originalInquiry.title}</strong></p>
                                                <p style={{marginTop: '8px', color: '#555'}}>{selectedInquiry.originalInquiry.content}</p>
                                            </div>
                                        )}

                                        {Array.isArray(selectedInquiry.attachments) && selectedInquiry.attachments.length > 0 && (
                                            <div style={{ marginTop: '12px', marginBottom: '12px' }}>
                                                <div style={{ fontSize: '12px', color: '#64748b', marginBottom: '6px', fontWeight: '600' }}>
                                                    문의 첨부파일
                                                </div>
                                                <ul style={{ margin: 0, paddingLeft: '18px' }}>
                                                    {selectedInquiry.attachments.map((att, idx) => (
                                                        <li key={att.path || att.url || idx} style={{ marginBottom: '6px' }}>
                                                            <a
                                                                href={att.url}
                                                                target="_blank"
                                                                rel="noreferrer"
                                                                style={{ color: '#2563eb', textDecoration: 'underline' }}
                                                            >
                                                                {att.name || `첨부파일 ${idx + 1}`}
                                                            </a>
                                                            {typeof att.size === 'number' && att.size > 0 && (
                                                                <span style={{ marginLeft: '8px', color: '#64748b', fontSize: '12px' }}>
                                                                    ({Math.round(att.size / 1024)}KB)
                                                                </span>
                                                            )}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        <div style={{fontSize: '13px', color: '#666', marginBottom: '10px'}}>
                                            작성자: {selectedInquiry.authorName || '-'}
                                        </div>

                                        <div className="abp-inquiry-category-row">
                                            <span className="abp-inquiry-category-label">문의 유형</span>
                                            <div className="abp-inquiry-category-pair">
                                                <div className="abp-inquiry-category-field">
                                                    <label className="abp-inquiry-category-sublabel" htmlFor="abpDetailMajorSelect">
                                                        대분류
                                                    </label>
                                                    <select
                                                        id="abpDetailMajorSelect"
                                                        className="abp-inquiry-category-select"
                                                        value={detailRouteMajorId}
                                                        onChange={(e) => {
                                                            userPickedCategoryRef.current = true;
                                                            const nextMajor = e.target.value;
                                                            setDetailRouteMajorId(nextMajor);
                                                            if (nextMajor === ABP_MANUAL_TEAM_MAJOR_ID) {
                                                                setDetailRouteMinorDocId('');
                                                                setDetailManualTargetTeamId(
                                                                    selectedInquiry?.targetTeam ||
                                                                        selectedInquiry?.abpTargetTeam ||
                                                                        selectedInquiry?.inquiryMinor ||
                                                                        ''
                                                                );
                                                            } else {
                                                                setDetailManualTargetTeamId('');
                                                                const minors = (categoryDefRows || []).filter(
                                                                    (r) => r.active !== false && r.majorId === nextMajor
                                                                );
                                                                setDetailRouteMinorDocId(minors[0]?.id || '');
                                                            }
                                                        }}
                                                    >
                                                        <option value="">— 선택 —</option>
                                                        {routeMajorOptions.map((m) => (
                                                            <option key={m.majorId} value={m.majorId}>
                                                                {m.majorLabel}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                                {detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID ? (
                                                    <div className="abp-inquiry-category-field">
                                                        <label className="abp-inquiry-category-sublabel" htmlFor="abpDetailManualTeamSelect">
                                                            담당 부서
                                                        </label>
                                                        <select
                                                            id="abpDetailManualTeamSelect"
                                                            className="abp-inquiry-category-select"
                                                            value={detailManualTargetTeamId}
                                                            disabled={!detailRouteMajorId}
                                                            onChange={(e) => {
                                                                userPickedCategoryRef.current = true;
                                                                setDetailManualTargetTeamId(e.target.value);
                                                            }}
                                                        >
                                                            <option value="">— 선택 —</option>
                                                            {ABP_TEAMS_NAV.map((t) => (
                                                                <option key={t.id} value={t.id}>
                                                                    {t.name}
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                ) : (
                                                    <div className="abp-inquiry-category-field">
                                                        <label className="abp-inquiry-category-sublabel" htmlFor="abpDetailMinorSelect">
                                                            중분류
                                                        </label>
                                                        <select
                                                            id="abpDetailMinorSelect"
                                                            className="abp-inquiry-category-select"
                                                            value={detailRouteMinorDocId}
                                                            disabled={!detailRouteMajorId}
                                                            onChange={(e) => {
                                                                userPickedCategoryRef.current = true;
                                                                setDetailRouteMinorDocId(e.target.value);
                                                            }}
                                                        >
                                                            <option value="">
                                                                {detailRouteMajorId ? '— 선택 —' : '대분류를 먼저 선택'}
                                                            </option>
                                                            {routeMinorOptions.map((r) => (
                                                                <option key={r.id} value={r.id}>
                                                                    {r.minorLabel || r.minorId}
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                            <button
                                                type="button"
                                                className="btn btn-sm abp-inquiry-category-save"
                                                style={{ background: '#10b981' }}
                                                disabled={
                                                    savingCategoryRoute ||
                                                    !detailRouteMajorId ||
                                                    (detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID
                                                        ? !detailManualTargetTeamId
                                                        : !detailRouteMinorDocId)
                                                }
                                                onClick={handleSaveInquiryCategoryRoute}
                                            >
                                                {savingCategoryRoute ? '저장 중...' : '변경'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* 답변 작성 영역 */}
                                    <div style={{
                                        borderTop: '1px solid #eee',
                                        paddingTop: '20px'
                                    }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '8px',
                                            marginBottom: '12px'
                                        }}>
                                            <span className={`team-badge ${(allTeams ? getInquiryTeamMeta(selectedInquiry).className : team?.className) || ''}`}>
                                                {(allTeams ? getInquiryTeamMeta(selectedInquiry).name : team?.name) || '담당 팀'} 답변
                                            </span>
                                            {selectedInquiry.repliedAt && (
                                                <span style={{fontSize: '13px', color: '#666'}}>
                                                    {formatDate(selectedInquiry.repliedAt)}
                                                </span>
                                            )}
                                        </div>

                                        <div className="form-group">
                                            <label>작성자 이름 *</label>
                                            <input
                                                type="text"
                                                value={replyAuthor}
                                                onChange={(e) => setReplyAuthor(e.target.value)}
                                                placeholder="답변 작성자 이름을 입력하세요"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label>답변 내용 *</label>
                                            <textarea
                                                rows="5"
                                                value={replyText}
                                                onChange={(e) => setReplyText(e.target.value)}
                                                placeholder="답변 내용을 입력하세요"
                                                style={{resize: 'vertical'}}
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label>첨부파일 (최대 5개)</label>
                                            <input
                                                type="file"
                                                multiple
                                                onChange={(e) => {
                                                    const files = Array.from(e.target.files || []);
                                                    if (!files.length) return;
                                                    const existing = Array.isArray(selectedInquiry?.replyAttachments)
                                                        ? selectedInquiry.replyAttachments
                                                        : [];
                                                    if (existing.length + files.length > 5) {
                                                        alert('첨부파일은 최대 5개까지 가능합니다.');
                                                        e.target.value = '';
                                                        return;
                                                    }
                                                    setReplyAttachedFiles(files);
                                                }}
                                                disabled={isReplying}
                                            />
                                            {Array.isArray(replyAttachedFiles) && replyAttachedFiles.length > 0 && (
                                                <ul style={{ margin: '10px 0 0', paddingLeft: '18px', color: '#334155' }}>
                                                    {replyAttachedFiles.map((f, idx) => (
                                                        <li key={`${f.name}_${idx}`} style={{ marginBottom: '6px' }}>
                                                            {f.name}
                                                            {typeof f.size === 'number' && f.size > 0 && (
                                                                <span style={{ marginLeft: '8px', color: '#64748b', fontSize: '12px' }}>
                                                                    ({Math.round(f.size / 1024)}KB)
                                                                </span>
                                                            )}
                                                            <button
                                                                type="button"
                                                                className="btn btn-secondary btn-sm"
                                                                style={{ marginLeft: '10px', padding: '2px 8px' }}
                                                                onClick={() =>
                                                                    setReplyAttachedFiles((prev) =>
                                                                        (prev || []).filter((_, i) => i !== idx)
                                                                    )
                                                                }
                                                                disabled={isReplying}
                                                            >
                                                                제거
                                                            </button>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                            {Array.isArray(selectedInquiry?.replyAttachments) &&
                                                selectedInquiry.replyAttachments.length > 0 && (
                                                    <div style={{ marginTop: '10px' }}>
                                                        <div style={{ fontSize: '12px', color: '#64748b', marginBottom: '6px' }}>
                                                            기존 답변 첨부파일
                                                        </div>
                                                        <ul style={{ margin: 0, paddingLeft: '18px' }}>
                                                            {selectedInquiry.replyAttachments.map((att, idx) => (
                                                                <li key={att.path || att.url || idx} style={{ marginBottom: '6px' }}>
                                                                    <a
                                                                        href={att.url}
                                                                        target="_blank"
                                                                        rel="noreferrer"
                                                                        style={{ color: '#2563eb', textDecoration: 'underline' }}
                                                                    >
                                                                        {att.name || `첨부파일 ${idx + 1}`}
                                                                    </a>
                                                                    {typeof att.size === 'number' && att.size > 0 && (
                                                                        <span
                                                                            style={{
                                                                                marginLeft: '8px',
                                                                                color: '#64748b',
                                                                                fontSize: '12px'
                                                                            }}
                                                                        >
                                                                            ({Math.round(att.size / 1024)}KB)
                                                                        </span>
                                                                    )}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                )}
                                        </div>
                                    </div>
                                </div>
                                <div className="modal-actions" style={{padding: '15px 0 0', borderTop: '1px solid #eee'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowDetailModal(false)}
                                        disabled={isReplying}
                                    >
                                        닫기
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleReply}
                                        disabled={isReplying}
                                    >
                                        {isReplying ? '저장 중...' : '답변 저장'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // —— abp.html 이식: 담당 부서·문의 유형 ——
        // 문의 유형 카테고리 · 담당 부서 (Firestore inquiryCategoryDefinitions 단일 소스)
        function InquiryCategoryDeptPage({ user }) {
            const [rows, setRows] = useState([]);
            const [firestoreError, setFirestoreError] = useState(null);
            const [filterTeam, setFilterTeam] = useState('all');
            const [filterMajor, setFilterMajor] = useState('all');
            const [showInactive, setShowInactive] = useState(false);

            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('add');
            const [editingId, setEditingId] = useState(null);
            const [formMajorId, setFormMajorId] = useState('');
            const [formBootstrapMajorId, setFormBootstrapMajorId] = useState('');
            const [formBootstrapMajorLabel, setFormBootstrapMajorLabel] = useState('');
            /** 분류 추가 시: 기존 대분류 선택 vs 새 대분류 id·표시명 입력 */
            const [addMajorSource, setAddMajorSource] = useState('existing');
            const [formMinorLabel, setFormMinorLabel] = useState('');
            const [formTargetTeam, setFormTargetTeam] = useState('');
            /** 분류 수정 시: true = 사용, false = 비활성 */
            const [formActive, setFormActive] = useState(true);
            const [saving, setSaving] = useState(false);

            const uniqueMajorOptions = useMemo(() => {
                const m = new Map();
                rows.forEach((r) => {
                    if (r.majorId) m.set(r.majorId, r.majorLabel || r.majorId);
                });
                return Array.from(m.entries())
                    .map(([majorId, majorLabel]) => ({ majorId, majorLabel }))
                    .sort((a, b) => a.majorLabel.localeCompare(b.majorLabel, 'ko'));
            }, [rows]);

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        const list = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
                        list.sort((a, b) => {
                            const ta = a.createdAt?.toDate?.() || new Date(0);
                            const tb = b.createdAt?.toDate?.() || new Date(0);
                            return tb - ta;
                        });
                        setRows(list);
                        setFirestoreError(null);
                    },
                    (err) => {
                        if (err.code === 'permission-denied') {
                            console.warn(
                                '[inquiryCategoryDefinitions] 읽기 권한 없음. Firebase 콘솔 규칙을 확인하세요.'
                            );
                            setFirestoreError(null);
                            return;
                        }
                        console.error('문의 유형 정의 로드 오류:', err);
                        setFirestoreError(err.message || String(err));
                    }
                );
                return () => unsub();
            }, []);

            const filteredRows = useMemo(() => {
                return rows.filter((row) => {
                    if (!showInactive && row.active === false) return false;
                    if (filterTeam !== 'all' && row.targetTeam !== filterTeam) return false;
                    if (filterMajor !== 'all' && row.majorId !== filterMajor) return false;
                    return true;
                });
            }, [rows, filterTeam, filterMajor, showInactive]);

            const openAdd = () => {
                setModalMode('add');
                setEditingId(null);
                setAddMajorSource(uniqueMajorOptions.length > 0 ? 'existing' : 'new');
                if (uniqueMajorOptions.length > 0) {
                    setFormMajorId(uniqueMajorOptions[0].majorId);
                    setFormBootstrapMajorId('');
                    setFormBootstrapMajorLabel('');
                } else {
                    setFormMajorId('');
                    setFormBootstrapMajorId('');
                    setFormBootstrapMajorLabel('');
                }
                setFormMinorLabel('');
                setFormTargetTeam('');
                setFormActive(true);
                setShowModal(true);
            };

            const openEdit = (row) => {
                setModalMode('edit');
                setEditingId(row.id);
                setFormMajorId(row.majorId || '');
                setFormBootstrapMajorId('');
                setFormBootstrapMajorLabel('');
                setFormMinorLabel(row.minorLabel || '');
                setFormTargetTeam(row.targetTeam || '');
                setFormActive(row.active !== false);
                setShowModal(true);
            };

            const handleSave = async () => {
                const minor = formMinorLabel.trim();
                if (!minor) {
                    alert('문의 유형 카테고리 명을 입력해주세요.');
                    return;
                }
                if (!formTargetTeam) {
                    alert('담당 부서를 선택해주세요.');
                    return;
                }
                if (!isKnownAbpTargetTeam(formTargetTeam)) {
                    alert('유효한 담당 부서를 선택해주세요.');
                    return;
                }

                let resolvedMajorId;
                let resolvedMajorLabel;
                const useBootstrapMajor =
                    modalMode === 'add' &&
                    (uniqueMajorOptions.length === 0 || addMajorSource === 'new');

                if (useBootstrapMajor) {
                    resolvedMajorId = formBootstrapMajorId.trim();
                    resolvedMajorLabel = formBootstrapMajorLabel.trim();
                    if (!resolvedMajorId || !resolvedMajorLabel) {
                        alert('대분류 id(영문)·대분류 표시명을 모두 입력해주세요.');
                        return;
                    }
                } else {
                    resolvedMajorId = formMajorId;
                    resolvedMajorLabel = inquiryMajorLabelFromRows(formMajorId, rows);
                    if (modalMode === 'add' && !resolvedMajorId) {
                        alert('대분류를 선택해주세요.');
                        return;
                    }
                }

                if (modalMode === 'add') {
                    setSaving(true);
                    try {
                        await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).add({
                            majorId: resolvedMajorId,
                            majorLabel: resolvedMajorLabel,
                            minorId: generateInquiryMinorId(minor),
                            minorLabel: minor,
                            targetTeam: formTargetTeam,
                            active: true,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedByName: getAbpEditorLabel(user),
                            updatedByUid: user?.uid || ''
                        });
                        setShowModal(false);
                    } catch (e) {
                        console.error(e);
                        alert('저장에 실패했습니다: ' + (e.message || e));
                    } finally {
                        setSaving(false);
                    }
                    return;
                }

                if (modalMode === 'edit' && editingId) {
                    setSaving(true);
                    try {
                        await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(editingId).update({
                            majorId: resolvedMajorId,
                            majorLabel: resolvedMajorLabel,
                            minorLabel: minor,
                            targetTeam: formTargetTeam,
                            active: formActive,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedByName: getAbpEditorLabel(user),
                            updatedByUid: user?.uid || ''
                        });
                        setShowModal(false);
                    } catch (e) {
                        console.error(e);
                        alert('수정에 실패했습니다: ' + (e.message || e));
                    } finally {
                        setSaving(false);
                    }
                }
            };

            const handleSoftDelete = async (row) => {
                if (!confirm(`「${row.majorLabel || inquiryMajorLabelFromRows(row.majorId, rows)} › ${row.minorLabel}」 분류를 비활성화할까요?`)) return;
                try {
                    await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(row.id).update({
                        active: false,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedByName: getAbpEditorLabel(user),
                        updatedByUid: user?.uid || ''
                    });
                } catch (e) {
                    console.error(e);
                    alert('삭제 처리에 실패했습니다: ' + (e.message || e));
                }
            };

            const handleRestore = async (row) => {
                try {
                    await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(row.id).update({
                        active: true,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedByName: getAbpEditorLabel(user),
                        updatedByUid: user?.uid || ''
                    });
                } catch (e) {
                    console.error(e);
                    alert('복구에 실패했습니다: ' + (e.message || e));
                }
            };

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">담당 부서 / 문의 유형</h2>
                    </div>

                    {firestoreError && (
                        <div
                            style={{
                                margin: '0 24px 12px',
                                padding: '12px 16px',
                                background: '#fef2f2',
                                color: '#991b1b',
                                borderRadius: '8px',
                                fontSize: '14px'
                            }}
                        >
                            Firestore 연동 오류: {firestoreError}
                        </div>
                    )}

                    <div className="content-area">
                        <div style={{ marginBottom: '20px' }}>
                            <div
                                style={{
                                    display: 'flex',
                                    flexWrap: 'wrap',
                                    gap: '12px',
                                    alignItems: 'center',
                                    padding: '12px 16px',
                                    background: '#f8fafc',
                                    borderRadius: '10px'
                                }}
                            >
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    <label style={{ fontSize: '12px', color: '#64748b' }}>팀 / 부서</label>
                                    <select
                                        value={filterTeam}
                                        onChange={(e) => setFilterTeam(e.target.value)}
                                        style={{
                                            padding: '8px 12px',
                                            borderRadius: '8px',
                                            border: '1px solid #e2e8f0',
                                            minWidth: '160px'
                                        }}
                                    >
                                        <option value="all">전체</option>
                                        {ABP_TEAM_DEFS.map((t) => (
                                            <option key={t.id} value={t.id}>
                                                {t.name}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    <label style={{ fontSize: '12px', color: '#64748b' }}>유형(대분류)</label>
                                    <select
                                        value={filterMajor}
                                        onChange={(e) => setFilterMajor(e.target.value)}
                                        style={{
                                            padding: '8px 12px',
                                            borderRadius: '8px',
                                            border: '1px solid #e2e8f0',
                                            minWidth: '200px'
                                        }}
                                    >
                                        <option value="all">전체</option>
                                        {uniqueMajorOptions.map((m) => (
                                            <option key={m.majorId} value={m.majorId}>
                                                {m.majorLabel}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <label
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '8px',
                                        cursor: 'pointer',
                                        alignSelf: 'flex-end',
                                        paddingBottom: '2px'
                                    }}
                                >
                                    <input
                                        type="checkbox"
                                        checked={showInactive}
                                        onChange={(e) => setShowInactive(e.target.checked)}
                                    />
                                    <span style={{ fontSize: '13px', color: '#475569', whiteSpace: 'nowrap' }}>
                                        비활성 포함
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div className="inquiry-category-section-head">
                            <h3 className="section-title">문의 유형 카테고리 ({filteredRows.length}건)</h3>
                            <button type="button" className="btn btn-sm" onClick={openAdd} style={{ background: '#10b981' }}>
                                + 분류 추가
                            </button>
                        </div>

                        {filteredRows.length === 0 ? (
                            <div className="empty-state">
                                <p>{rows.length === 0 ? '등록된 분류가 없습니다. 상단에서 분류를 추가하세요.' : '조건에 맞는 분류가 없습니다.'}</p>
                            </div>
                        ) : (
                            <div style={{ overflowX: 'auto' }}>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th style={{ width: '44px', textAlign: 'center' }}>No</th>
                                            <th style={{ minWidth: '240px' }}>문의 유형 카테고리</th>
                                            <th style={{ width: '140px' }}>담당 부서</th>
                                            <th style={{ width: '100px', textAlign: 'center' }}>상태</th>
                                            <th style={{ width: '100px' }}>최종 수정자</th>
                                            <th style={{ width: '150px' }}>생성일</th>
                                            <th style={{ width: '140px', textAlign: 'center' }}>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredRows.map((row, index) => {
                                            const teamMeta = ABP_TEAM_BY_ID[row.targetTeam];
                                            const path = `${row.majorLabel || inquiryMajorLabelFromRows(row.majorId, rows)} › ${row.minorLabel || '-'}`;
                                            return (
                                                <tr key={row.id} style={{ opacity: row.active === false ? 0.65 : 1 }}>
                                                    <td style={{ textAlign: 'center', color: '#94a3b8' }}>{index + 1}</td>
                                                    <td style={{ fontSize: '14px' }}>{path}</td>
                                                    <td>
                                                        <span
                                                            className={`team-badge ${teamMeta?.className || ''}`}
                                                            style={{ fontSize: '12px' }}
                                                        >
                                                            {teamMeta?.name || row.targetTeam || '-'}
                                                        </span>
                                                    </td>
                                                    <td style={{ textAlign: 'center', fontSize: '12px' }}>
