        // Round 관리 페이지
        function RoundManagementPage() {
            const [activeTab, setActiveTab] = useState('date');
            const [branches, setBranches] = useState([]);
            const [costs, setCosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [rounds, setRounds] = useState([]);
            const [newRound, setNewRound] = useState({
                name: '',
                startDate: '',
                endDate: ''
            });

            // Round 수정 관련 상태
            const [editingRound, setEditingRound] = useState(null);
            const [editFormData, setEditFormData] = useState({
                name: '',
                startDate: '',
                endDate: ''
            });

            // 지점별 비용 배정 관련 상태
            const [selectedRoundId, setSelectedRoundId] = useState('');
            const [branchBudgets, setBranchBudgets] = useState({});
            const [isSavingBudget, setIsSavingBudget] = useState(false);

            // 금액 포맷
            const formatAmount = (amount) => {
                return new Intl.NumberFormat('ko-KR', {
                    style: 'currency',
                    currency: 'KRW'
                }).format(amount);
            };

            // 데이터 로드
            useEffect(() => {
                const loadData = async () => {
                    setLoading(true);

                    // 사용자 목록에서 지점명 가져오기
                    const usersResult = await getAllUsers();
                    if (usersResult.success) {
                        const branchSet = new Set();
                        usersResult.users.forEach(user => {
                            if (user.branchName) {
                                branchSet.add(user.branchName);
                            }
                        });
                        setBranches([...branchSet].sort());
                    }

                    // 비용 데이터 로드
                    const unsubscribe = db.collection('costs')
                        .onSnapshot((snapshot) => {
                            const costsData = snapshot.docs.map(doc => ({
                                id: doc.id,
                                ...doc.data()
                            }));
                            setCosts(costsData);
                            setLoading(false);
                        });

                    // Round 목록 로드
                    const roundsUnsubscribe = db.collection('rounds')
                        .orderBy('createdAt', 'desc')
                        .onSnapshot((snapshot) => {
                            const roundsData = snapshot.docs.map(doc => ({
                                id: doc.id,
                                ...doc.data()
                            }));
                            setRounds(roundsData);
                        });

                    return () => {
                        unsubscribe();
                        roundsUnsubscribe();
                    };
                };

                loadData();
            }, []);

            // 지점별 비용 계산 (선택된 라운드 기간 내)
            const getBranchCosts = (branchName) => {
                const selectedRound = rounds.find(r => r.id === selectedRoundId);

                return costs
                    .filter(cost => {
                        if (cost.branchName !== branchName) return false;

                        // 라운드가 선택된 경우 해당 기간 내 비용만 계산
                        if (selectedRound) {
                            const costDate = new Date(cost.date);
                            const startDate = new Date(selectedRound.startDate);
                            const endDate = new Date(selectedRound.endDate);
                            endDate.setHours(23, 59, 59, 999);
                            return costDate >= startDate && costDate <= endDate;
                        }

                        return true;
                    })
                    .reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // 지점별 비용 건수 (선택된 라운드 기간 내)
            const getBranchCostCount = (branchName) => {
                const selectedRound = rounds.find(r => r.id === selectedRoundId);

                return costs.filter(cost => {
                    if (cost.branchName !== branchName) return false;

                    if (selectedRound) {
                        const costDate = new Date(cost.date);
                        const startDate = new Date(selectedRound.startDate);
                        const endDate = new Date(selectedRound.endDate);
                        endDate.setHours(23, 59, 59, 999);
                        return costDate >= startDate && costDate <= endDate;
                    }

                    return true;
                }).length;
            };

            // 라운드 선택 시 배정 비용 로드
            const handleRoundSelect = async (roundId) => {
                setSelectedRoundId(roundId);

                if (!roundId) {
                    setBranchBudgets({});
                    return;
                }

                try {
                    const doc = await db.collection('roundBudgets').doc(roundId).get();
                    if (doc.exists) {
                        setBranchBudgets(doc.data().budgets || {});
                    } else {
                        // 초기값 설정 (모든 지점 0원)
                        const initialBudgets = {};
                        branches.forEach(branch => {
                            initialBudgets[branch] = 0;
                        });
                        setBranchBudgets(initialBudgets);
                    }
                } catch (error) {
                    console.error('배정 비용 로드 오류:', error);
                    setBranchBudgets({});
                }
            };

            // 지점별 배정 비용 변경
            const handleBudgetChange = (branch, value) => {
                const numericValue = value.replace(/[^\d]/g, '');
                setBranchBudgets(prev => ({
                    ...prev,
                    [branch]: Number(numericValue) || 0
                }));
            };

            // 배정 비용 저장
            const handleSaveBudgets = async () => {
                if (!selectedRoundId) {
                    alert('라운드를 선택해주세요.');
                    return;
                }

                setIsSavingBudget(true);

                try {
                    await db.collection('roundBudgets').doc(selectedRoundId).set({
                        roundId: selectedRoundId,
                        budgets: branchBudgets,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert('배정 비용이 저장되었습니다.');
                } catch (error) {
                    console.error('배정 비용 저장 오류:', error);
                    alert('배정 비용 저장에 실패했습니다.');
                } finally {
                    setIsSavingBudget(false);
                }
            };

            // 금액 입력 포맷
            const formatBudgetInput = (value) => {
                return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            };

            // 전체 배정 비용 합계
            const getTotalBudget = () => {
                return Object.values(branchBudgets).reduce((sum, val) => sum + Number(val || 0), 0);
            };

            // 지점별 비용 엑셀 다운로드
            const handleExportBranchCosts = () => {
                if (branches.length === 0) {
                    alert('내보낼 데이터가 없습니다.');
                    return;
                }

                const selectedRound = rounds.find(r => r.id === selectedRoundId);
                const roundName = selectedRound ? selectedRound.name : '전체';

                // CSV 데이터 생성
                const headers = ['지점명', '배정 비용', '사용 비용', '잔여 비용', '사용률(%)'];
                const rows = branches.map(branch => {
                    const budget = branchBudgets[branch] || 0;
                    const used = getBranchCosts(branch);
                    const remaining = budget - used;
                    const usageRate = budget > 0 ? Math.round((used / budget) * 100) : 0;
                    return [
                        branch,
                        budget,
                        used,
                        remaining,
                        usageRate
                    ];
                });

                // 합계 행 추가
                const totalBudget = getTotalBudget();
                const totalUsed = branches.reduce((sum, b) => sum + getBranchCosts(b), 0);
                const totalRemaining = totalBudget - totalUsed;
                const totalRate = totalBudget > 0 ? Math.round((totalUsed / totalBudget) * 100) : 0;
                rows.push(['합계', totalBudget, totalUsed, totalRemaining, totalRate]);

                // BOM 추가 (한글 깨짐 방지)
                const BOM = '\uFEFF';
                const csvContent = BOM + [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                ].join('\n');

                // 파일 다운로드
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);

        // 사용자 관리 페이지
        function UsersPage() {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [formData, setFormData] = useState({
                email: '',
                password: '',
                displayName: '',
                branchName: '',
                team: '',
                manager: ''
            });

            // 팀 옵션
            const teamOptions = ['1팀', '2팀', '3팀', '4팀'];
            const [selectedUsers, setSelectedUsers] = useState([]);

            // 삭제 확인 모달 상태
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            // 활성화/비활성화 모달 상태
            const [showToggleModal, setShowToggleModal] = useState(false);
            const [toggleUser, setToggleUser] = useState(null);
            const [togglePassword, setTogglePassword] = useState('');
            const [isToggling, setIsToggling] = useState(false);

            // 사용자 목록 실시간 리스너
            useEffect(() => {
                setLoading(true);
                const unsubscribe = db.collection('users').onSnapshot(
                    (snapshot) => {
                        const usersData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 클라이언트에서 정렬 (createdAt 기준 내림차순)
                        usersData.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setUsers(usersData);
                        setLoading(false);
                    },
                    (error) => {
                        console.error('사용자 목록 로드 오류:', error);
                        setLoading(false);
                    }
                );

                return () => unsubscribe();
            }, []);

            // 수동 새로고침용 (삭제 후 선택 초기화 등)
            const loadUsers = async () => {
                setSelectedUsers([]); // 선택 초기화
            };

            // 체크박스 - 개별 선택
            const handleSelectUser = (uid) => {
                setSelectedUsers(prev => {
                    if (prev.includes(uid)) {
                        return prev.filter(id => id !== uid);
                    } else {
                        return [...prev, uid];
                    }
                });
            };

            // 체크박스 - 전체 선택
            const handleSelectAll = () => {
                const selectableUsers = users.filter(u => !PROTECTED_EMAILS.includes(u.email));
                if (selectedUsers.length === selectableUsers.length) {
                    setSelectedUsers([]);
                } else {
                    // 보호된 계정은 제외하고 선택
                    setSelectedUsers(selectableUsers.map(u => u.uid));
                }
            };

            // 선택된 사용자 삭제 모달 열기
            const handleDeleteSelected = () => {
                if (selectedUsers.length === 0) {
                    alert('삭제할 사용자를 선택해주세요.');
                    return;
                }
                setDeletePassword('');
                setShowDeleteModal(true);
            };

            // 비밀번호 확인 후 실제 삭제 실행 (고유 비밀번호 사용)
            const confirmDelete = async () => {
                if (!deletePassword) {
                    alert('고유 비밀번호를 입력해주세요.');
                    return;
                }

                setIsDeleting(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다. Firebase Console에서 설정해주세요.');
                        setIsDeleting(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (deletePassword !== storedPassword) {
                        alert('비밀번호가 올바르지 않습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    // 삭제 실행
                    let successCount = 0;
                    let failCount = 0;

                    for (const uid of selectedUsers) {
                        const result = await deleteUserFromFirestore(uid);
                        if (result.success) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    }

                    alert(`삭제 완료: ${successCount}명 성공, ${failCount}명 실패`);
                    setShowDeleteModal(false);
                    setDeletePassword('');
                    loadUsers();

                } catch (error) {
                    console.error('삭제 오류:', error);
                    alert('삭제 중 오류가 발생했습니다: ' + error.message);
                } finally {
                    setIsDeleting(false);
                }
            };

            // 모달 열기 (신규 등록)
            const openAddModal = () => {
                setEditingUser(null);
                setFormData({
                    email: '',
                    password: '',
                    displayName: '',
                    branchName: '',
                    team: '',
                    manager: '',
                    adminPassword: ''
                });
                setShowModal(true);
            };

            // 모달 열기 (수정)
            const openEditModal = (user) => {
                setEditingUser(user);
                setFormData({
                    email: user.email,
                    password: '',
                    displayName: user.displayName || '',
                    branchName: user.branchName || '',
                    team: user.team || '',
                    manager: user.manager || '',
                    adminPassword: ''
                });
                setShowModal(true);
            };

            // 사용자 등록/수정
            const handleSubmit = async (e) => {
                e.preventDefault();

                if (editingUser) {
                    // 수정
                    const result = await updateUser(editingUser.uid, {
                        displayName: formData.displayName,
                        branchName: formData.branchName,
                        team: formData.team,
                        manager: formData.manager
                    });
                    if (result.success) {
                        alert('사용자 정보가 수정되었습니다.');
                        setShowModal(false);
                        loadUsers();
                    } else {
                        alert(result.message);
                    }
                } else {
                    // 신규 등록
                    if (!formData.email || !formData.password) {
                        alert('이메일과 비밀번호를 입력해주세요.');
                        return;
                    }
                    if (!formData.adminPassword) {
                        alert('고유 비밀번호를 입력해주세요.');
                        return;
                    }

                    // 사용자 생성 중 플래그 설정 (리다이렉트 방지)
                    isCreatingUser = true;

                    // 관리자용 사용자 생성 (고유 비밀번호로 확인)
                    const result = await createUserByAdmin(
                        formData.email,
                        formData.password,
                        ADMIN_EMAIL,
                        formData.adminPassword,
                        formData.displayName,
                        formData.branchName,
                        formData.team,
                        formData.manager
                    );

                    // 플래그 해제
                    isCreatingUser = false;

                    if (result.success) {
                        alert('✅ 사용자가 등록되었습니다.');
                        setShowModal(false);
                        setFormData({
                            email: '',
                            password: '',
                            displayName: '',
                            branchName: '',
                            team: '',
                            manager: '',
                            adminPassword: ''
                        });
                        loadUsers();
                    } else {
                        alert(result.message);
                    }

        // 대시보드 페이지
        function DashboardPage() {
            // 전일 날짜를 기본값으로 계산
            const getYesterdayStr = () => {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const year = yesterday.getFullYear();
                const month = String(yesterday.getMonth() + 1).padStart(2, '0');
                const day = String(yesterday.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const [loading, setLoading] = useState(true);
            const [dashboardData, setDashboardData] = useState({
                students: {},
                registrations: {},
                withdrawals: {}
            });
            const [users, setUsers] = useState([]);
            const [selectedManager, setSelectedManager] = useState('all');
            const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'compare'
            const [selectedDate, setSelectedDate] = useState(getYesterdayStr()); // 전일 날짜
            const [dateA, setDateA] = useState(getYesterdayStr()); // 비교 날짜 A
            const [dateB, setDateB] = useState(getYesterdayStr()); // 비교 날짜 B
            const chartRefs = {
                trend: React.useRef(null),
                branch: React.useRef(null),
                compare: React.useRef(null),
                periodTrend: React.useRef(null),
                netChange: React.useRef(null)
            };
            const chartInstances = React.useRef({});

            // 데이터 로드
            useEffect(() => {
                const loadDashboardData = async () => {
                    try {
                        const dataTypes = ['studentCount', 'registrationCount', 'withdrawalCount'];
                        const dataKeys = ['students', 'registrations', 'withdrawals'];

                        for (let i = 0; i < dataTypes.length; i++) {
                            const baseDocId = dataTypes[i];
                            const dataKey = dataKeys[i];
                            const loadedData = {};

                            // 모든 월별 문서 가져오기
                            const snapshot = await db.collection('dashboardData')
                                .where(firebase.firestore.FieldPath.documentId(), '>=', baseDocId)
                                .where(firebase.firestore.FieldPath.documentId(), '<=', baseDocId + '\uf8ff')
                                .get();

                            snapshot.docs.forEach(doc => {
                                const monthData = doc.data().branches || {};
                                Object.keys(monthData).forEach(branchName => {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);
                                });
                            });

                            setDashboardData(prev => ({
                                ...prev,
                                [dataKey]: loadedData
                            }));
                        }

                        setLoading(false);
                    } catch (error) {
                        console.error('대시보드 데이터 로드 오류:', error);
                        setLoading(false);
                    }
                };

                loadDashboardData();

                // 컴포넌트 언마운트 시 차트 정리
                return () => {
                    Object.values(chartInstances.current).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                };
            }, []);

            // 사용자 데이터 로드 (담당자 필터용)
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const userList = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setUsers(userList);
                    }, (error) => {
                        console.error('사용자 로드 오류:', error);
                    });

                return () => unsubscribe();
            }, []);

            // 차트 생성/업데이트
            useEffect(() => {
                if (loading || Object.keys(dashboardData.students).length === 0 || activeTab !== 'overview') return;

                // 선택한 날짜 기준으로 최근 30일 계산
                const endDate = new Date(selectedDate);
                const startDate = new Date(selectedDate);
                startDate.setDate(endDate.getDate() - 29); // 30일 기간

                // 날짜별 전체 합계 계산 (추세 차트용 - 선택 날짜 기준 최근 30일)
                const dateMap = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {
                        Object.keys(dashboardData[type][branch]).forEach(date => {
                            const dateObj = new Date(date);
                            if (dateObj >= startDate && dateObj <= endDate) {
                                if (!dateMap[date]) {
                                    dateMap[date] = { students: 0, registrations: 0, withdrawals: 0 };
                                }
                                const value = Number(dashboardData[type][branch][date]) || 0;
                                dateMap[date][type] += value;
                            }
                        });
                    });
                });

                const sortedDates = Object.keys(dateMap).sort();

                // 지점별 선택 날짜 데이터 계산 (지점별 비교 차트용)
                const branchSelectedDateData = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {

                    students: 0,
                    registrations: 0,
                    withdrawals: 0
                };

                    Object.values(dashboardData[type]).forEach(branchData => {

        // 담당자 별 비교 페이지
        function ManagerComparePage() {

            const chartRef = React.useRef(null);

            const formatDateHelper = (date) => {

                setStartDate(formatDate(start));

            };

            const setThisWeek = () => {
                const today = new Date();
                const end = new Date();
                end.setDate(end.getDate() - 1);

                const start = new Date(today);
                const dayOfWeek = start.getDay(); // 0 (일요일) ~ 6 (토요일)
                const diff = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // 월요일까지의 차이
                start.setDate(start.getDate() - diff);

                setStartDate(formatDate(start));
                setEndDate(formatDate(end));
            };

            const setLast30Days = () => {
                const end = new Date();

                const start = new Date();
                start.setDate(start.getDate() - 30);
                setStartDate(formatDate(start));
                setEndDate(formatDate(end));

            const setThisMonth = () => {

                end.setDate(end.getDate() - 1);
                const start = new Date(end.getFullYear(), end.getMonth(), 1);
                setStartDate(formatDate(start));

            };

            const setLastMonth = () => {
                const today = new Date();
                const start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const end = new Date(today.getFullYear(), today.getMonth(), 0);
                setStartDate(formatDate(start));
                setEndDate(formatDate(end));
            };

            // 사용자 데이터 로드
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const userList = snapshot.docs.map(doc => ({
                            id: doc.id,

                return () => unsubscribe();

            // 대시보드 데이터 로드
            useEffect(() => {
                const loadDashboardData = async () => {
                    try {
                        const dataTypes = ['studentCount', 'registrationCount', 'withdrawalCount'];
                        const dataKeys = ['students', 'registrations', 'withdrawals'];

                        for (let i = 0; i < dataTypes.length; i++) {
                            const baseDocId = dataTypes[i];
                            const dataKey = dataKeys[i];
                            const loadedData = {};

                            // 모든 월별 문서 가져오기
                            const snapshot = await db.collection('dashboardData')
                                .where(firebase.firestore.FieldPath.documentId(), '>=', baseDocId)
                                .where(firebase.firestore.FieldPath.documentId(), '<=', baseDocId + '\uf8ff')
                                .get();

                            snapshot.docs.forEach(doc => {
                                const monthData = doc.data().branches || {};
                                Object.keys(monthData).forEach(branchName => {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);

                            setDashboardData(prev => ({

                                [dataKey]: loadedData
                            }));

                            managerMap[manager].students += Number(dashboardData.students[branchName][queryEndDate]) || 0;
                        }

                        // 이전 재원생수: 시작일 전날 데이터
                        if (dashboardData.students[branchName] && dashboardData.students[branchName][beforeStartDateStr]) {
                            managerMap[manager].studentsBefore += Number(dashboardData.students[branchName][beforeStartDateStr]) || 0;
                        }

                        // 등록수/퇴원수: 선택한 기간의 합계
                        const start = new Date(queryStartDate);
                        const end = new Date(queryEndDate);

                        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

                                managerMap[manager].registrations += Number(dashboardData.registrations[branchName][dateStr]) || 0;

                                managerMap[manager].withdrawals += Number(dashboardData.withdrawals[branchName][dateStr]) || 0;
                            }

                    managerMap[manager].netChange = managerMap[manager].students - managerMap[manager].studentsBefore;

                    // 순증감율 계산 (이전 재원생수가 0이면 계산 불가)
                    if (managerMap[manager].studentsBefore > 0) {

                        const dayWithdrawals = (dashboardData.withdrawals[branchName] && dashboardData.withdrawals[branchName][dateStr])

        // 데이터 관리 페이지
        function DataManagementPage() {
            const [branches, setBranches] = useState([]);
            const [loading, setLoading] = useState(true);
            const [hotInstance, setHotInstance] = useState(null);
            const tableRef = React.useRef(null);
            const [activeTab, setActiveTab] = useState('students'); // 'students', 'registrations', 'withdrawals'

            // 2025-01-01부터 2026-12-31까지의 일 배열 생성
            const generateDates = () => {
                const dates = [];
                const startDate = new Date('2025-01-01');
                const endDate = new Date('2026-12-31');

                for (let date = new Date(startDate); date <= endDate; date.setDate(date.getDate() + 1)) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    dates.push(`${year}-${month}-${day}`);
                }
                return dates;
            };

            const dates = generateDates(); // 2025-01-01부터 2026-12-31까지 모든 날짜

            // 탭별 문서 ID 가져오기
            const getDocId = () => {
                switch (activeTab) {
                    case 'students':
                        return 'studentCount';
                    case 'registrations':
                        return 'registrationCount';
                    case 'withdrawals':
                        return 'withdrawalCount';
                    default:
                        return 'studentCount';
                }
            };

            // 사용자 관리에서 지점명 목록 로드
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const branchSet = new Set();
                        snapshot.docs.forEach(doc => {
                            const userData = doc.data();
                            if (userData.branchName && userData.branchName !== '관리자') {
                                branchSet.add(userData.branchName);
                            }
                        });
                        const sortedBranches = [...branchSet].sort();
                        setBranches(sortedBranches);
                        setLoading(false);
                    }, (error) => {
                        console.error('지점명 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            // Handsontable 초기화 및 데이터 로드
            useEffect(() => {
                if (!tableRef.current || branches.length === 0) return;

                let currentHot = null; // 현재 생성된 인스턴스를 로컬 변수로 추적

                const initTable = async () => {
                    // 1. Firestore에서 저장된 데이터 불러오기
                    const baseDocId = getDocId();
                    const loadedData = {};

                    try {
                        // 날짜를 월별로 그룹화
                        const yearMonths = new Set();
                        dates.forEach(date => {
                            yearMonths.add(date.substring(0, 7)); // "2024-07" 형식
                        });

                        // 각 월별 문서 불러오기
                        const loadPromises = Array.from(yearMonths).map(async (yearMonth) => {
                            const docRef = db.collection('dashboardData').doc(`${baseDocId}_${yearMonth}`);
                            const docSnap = await docRef.get();

                            if (docSnap.exists) {
                                const monthData = docSnap.data().branches || {};
                                // 로드한 데이터를 loadedData에 병합
                                Object.keys(monthData).forEach(branchName => {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);
                                });
                            }
                        });

                        await Promise.all(loadPromises);
                    } catch (error) {
                        console.error('데이터 로드 오류:', error);
                    }

                    // 2. 테이블 데이터 생성 (불러온 데이터 또는 0으로 초기화)
                    const tableData = branches.map(branch => {
                        return dates.map(date => {
                            // 해당 지점의 해당 날짜 데이터가 있으면 사용, 없으면 0
                            return (loadedData[branch] && loadedData[branch][date]) || 0;
                        });
                    });

                    const container = tableRef.current;
                    if (!container) return; // 안전 체크

                    // 열 설정 (모든 열을 숫자 타입으로)
                    const columnsConfig = dates.map((date, index) => ({
                        data: index,
                        type: 'numeric',
                        numericFormat: { pattern: '0,0' },
                        className: 'htRight'
                    }));

                    // 새 Handsontable 인스턴스 생성
                    currentHot = new Handsontable(container, {
                        data: tableData,
                        colHeaders: dates, // 2024-07-01부터 2026-12-31까지 모든 날짜
                        columns: columnsConfig,
                        rowHeaders: function(index) {
                            return branches[index];
                        },
                        rowHeaderWidth: 150, // 행 헤더 너비 증가
                        colWidths: 100, // 모든 열의 너비를 100px로 설정
                        width: '100%',
                        height: 'auto',
                        maxRows: tableData.length,
                        licenseKey: 'non-commercial-and-evaluation',
                        autoWrapRow: true,
                        autoWrapCol: true,
                        manualColumnResize: true,
                        manualRowResize: true,
                        contextMenu: true,
                        copyPaste: true, // 복사/붙여넣기 활성화
                        fillHandle: true, // 드래그 채우기 활성화
                        filters: true,
                        dropdownMenu: true,
                        columnSorting: true,
                        language: 'ko-KR',
                        afterGetColHeader: function(col, TH) {
                            // 왼쪽 상단 모서리에 "지점명" 추가
                            if (col === -1) {
                                TH.innerHTML = '지점명';
                                TH.style.fontWeight = '600';
                                TH.style.textAlign = 'center';
                            }
                        }
                    });

                    setHotInstance(currentHot);
                };

                initTable();

                return () => {
                    // cleanup: 로컬 변수로 추적한 인스턴스 파괴
                    if (currentHot && !currentHot.isDestroyed) {
                        currentHot.destroy();
                    }
                    // DOM도 완전히 비우기
                    if (tableRef.current) {
                        tableRef.current.innerHTML = '';
                    }
                };
            }, [branches, activeTab]); // activeTab 변경 시에도 테이블 재생성

            // 데이터 저장 (월별 문서로 분할)
            const handleSave = async () => {
                if (!hotInstance) return;

                const confirm = window.confirm('변경사항을 저장하시겠습니까?\n\n⚠️ 이 작업은 Firestore 데이터베이스를 직접 수정합니다.');
                if (!confirm) return;

                try {
                    const data = hotInstance.getData();
                    const baseDocId = getDocId();

                    // 날짜를 월별로 그룹화
                    const monthlyGroups = {};
                    dates.forEach((date, dateIndex) => {
                        const yearMonth = date.substring(0, 7); // "2024-07" 형식
                        if (!monthlyGroups[yearMonth]) {
                            monthlyGroups[yearMonth] = [];
                        }
                        monthlyGroups[yearMonth].push({ date, dateIndex });
                    });

                    // 각 월별로 문서 저장
                    const savePromises = [];

                    for (const [yearMonth, dateInfo] of Object.entries(monthlyGroups)) {
                        const monthData = {};

                        data.forEach((row, branchIndex) => {
                            const branchName = branches[branchIndex];
                            if (branchName) {
                                const dailyData = {};
                                dateInfo.forEach(({ date, dateIndex }) => {
                                    dailyData[date] = Number(row[dateIndex]) || 0;
                                });
                                monthData[branchName] = dailyData;
                            }
                        });

                        // 월별 문서에 저장 (예: studentCount_2024-07)
                        const docRef = db.collection('dashboardData').doc(`${baseDocId}_${yearMonth}`);
                        savePromises.push(
                            docRef.set({
                                branches: monthData,
                                yearMonth: yearMonth,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            })
                        );
                    }

                    await Promise.all(savePromises);

                    alert(`✅ 저장 완료!\n${Object.keys(monthlyGroups).length}개 월 데이터가 저장되었습니다.`);
                } catch (error) {
                    console.error('저장 오류:', error);
                    alert('❌ 저장 중 오류가 발생했습니다.\n\n' + error.message);
                }
            };

            // 엑셀 내보내기
            const handleExport = () => {
                if (!hotInstance) return;

                const data = hotInstance.getData();
                const headers = hotInstance.getColHeader();

                // 헤더에 "지점명" 추가
                const exportHeaders = ['지점명', ...headers];

                // 각 행에 지점명 추가
                const exportData = data.map((row, index) => {
                    return [branches[index], ...row];
                });

                const ws = XLSX.utils.aoa_to_sheet([exportHeaders, ...exportData]);
                const wb = XLSX.utils.book_new();

                // 탭 이름을 현재 활성 탭에 따라 설정
                const sheetName = activeTab === 'students' ? '재원생수' :

        // 설정 페이지
        function SettingsPage() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('account');

            // 비밀번호 변경 관련 상태
            const [uniquePassword, setUniquePassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [isChangingPassword, setIsChangingPassword] = useState(false);
            const [passwordMessage, setPasswordMessage] = useState({ type: '', text: '' });

            // 사용자 메뉴 관리 관련 상태
            const [menuConfig, setMenuConfig] = useState([
                { id: 'inquiry', name: '지점 문의 창구', visible: true },
                { id: 'cost', name: '마케팅 비용', visible: true },
                { id: 'toolkit', name: '마케팅 툴킷 신청', visible: true },
                { id: 'settings', name: '설정', visible: true }
            ]);
            const [isSavingMenu, setIsSavingMenu] = useState(false);

            useEffect(() => {
                const currentUser = auth.currentUser;
                if (currentUser) {
                    setUser(currentUser);
                }

                // 사용자 메뉴 설정 로드
                loadMenuConfig();
            }, []);

            // 메뉴 설정 로드
            const loadMenuConfig = async () => {
                try {
                    const doc = await db.collection('sidebarConfig').doc('user').get();
                    if (doc.exists) {
                        const savedMenus = doc.data().menus;
                        setMenuConfig(savedMenus);
                    }
                } catch (error) {
                    console.error('메뉴 설정 로드 오류:', error);
                }
            };

            // 비밀번호 변경 처리 (고유 비밀번호로 인증)
            const handlePasswordChange = async (e) => {
                e.preventDefault();
                setPasswordMessage({ type: '', text: '' });

                // 유효성 검사
                if (!uniquePassword) {
                    setPasswordMessage({ type: 'error', text: '고유 비밀번호를 입력해주세요.' });
                    return;
                }
                if (!newPassword) {
                    setPasswordMessage({ type: 'error', text: '새 비밀번호를 입력해주세요.' });
                    return;
                }
                if (newPassword.length < 6) {
                    setPasswordMessage({ type: 'error', text: '새 비밀번호는 6자 이상이어야 합니다.' });
                    return;
                }
                if (newPassword !== confirmPassword) {
                    setPasswordMessage({ type: 'error', text: '새 비밀번호가 일치하지 않습니다.' });
                    return;
                }

                setIsChangingPassword(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        setPasswordMessage({ type: 'error', text: '고유 비밀번호가 설정되지 않았습니다.' });
                        setIsChangingPassword(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (uniquePassword !== storedPassword) {
                        setPasswordMessage({ type: 'error', text: '고유 비밀번호가 올바르지 않습니다.' });
                        setIsChangingPassword(false);
                        return;
                    }

                    // 비밀번호 변경
                    const currentUser = auth.currentUser;
                    await currentUser.updatePassword(newPassword);

                    setPasswordMessage({ type: 'success', text: '비밀번호가 성공적으로 변경되었습니다.' });
                    setUniquePassword('');
                    setNewPassword('');
                    setConfirmPassword('');
                } catch (error) {
                    console.error('비밀번호 변경 오류:', error);
                    if (error.code === 'auth/requires-recent-login') {
                        setPasswordMessage({ type: 'error', text: '보안을 위해 다시 로그인 후 시도해주세요.' });
                    } else {
                        setPasswordMessage({ type: 'error', text: '비밀번호 변경에 실패했습니다: ' + error.message });
                    }
                } finally {
                    setIsChangingPassword(false);
                }
            };

            // 메뉴 가시성 토글
            const handleMenuToggle = (menuId) => {
                setMenuConfig(prevConfig =>
                    prevConfig.map(menu =>
                        menu.id === menuId ? { ...menu, visible: !menu.visible } : menu
                    )
                );
            };

            // 메뉴 설정 저장
            const handleSaveMenuConfig = async () => {
                setIsSavingMenu(true);
                try {
                    await db.collection('sidebarConfig').doc('user').set({
                        menus: menuConfig,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert('사용자 메뉴 설정이 저장되었습니다.');
                } catch (error) {
                    console.error('메뉴 설정 저장 오류:', error);
                    alert('메뉴 설정 저장에 실패했습니다.');
                } finally {
                    setIsSavingMenu(false);
                }
            };

            return (

                            >

                            </button>

                                className={`tab-button ${activeTab === 'menu' ? 'active' : ''}`}

                            >

                            </button>
                        </div>

                        {/* 탭 컨텐츠 */}
                        <div className="tab-content">
                            {activeTab === 'account' && (
                                <div>
                                    {/* 계정 정보 */}
                                    <div className="settings-section" style={{borderBottom: 'none', paddingBottom: 0, marginBottom: 0}}>
                            <h3 className="section-title">계정 정보</h3>
                            <div style={{
                                background: '#f8f9fa',
                                padding: '20px',
                                borderRadius: '10px',
                                marginBottom: '20px'
                            }}>
                                <div style={{display: 'grid', gridTemplateColumns: '120px 1fr', gap: '15px', alignItems: 'center'}}>
                                    <span style={{color: '#666', fontSize: '14px'}}>이메일</span>
                                    <span style={{fontWeight: '600', color: '#1a1a2e'}}>{user?.email || '-'}</span>

                                    <span style={{color: '#666', fontSize: '14px'}}>역할</span>
                                    <span>
                                        <span style={{
                                            background: 'linear-gradient(135deg, #e94560 0%, #ff6b6b 100%)',
                                            color: 'white',
                                            padding: '4px 12px',
                                            borderRadius: '4px',
                                            fontSize: '12px',
                                            fontWeight: '600'
                                        }}>
                                            관리자
                                        </span>
                                    </span>
                                </div>
                            </div>
                        </div>
                                </div>
                            )}

                            {activeTab === 'password' && (
                                <div>

                                    <div className="settings-section" style={{borderBottom: 'none', paddingBottom: 0, marginBottom: 0}}>
                                        <h3 className="section-title">비밀번호 변경</h3>
                                        <p style={{color: '#666', fontSize: '14px', marginBottom: '20px'}}>
                                            비밀번호 변경을 위해 고유 비밀번호 인증이 필요합니다.

                                        <form onSubmit={handlePasswordChange}>

                                                    <input
                                                        type="password"
                                                        value={uniquePassword}
                                                        onChange={(e) => setUniquePassword(e.target.value)}

                                                    />

                                                    </p>
                                                </div>

                                                <div style={{
                                                    borderTop: '1px solid #eee',

                                                    paddingTop: '20px'

                                                    <div className="form-group">
                                                        <label>새 비밀번호 *</label>

                                                            disabled={isChangingPassword}
                                                        />
                                                    </div>
                                                </div>

                                                {passwordMessage.text && (
                                                    <div style={{

                                                        fontSize: '14px'
                                                    }}>
                                                        {passwordMessage.text}
                                                    </div>
                                                )}

                                                <button
                                                    type="submit"
                                                    className="btn"
                                                    disabled={isChangingPassword}
                                                    style={{marginTop: '10px'}}
                                                >
                                                    {isChangingPassword ? '변경 중...' : '비밀번호 변경'}
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'menu' && (
                                <div>
                                    {/* 사용자 메뉴 관리 */}
                                    <div className="settings-section" style={{borderBottom: 'none', paddingBottom: 0, marginBottom: 0}}>
                                        <h3 className="section-title">사용자 메뉴 가시성 관리</h3>
                                        <p style={{color: '#666', fontSize: '14px', marginBottom: '20px'}}>
                                            user.html의 사이드바에 표시될 메뉴를 선택하세요. 토글을 끄면 해당 메뉴가 사용자 화면에서 숨겨집니다.
                                        </p>

            { id: 'biz_mk2', name: '사업마케팅2팀', className: 'biz_mk2' }
        ];
        const ABP_TEAM_BY_ID = Object.fromEntries(ABP_TEAM_DEFS.map(t => [t.id, t]));
        const ABP_ADMIN_ORDER = [
            'biz_plan', 'biz_mk1', 'biz_mk2', 'sales_ops', 'hrd_academy', 'eng_lab',
            'content_prod', 'it_dev', 'corp_admin'
        ];
        const ABP_TEAMS = ABP_ADMIN_ORDER.map(id => ABP_TEAM_BY_ID[id]);
        /** abp.html 사이드바·팀별 문의함과 동일한 팀 노출 순서 (ABP_ADMIN_ORDER와 별도) */
        const ABP_SIDEBAR_ORDER = [
            'biz_plan', 'sales_ops', 'hrd_academy', 'eng_lab', 'content_prod',
            'it_dev', 'corp_admin', 'biz_mk1', 'biz_mk2'
        ];
        const ABP_TEAMS_NAV = ABP_SIDEBAR_ORDER.map((id) => ABP_TEAM_BY_ID[id]);
        // 구 시스템에서 저장된 targetTeam id → 표시명 (기존 문서 조회용)
        const LEGACY_ABP_TEAM_NAMES = {
            planning: '학원사업기획팀',
            marketing: '학원사업마케팅팀',
            hrd: '학원사업HRD팀',
            production: '콘텐츠제작팀',
            rnd: '콘텐츠R&D팀'
        };

        const isKnownAbpTargetTeam = (teamId) => Boolean(teamId && ABP_TEAM_BY_ID[teamId]);
        const INQUIRY_CATEGORY_DEFS_COLLECTION = 'inquiryCategoryDefinitions';
        const ABP_MANUAL_TEAM_MAJOR_ID = 'manual_team';

        function sanitizeAbpInquiryFileName(name) {
            return (name || 'file')
                .replace(/[^\w.\-]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        async function uploadAbpReplyAttachments({ files, inquiryId }) {
            if (!files || !files.length) return [];
            const uploads = files.map(async (file, idx) => {
                const timestamp = Date.now();
                const safeName = sanitizeAbpInquiryFileName(file.name);
                const filePath = `abpInquiries/${inquiryId}/reply/${timestamp}_${idx + 1}_${safeName}`;
                const ref = storage.ref(filePath);
                const uploadTask = await ref.put(file);
                const url = await uploadTask.ref.getDownloadURL();
                return {
                    name: file.name,
                    path: filePath,
                    url,
                    contentType: file.type || '',
                    size: file.size || 0,
                    uploadedAtMs: Date.now()
                };
            });
            return await Promise.all(uploads);
        }

        const uploadInquiryAttachments = uploadAbpReplyAttachments;

        function inquiryMajorLabelFromRows(majorId, rows) {
            const hit = (rows || []).find((r) => r.majorId === majorId);
            return hit?.majorLabel || majorId || '-';
        }

        function generateInquiryMinorId(minorLabel) {
            const base = String(minorLabel || 'cat')
                .toLowerCase()
                .replace(/[^a-z0-9가-힣]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 28) || 'cat';
            return base + '_' + Math.random().toString(36).slice(2, 9);
        }

        function getAbpEditorLabel(u) {
            if (!u) return '';
            const dn = (u.displayName || '').trim();
            if (dn) return dn;
            return u.email || '';
        }

        function formatFirestoreDateKo(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ko-KR', {
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /** inquiries / abpInquiries 문서의 attachments·replyAttachments path → Storage 삭제 (best-effort) */
        async function deleteInquiryAttachmentStorageFromRows(rows) {
            const pathsFrom = (arr) =>
                (Array.isArray(arr) ? arr : [])
                    .map((att) => att?.path)
                    .filter(Boolean);
            const paths = [];
            (rows || []).forEach((row) => {
                paths.push(...pathsFrom(row.attachments), ...pathsFrom(row.replyAttachments));
            });
            const uniquePaths = [...new Set(paths)];
            if (uniquePaths.length === 0) return;
            await Promise.all(
                uniquePaths.map(async (path) => {
                    try {
                        await storage.ref(path).delete();
                    } catch (err) {
                        console.warn('문의 첨부 Storage 삭제 실패:', path, err);
                    }
                })
            );
        }

        /** 기획본부 문의 삭제 시 — 문의자 첨부는 inquiries에만 있으므로 originalInquiryId 로 연결 문서 로드 */
        async function loadInquiryRowsForAbpAttachmentPurge(abpRows) {
            const ids = [...new Set(
                (abpRows || [])
                    .map((r) => r.originalInquiryId)
                    .filter((id) => typeof id === 'string' && id.length > 0)
            )];
            if (ids.length === 0) return [];
            const results = await Promise.all(
                ids.map(async (oid) => {
                    try {
                        const snap = await db.collection('inquiries').doc(oid).get();
                        return snap.exists ? { id: snap.id, ...snap.data() } : null;
                    } catch (e) {
                        console.warn('연결 inquiries 조회 실패(첨부 삭제 스킵):', oid, e);
                        return null;
                    }
                })
            );
            return results.filter(Boolean);
        }

        /** Firestore batch.delete는 한 번에 최대 500작업 — 문의 대량 삭제 시 분할 커밋 */
        async function commitBatchedDeletes(docRefs) {
            const CHUNK = 450;
            for (let i = 0; i < docRefs.length; i += CHUNK) {
                const batch = db.batch();
                docRefs.slice(i, i + CHUNK).forEach((ref) => batch.delete(ref));
                await batch.commit();
            }
        }

        // 지점 문의 창구 페이지 (관리자용)
        function InquiryPage() {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);

            const [abpContent, setAbpContent] = useState('');
            const [abpAuthorName, setAbpAuthorName] = useState('');

            // 선택 삭제 관련 상태
            const [selectedInquiries, setSelectedInquiries] = useState([]);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            // 페이지네이션 상태
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 20;

            // 모든 문의글 로드
            useEffect(() => {
                const unsubscribe = db.collection('inquiries')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);

                        // 지점 목록 추출
                        const branchSet = new Set();
                        data.forEach(inquiry => {
                            if (inquiry.branchName) branchSet.add(inquiry.branchName);
                        });
                        setBranches([...branchSet].sort());

                        setLoading(false);
                    }, (error) => {
                        console.error('문의글 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            const abpDeptFilterIds = useMemo(() => {
                const ids = new Set();
                inquiries.forEach(i => {
                    if (i.abpTargetTeam) ids.add(i.abpTargetTeam);
                });
                return [...ids].sort();
            }, [inquiries]);
            const hasInquiryWithoutAbpDept = useMemo(() => inquiries.some(i => !i.abpTargetTeam), [inquiries]);

            // 지점-담당자 매핑 로드 (users 컬렉션에서)
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const mapping = {};
                        snapshot.docs.forEach(doc => {
                            const userData = doc.data();
                            if (userData.branchName && userData.manager) {
                                mapping[userData.branchName] = userData.manager;
                            }
                        });
                        setBranchManagerMap(mapping);

                        // 담당자 목록 추출
                        const managerSet = new Set(Object.values(mapping));
                        setManagers([...managerSet].sort());
                    }, (error) => {
                        console.error('지점-담당자 매핑 로드 오류:', error);
                    });

                return () => unsubscribe();
            }, []);

            const getAbpDeptLabel = (inquiry) => {
                const id = inquiry.abpTargetTeam;
                if (!id) return '-';
                const t = ABP_TEAM_BY_ID[id];
                if (t) return t.name;
                if (LEGACY_ABP_TEAM_NAMES[id]) return LEGACY_ABP_TEAM_NAMES[id];
                return id;
            };

            const getInquiryCategoryLabel = (inquiry) => {
                const mj = inquiry.inquiryMajorLabel;
                const mn = inquiry.inquiryMinorLabel;
                if (!mj && !mn) return '-';
                if (mj && mn) return `${mj} › ${mn}`;
                return mj || mn || '-';
            };

            // 필터링된 목록
            const filteredInquiries = inquiries.filter(inquiry => {
                if (selectedBranch !== 'all' && inquiry.branchName !== selectedBranch) return false;
                if (selectedAbpDept !== 'all') {
                    if (selectedAbpDept === '__none__') {
                        if (inquiry.abpTargetTeam) return false;
                    } else if (inquiry.abpTargetTeam !== selectedAbpDept) {
                        return false;
                    }
                }
                if (selectedManager !== 'all' && branchManagerMap[inquiry.branchName] !== selectedManager) return false;
                return true;
            });

            // 페이지네이션 계산
            const totalPages = Math.ceil(filteredInquiries.length / ITEMS_PER_PAGE);
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const paginatedInquiries = filteredInquiries.slice(startIndex, endIndex);

            // 필터 변경 시 페이지 리셋
            useEffect(() => {
                setCurrentPage(1);
            }, [selectedBranch, selectedAbpDept, selectedManager]);

            // 팀별 통계 계산 (지점 팀: 1팀, 2팀, 3팀, 4팀)
            const BRANCH_TEAMS = ['1팀', '2팀', '3팀', '4팀'];

            const getTeamStats = () => {
                return BRANCH_TEAMS.map(teamName => {
                    const teamInquiries = inquiries.filter(i => i.team === teamName);

                    const pending = teamInquiries.filter(i => i.status === 'pending').length;
                    const answered = teamInquiries.filter(i => i.status === 'answered').length;
                    const completionRate = total > 0 ? ((answered / total) * 100).toFixed(1) : 0;

                    return {
                        name: teamName,
                        total,
                        pending,
                        answered,
                        completionRate
                    };
                });
            };

            const teamStats = getTeamStats();

            // 전체 통계 계산
            const totalInquiries = inquiries.length;
            const totalPending = inquiries.filter(i => i.status === 'pending').length;
            const totalAnswered = inquiries.filter(i => i.status === 'answered').length;
            const totalCompletionRate = totalInquiries > 0 ? ((totalAnswered / totalInquiries) * 100).toFixed(1) : 0;

            // 날짜 포맷
            const formatDateLocal = (timestamp) => {
                if (!timestamp) return '-';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            // 상세보기
            const openDetail = (inquiry) => {
                setSelectedInquiry(inquiry);

            // 기획본부 문의 모달 열기

                setAbpContent('');
                setAbpAuthorName('');
                setShowAbpModal(true);
            };

            // 기획본부 문의 저장
            const handleAbpSubmit = async () => {
                if (!abpTargetTeam) {
                    alert('문의할 부서를 선택해주세요.');
                    return;

                    alert('문의 내용을 입력해주세요.');
                    return;
                }
                if (!abpAuthorName.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }

                setIsSubmittingAbp(true);

                try {
                    await db.collection('abpInquiries').add({
                        // 원본 지점 문의 정보
                        originalInquiryId: selectedInquiry.id,
                        originalInquiry: {
                            title: selectedInquiry.title,
                            content: selectedInquiry.content
                        },
                        branchName: selectedInquiry.branchName,
                        team: selectedInquiry.team,
                        position: selectedInquiry.position || '',

                        // 기획본부 문의 정보
                        targetTeam: abpTargetTeam,
                        content: abpContent.trim(),
                        authorName: abpAuthorName.trim(),

                        // 메타 정보
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('기획본부에 문의가 접수되었습니다.');
                    setShowAbpModal(false);
                } catch (error) {
                    console.error('기획본부 문의 저장 오류:', error);
                    alert('문의 저장에 실패했습니다.');
                } finally {
                    setIsSubmittingAbp(false);
                }
            };

            // 체크박스 - 개별 선택
            const handleSelectInquiry = (id) => {
                setSelectedInquiries(prev => {
                    if (prev.includes(id)) {
                        return prev.filter(inquiryId => inquiryId !== id);
                    } else {
                        return [...prev, id];
                    }
                });
            };

            // 체크박스 - 현재 페이지 전체 선택
            const handleSelectAllInquiries = () => {
                if (paginatedInquiries.length > 0 && paginatedInquiries.every(inquiry => selectedInquiries.includes(inquiry.id))) {
                    // 현재 페이지의 선택 해제
                    setSelectedInquiries(prev => prev.filter(id => !paginatedInquiries.find(inquiry => inquiry.id === id)));
                } else {
                    // 현재 페이지 전체 선택
                    const newSelections = [...new Set([...selectedInquiries, ...paginatedInquiries.map(inquiry => inquiry.id)])];
                    setSelectedInquiries(newSelections);

            // 삭제 모달 열기

            // 선택 삭제 실행
            const handleConfirmDelete = async (e) => {
                e.preventDefault();

                if (!deletePassword) {
                    alert('고유 비밀번호를 입력해주세요.');
                    return;
                }

                setIsDeleting(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (deletePassword !== storedPassword) {
                        alert('비밀번호가 올바르지 않습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    const rowsToPurge = selectedInquiries
                        .map((id) => inquiries.find((i) => i.id === id))
                        .filter(Boolean);
                    await deleteInquiryAttachmentStorageFromRows(rowsToPurge);

                    const deleteRefs = [];
                    selectedInquiries.forEach((id) => deleteRefs.push(db.collection('inquiries').doc(id)));
                    const abpIdsFromBranch = new Set();
                    rowsToPurge.forEach((row) => {

                        }

                    abpIdsFromBranch.forEach((abpId) => deleteRefs.push(db.collection('abpInquiries').doc(abpId)));
                    await commitBatchedDeletes(deleteRefs);

                    alert(`${selectedInquiries.length}개 항목이 삭제되었습니다.`);

                    setShowDeleteModal(false);

                        { wch: 10 },
                        { wch: 18 },
                        { wch: 12 },
                        { wch: 18 },
                        { wch: 40 },

                            지점에서 유형을 변경하면 담당 부서가 바뀔 수 있습니다.

                    {/* 전체 통계 대시보드 */}
                    <div style={{marginBottom: '30px'}}>
                        <div className="stat-card" style={{
                            background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                            padding: '30px'
                        }}>
                            <h3 style={{fontSize: '16px', marginBottom: '25px', opacity: 1}}>전체 현황</h3>
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: 'repeat(4, 1fr)',
