    <!-- Firebase 설정 -->
    <script src="firebase.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const ADMIN_EMAIL = 'admin@dshare.co.kr';
        const ABP_EMAIL = 'abp@dshare.co.kr';

        // 보호된 계정 (삭제 불가)
        const PROTECTED_EMAILS = [ADMIN_EMAIL, ABP_EMAIL];

        // 사용자 생성 중 플래그 (전역 - onAuthStateChanged 콜백에서 접근 가능하도록)
        let isCreatingUser = false;

        // 아이콘 컴포넌트
        const Icons = {
            Dashboard: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>

            ),
            Cost: () => (

            AbpComm: () => (

            ),
            DeptCategory: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">

                    <line x1="9" y1="9" x2="15" y2="9"/>
                </svg>
            ),
            Team: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>

                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            ),
            Round: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            ),
            Users: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            ),
            Settings: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            ),
            Toolkit: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            ),
            Data: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
            )
        };

        // 날짜 포맷
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ko-KR', {
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 카테고리 정보
        const categories = {
            online: { label: '온라인 광고', className: 'online' },
            offline: { label: '오프라인 광고', className: 'offline' },
            event: { label: '이벤트/프로모션', className: 'event' },
            material: { label: '홍보물 제작', className: 'material' },
            toolkit: { label: '툴킷', className: 'toolkit' },
            '툴킷': { label: '툴킷', className: 'toolkit' },
            other: { label: '기타', className: 'other' }
        };

        // 마케팅 툴킷 관리 페이지
        function ToolkitManagementPage() {
            const [toolkits, setToolkits] = useState([]);
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingToolkit, setEditingToolkit] = useState(null);
            const [selectedToolkit, setSelectedToolkit] = useState('all'); // 툴킷 필터
            const [activeTab, setActiveTab] = useState('toolkits'); // 탭 상태: 'toolkits' 또는 'orders'
            const [toolkitSubTab, setToolkitSubTab] = useState('active'); // 툴킷 서브탭: 'active' 또는 'completed'
            const [newToolkit, setNewToolkit] = useState({
                name: '',
                description: '', // 설명
                image: null,
                imagePreview: '',
                dueDate: '', // 취합 완료일
                minOrderQty: '', // 최소 주문 수량
                orderUnit: '', // 주문 단위 (배수)
                showTotalOrders: true, // 전 지점 현황 노출 (기본값: true)
                priceRanges: [{
                    minQty: 0,
                    maxQty: '',
                    pricePerUnit: ''
                }]
            });

            useEffect(() => {
                // 툴킷 실시간 리스너
                const unsubscribeToolkits = db.collection('toolkits')
                    .orderBy('createdAt', 'asc')
                    .onSnapshot((snapshot) => {
                        const toolkitsData = [];
                        snapshot.forEach(doc => {
                            toolkitsData.push({ id: doc.id, ...doc.data() });
                        });
                        setToolkits(toolkitsData);
                        setLoading(false);
                    }, (error) => {
                        console.error('툴킷 로드 오류:', error);
                        setLoading(false);
                    });

                // 주문 실시간 리스너
                const unsubscribeOrders = db.collection('toolkitOrders')
                    .onSnapshot((snapshot) => {
                        const ordersData = [];
                        snapshot.forEach(doc => {
                            ordersData.push({ id: doc.id, ...doc.data() });
                        });
                        setOrders(ordersData);
                    }, (error) => {
                        console.error('주문 로드 오류:', error);
                    });

                return () => {
                    unsubscribeToolkits();
                    unsubscribeOrders();
                };
            }, []);

            const loadData = async () => {
                // 수동 새로고침용 (필요 시)
                setLoading(true);
                try {
                    const toolkitsSnapshot = await db.collection('toolkits').orderBy('createdAt', 'asc').get();
                    const toolkitsData = [];
                    toolkitsSnapshot.forEach(doc => {
                        toolkitsData.push({ id: doc.id, ...doc.data() });
                    });
                    setToolkits(toolkitsData);

                    const ordersSnapshot = await db.collection('toolkitOrders').get();
                    const ordersData = [];
                    ordersSnapshot.forEach(doc => {
                        ordersData.push({ id: doc.id, ...doc.data() });
                    });
                    setOrders(ordersData);
                } catch (error) {
                    console.error('데이터 로드 오류:', error);
                    alert('데이터를 불러오는데 실패했습니다.');
                } finally {
                    setLoading(false);
                }
            };

            // 툴킷별 전체 주문 수량 계산
            const getTotalOrderQty = (toolkitId) => {
                return orders
                    .filter(order => order.toolkitId === toolkitId)
                    .reduce((sum, order) => sum + Number(order.quantity || 0), 0);
            };

            // 수량에 따른 단가 계산
            const getPricePerUnit = (toolkit, totalQty) => {
                if (!toolkit.priceRanges) return 0;

                const sortedRanges = [...toolkit.priceRanges].sort((a, b) => a.minQty - b.minQty);

                for (let i = sortedRanges.length - 1; i >= 0; i--) {
                    const range = sortedRanges[i];
                    if (totalQty >= range.minQty && (range.maxQty === null || totalQty <= range.maxQty)) {
                        return Number(range.pricePerUnit || 0);
                    }
                }

                return Number(sortedRanges[0]?.pricePerUnit || 0);
            };

            // 툴킷 생성
            const handleCreateToolkit = async (e) => {
                e.preventDefault();

                if (!newToolkit.name.trim()) {
                    alert('툴킷 이름을 입력하세요.');
                    return;
                }

                // 가격 구간 유효성 검사
                const validRanges = newToolkit.priceRanges.filter(range =>
                    range.minQty !== '' && range.pricePerUnit !== ''
                );

                if (validRanges.length === 0) {
                    alert('최소 1개 이상의 가격 구간을 설정하세요.');
                    return;
                }

                try {
                    let imageUrl = '';

                    // 이미지가 있으면 업로드
                    if (newToolkit.image) {
                        const timestamp = Date.now();
                        const fileName = `${timestamp}_${newToolkit.image.name}`;
                        const filePath = `toolkits/${fileName}`;

                        const storageRef = storage.ref(filePath);
                        const uploadTask = await storageRef.put(newToolkit.image);
                        imageUrl = await uploadTask.ref.getDownloadURL();
                    }

                    await db.collection('toolkits').add({
                        name: newToolkit.name,
                        description: newToolkit.description || '',
                        imageUrl: imageUrl,
                        dueDate: newToolkit.dueDate || null,
                        minOrderQty: newToolkit.minOrderQty ? Number(newToolkit.minOrderQty) : null,
                        orderUnit: newToolkit.orderUnit ? Number(newToolkit.orderUnit) : null,
                        showTotalOrders: newToolkit.showTotalOrders === true,
                        priceRanges: validRanges.map(range => ({
                            minQty: Number(range.minQty),
                            maxQty: range.maxQty === '' ? null : Number(range.maxQty),
                            pricePerUnit: Number(range.pricePerUnit)
                        })),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        createdBy: auth.currentUser.email
                    });

                    alert('툴킷이 생성되었습니다.');
                    setShowCreateModal(false);
                    setNewToolkit({
                        name: '',
                        image: null,
                        imagePreview: '',
                        dueDate: '',
                        minOrderQty: '',
                        orderUnit: '',
                        priceRanges: [{
                            minQty: 0,
                            maxQty: '',
                            pricePerUnit: ''
                        }]
                    });
                    loadData();
                } catch (error) {
                    console.error('툴킷 생성 오류:', error);
                    alert('툴킷 생성에 실패했습니다.');
                }
            };

            // 툴킷 삭제
            const handleDeleteToolkit = async (toolkitId, toolkitName) => {
                if (!confirm(`"${toolkitName}" 툴킷을 삭제하시겠습니까?\n\n관련된 모든 주문 정보와 비용도 함께 삭제됩니다.`)) {
                    return;
                }

                try {
                    // 해당 툴킷의 모든 주문 삭제 및 연결된 비용 삭제
                    const ordersToDelete = orders.filter(order => order.toolkitId === toolkitId);
                    const batch = db.batch();

                    // 주문과 연결된 비용도 함께 삭제
                    for (const order of ordersToDelete) {
                        // 툴킷 주문 삭제
                        batch.delete(db.collection('toolkitOrders').doc(order.id));

                        // 연결된 비용 삭제
                        if (order.costId) {
                            batch.delete(db.collection('costs').doc(order.costId));
                        }
                    }

                    // 툴킷 이미지 삭제 (있는 경우)
                    const toolkitDoc = await db.collection('toolkits').doc(toolkitId).get();
                    if (toolkitDoc.exists && toolkitDoc.data().imageUrl) {
                        const imageRef = storage.refFromURL(toolkitDoc.data().imageUrl);
                        await imageRef.delete().catch(err => console.log('이미지 삭제 실패:', err));
                    }

                    // 툴킷 삭제
                    batch.delete(db.collection('toolkits').doc(toolkitId));

                    await batch.commit();
                    alert('툴킷과 관련된 모든 데이터가 삭제되었습니다.');
                    loadData();
                } catch (error) {
                    console.error('툴킷 삭제 오류:', error);
                    alert('툴킷 삭제에 실패했습니다: ' + error.message);
                }
            };

            // 가격 구간 입력 핸들러
            const handleRangeChange = (index, field, value) => {
                const newRanges = [...newToolkit.priceRanges];
                newRanges[index] = { ...newRanges[index], [field]: value };
                setNewToolkit({ ...newToolkit, priceRanges: newRanges });
            };

            // 가격 구간 추가
            const handleAddRange = () => {
                setNewToolkit({
                    ...newToolkit,
                    priceRanges: [...newToolkit.priceRanges, {
                        minQty: '',
                        maxQty: '',
                        pricePerUnit: ''
                    }]
                });
            };

            // 가격 구간 삭제
            const handleRemoveRange = (index) => {
                if (newToolkit.priceRanges.length === 1) {
                    alert('최소 1개의 가격 구간이 필요합니다.');
                    return;
                }
                const newRanges = newToolkit.priceRanges.filter((_, idx) => idx !== index);
                setNewToolkit({ ...newToolkit, priceRanges: newRanges });
            };

            // 이미지 업로드 핸들러
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 파일 타입 검증
                if (!file.type.match('image/(jpeg|png)')) {
                    alert('JPG 또는 PNG 파일만 업로드 가능합니다.');
                    e.target.value = '';
                    return;
                }

                // 이미지 크기(픽셀) 검증
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);

                    if (img.width !== 560 || img.height !== 700) {
                        alert(`이미지 크기가 올바르지 않습니다.\n필수: 560 x 700 픽셀\n현재: ${img.width} x ${img.height} 픽셀`);
                        e.target.value = '';
                        setNewToolkit({...newToolkit, image: null, imagePreview: ''});
                        return;
                    }

                    // 미리보기 생성
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewToolkit({
                            ...newToolkit,
                            image: file,
                            imagePreview: reader.result
                        });
                    };
                    reader.readAsDataURL(file);
                };

                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    alert('이미지 파일을 읽을 수 없습니다.');
                    e.target.value = '';
                };

                img.src = objectUrl;
            };

            // 이미지 제거
            const handleRemoveImage = () => {
                setNewToolkit({...newToolkit, image: null, imagePreview: ''});
            };

            // 툴킷 취합 완료
            const handleCompleteToolkit = async (toolkitId, toolkitName) => {
                if (!confirm(`"${toolkitName}" 툴킷을 취합 완료 처리하시겠습니까?\n\n취합 완료된 툴킷은 사용자 페이지에서 더 이상 보이지 않으며,\n"취합 완료 툴킷" 탭으로 이동합니다.`)) {
                    return;
                }

                try {
                    await db.collection('toolkits').doc(toolkitId).update({
                        isCompleted: true,
                        completedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('툴킷이 취합 완료 처리되었습니다.');
                    setToolkitSubTab('completed'); // 취합 완료 탭으로 전환
                    loadData();
                } catch (error) {
                    console.error('취합 완료 처리 오류:', error);
                    alert('취합 완료 처리에 실패했습니다.');
                }
            };

            // 툴킷 수정 모달 열기
            const handleEditToolkit = (toolkit) => {
                setEditingToolkit({
                    ...toolkit,
                    image: null,
                    imagePreview: toolkit.imageUrl || '',
                    oldImageUrl: toolkit.imageUrl || ''
                });
                setShowEditModal(true);
            };

            // 툴킷 수정 저장
            const handleUpdateToolkit = async (e) => {
                e.preventDefault();

                if (!editingToolkit.name.trim()) {
                    alert('툴킷 이름을 입력하세요.');
                    return;
                }

                const validRanges = editingToolkit.priceRanges.filter(range =>
                    range.minQty !== '' && range.pricePerUnit !== ''
                );

                if (validRanges.length === 0) {
                    alert('최소 1개 이상의 가격 구간을 설정하세요.');
                    return;
                }

                try {
                    let imageUrl = editingToolkit.oldImageUrl || '';

                    // 새 이미지가 있으면 업로드
                    if (editingToolkit.image) {
                        // 기존 이미지 삭제 (있으면)
                        if (editingToolkit.oldImageUrl) {
                            try {
                                const oldImageRef = storage.refFromURL(editingToolkit.oldImageUrl);
                                await oldImageRef.delete();
                            } catch (error) {
                                console.log('기존 이미지 삭제 오류 (무시):', error);
                            }
                        }

                        // 새 이미지 업로드
                        const timestamp = Date.now();
                        const fileName = `${timestamp}_${editingToolkit.image.name}`;
                        const filePath = `toolkits/${fileName}`;

                        const storageRef = storage.ref(filePath);
                        const uploadTask = await storageRef.put(editingToolkit.image);
                        imageUrl = await uploadTask.ref.getDownloadURL();
                    }

                    await db.collection('toolkits').doc(editingToolkit.id).update({
                        name: editingToolkit.name,
                        description: editingToolkit.description || '',
                        imageUrl: imageUrl,
                        dueDate: editingToolkit.dueDate || null,
                        minOrderQty: editingToolkit.minOrderQty ? Number(editingToolkit.minOrderQty) : null,
                        orderUnit: editingToolkit.orderUnit ? Number(editingToolkit.orderUnit) : null,
                        showTotalOrders: editingToolkit.showTotalOrders !== false,
                        priceRanges: validRanges.map(range => ({
                            minQty: Number(range.minQty),
                            maxQty: range.maxQty === '' ? null : Number(range.maxQty),
                            pricePerUnit: Number(range.pricePerUnit)
                        })),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('툴킷이 수정되었습니다.');
                    setShowEditModal(false);
                    setEditingToolkit(null);
                    loadData();

                    console.error('툴킷 수정 오류:', error);
                    alert('툴킷 수정에 실패했습니다.');
                }
            };

            // 수정용 가격 구간 추가
            const handleEditAddRange = () => {
                setEditingToolkit({
                    ...editingToolkit,
                    priceRanges: [...editingToolkit.priceRanges, {
                        minQty: '',
                        maxQty: '',
                        pricePerUnit: ''
                    }]
                });
            };

            // 수정용 가격 구간 삭제
            const handleEditRemoveRange = (index) => {
                if (editingToolkit.priceRanges.length === 1) {
                    alert('최소 1개의 가격 구간이 필요합니다.');
                    return;
                }
                const newRanges = editingToolkit.priceRanges.filter((_, idx) => idx !== index);
                setEditingToolkit({ ...editingToolkit, priceRanges: newRanges });
            };

            // 수정용 가격 구간 입력 핸들러
            const handleEditRangeChange = (index, field, value) => {
                const newRanges = [...editingToolkit.priceRanges];
                newRanges[index] = { ...newRanges[index], [field]: value };
                setEditingToolkit({ ...editingToolkit, priceRanges: newRanges });
            };

            // 수정용 이미지 업로드
            const handleEditImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.match('image/(jpeg|png)')) {
                    alert('JPG 또는 PNG 파일만 업로드 가능합니다.');
                    e.target.value = '';
                    return;
                }

                const img = new Image();
                const objectUrl = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);

                    if (img.width !== 560 || img.height !== 700) {
                        alert(`이미지 크기가 올바르지 않습니다.\n필수: 560 x 700 픽셀\n현재: ${img.width} x ${img.height} 픽셀`);
                        e.target.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setEditingToolkit({
                            ...editingToolkit,
                            image: file,
                            imagePreview: reader.result
                        });
                    };
                    reader.readAsDataURL(file);
                };

                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    alert('이미지 파일을 읽을 수 없습니다.');
                    e.target.value = '';
                };

                img.src = objectUrl;
            };

                    return;

                const headers = ['툴킷명', '지점명', '팀', '주문 수량', '단가', '예상 금액', '주문일시'];
                const rows = filteredOrders.map(order => {
                    const toolkit = toolkits.find(t => t.id === order.toolkitId);

                    const totalAmount = (order.quantity || 0) * pricePerUnit;
                    return [
                        order.toolkitName || toolkit?.name || '-',
                        order.branchName || '미설정',
                        order.team || '-',

                        `${pricePerUnit.toLocaleString()}원`,
                        `${totalAmount.toLocaleString()}원`,
                        formatDate(order.updatedAt || order.createdAt)

                // BOM 추가 (한글 깨짐 방지)
                const BOM = '\uFEFF';
                const csvContent = BOM + [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))

                const url = URL.createObjectURL(blob);

                const today = new Date();
                const dateStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;

                link.setAttribute('href', url);
                link.setAttribute('download', `툴킷_주문현황_${dateStr}.csv`);

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            const [branchManagerMap, setBranchManagerMap] = useState({}); // 지점-담당자 매핑

            // 날짜 필터 상태
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            // 포함/제외 필터 상태
            const [filterColumn, setFilterColumn] = useState('branchName'); // 필터링할 열
            const [filterMode, setFilterMode] = useState('include'); // 'include' 또는 'exclude'
            const [filterValue, setFilterValue] = useState(''); // 필터링할 값

            // 선택 및 삭제 관련 상태
            const [selectedCosts, setSelectedCosts] = useState([]);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            // 이미지 미리보기 모달 상태
            const [showImageModal, setShowImageModal] = useState(false);
            const [previewImages, setPreviewImages] = useState([]);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);

            // 상세보기 모달 상태
            const [detailCost, setDetailCost] = useState(null);

            // 비용 편집 관련 상태
            const [isEditingCost, setIsEditingCost] = useState(false);
            const [editedAmount, setEditedAmount] = useState('');
            const [editPassword, setEditPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);

            // 결제요청서 모달 상태
            const [showPaymentRequestModal, setShowPaymentRequestModal] = useState(false);
            const [paymentRequestText, setPaymentRequestText] = useState('');

            // 대량 업로드 모달 상태
            const [showBulkUploadPasswordModal, setShowBulkUploadPasswordModal] = useState(false);
            const [bulkUploadPassword, setBulkUploadPassword] = useState('');
            const [isVerifyingBulkPassword, setIsVerifyingBulkPassword] = useState(false);
            const [showBulkUploadModal, setShowBulkUploadModal] = useState(false);
            const [uploadFile, setUploadFile] = useState(null);
            const [uploadPreviewData, setUploadPreviewData] = useState([]);
            const [uploadErrors, setUploadErrors] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);

            // 페이지네이션 상태
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 20;

            // 집행 탭 상태
            const [executionTab, setExecutionTab] = useState('all'); // 'all', 'unexecuted' 또는 'executed'

            // Round 관련 상태
            const [currentRound, setCurrentRound] = useState(null);
            const [totalBudget, setTotalBudget] = useState(0);
            const [branchBudgets, setBranchBudgets] = useState({});

            // 금액 포맷
            const formatAmount = (amount) => {
                return new Intl.NumberFormat('ko-KR', {
                    style: 'currency',
                    currency: 'KRW'
                }).format(amount);
            };

            // 금액 포맷 (엑셀용 - 숫자만)
            const formatAmountForExcel = (amount) => {
                return Number(amount || 0);
            };

            // 날짜 포맷 (비용용)
            const formatCostDate = (dateValue) => {
                if (!dateValue) return '-';
                const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit'
                });
            };

            // 날짜 포맷 (엑셀용)
            const formatDateForExcel = (dateValue) => {
                if (!dateValue) return '';
                const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit'
                });
            };

            // Firestore에서 모든 비용 로드
            useEffect(() => {
                const unsubscribe = db.collection('costs')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot((snapshot) => {
                        const costsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setCosts(costsData);

                        // 지점 목록 추출
                        const branchSet = new Set();
                        costsData.forEach(cost => {
                            if (cost.branchName) {
                                branchSet.add(cost.branchName);
                            }
                        });
                        setBranches([...branchSet].sort());
                        setLoading(false);
                    }, (error) => {
                        console.error('비용 목록 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            // 지점-담당자 매핑 및 담당자 목록 로드 (users 컬렉션에서)
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot((snapshot) => {
                        const mapping = {};
                        const managerSet = new Set();
                        snapshot.docs.forEach(doc => {
                            const userData = doc.data();
                            if (userData.branchName && userData.manager) {
                                mapping[userData.branchName] = userData.manager;
                                managerSet.add(userData.manager);
                            }
                        });
                        setBranchManagerMap(mapping);
                        setManagers([...managerSet].sort());
                    }, (error) => {
                        console.error('지점-담당자 매핑 로드 오류:', error);
                    });

                return () => unsubscribe();
            }, []);

            // 현재 진행 중인 Round와 배정 비용 로드
            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];

                const roundsUnsubscribe = db.collection('rounds')
                    .onSnapshot(async (snapshot) => {
                        const roundsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));

                        // 현재 날짜가 포함된 Round 찾기
                        const activeRound = roundsData.find(round => {
                            return today >= round.startDate && today <= round.endDate;
                        });

                        if (activeRound) {
                            setCurrentRound(activeRound);

                            // 해당 Round의 전체 배정 비용 가져오기
                            try {
                                const budgetDoc = await db.collection('roundBudgets').doc(activeRound.id).get();
                                if (budgetDoc.exists) {
                                    const budgets = budgetDoc.data().budgets || {};
                                    setBranchBudgets(budgets);
                                    // 전체 배정 비용 합계
                                    const total = Object.values(budgets).reduce((sum, val) => sum + Number(val || 0), 0);
                                    setTotalBudget(total);
                                }
                            } catch (error) {
                                console.error('배정 비용 로드 오류:', error);
                            }
                        } else {
                            setCurrentRound(null);
                            setTotalBudget(0);
                            setBranchBudgets({});
                        }
                    });

                return () => roundsUnsubscribe();
            }, []);

            // Round 기간 내 사용 비용 계산 (전체)
            const getRoundUsedAmount = () => {
                if (!currentRound) return 0;

                return costs.filter(cost => {
                    const costDate = cost.date;
                    if (costDate < currentRound.startDate || costDate > currentRound.endDate) return false;

                    // 담당자 필터 적용
                    if (selectedManager !== 'all' && branchManagerMap[cost.branchName] !== selectedManager) return false;

                    return true;
                }).reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // Round 기간 내 지점별 사용 비용 계산
            const getRoundUsedByBranch = (branchName) => {
                if (!currentRound) return 0;

                return costs.filter(cost => {
                    if (cost.branchName !== branchName) return false;
                    const costDate = cost.date;
                    if (costDate < currentRound.startDate || costDate > currentRound.endDate) return false;

                    // 담당자 필터 적용
                    if (selectedManager !== 'all' && branchManagerMap[cost.branchName] !== selectedManager) return false;

                    return true;
                }).reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // Round 기간 내 지점별 집행된 비용 계산
            const getRoundExecutedByBranch = (branchName) => {
                if (!currentRound) return 0;

                return costs.filter(cost => {
                    if (cost.branchName !== branchName) return false;
                    const costDate = cost.date;
                    if (costDate < currentRound.startDate || costDate > currentRound.endDate) return false;

                    // 담당자 필터 적용
                    if (selectedManager !== 'all' && branchManagerMap[cost.branchName] !== selectedManager) return false;

                    // 집행된 비용만
                    if (!cost.isExecuted) return false;

                    return true;
                }).reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // 지점별 소진율 엑셀 다운로드
            const handleExportBranchStatus = () => {
                if (!currentRound) {
                    alert('활성화된 Round가 없습니다.');
                    return;
                }

                // 데이터 준비
                const excelData = Object.entries(branchBudgets)
                    .filter(([_, budget]) => budget > 0)
                    .filter(([branch, _]) => {
                        // 담당자 필터가 선택된 경우, 해당 담당자에 속한 지점만 포함
                        if (selectedManager !== 'all') {
                            return branchManagerMap[branch] === selectedManager;
                        }
                        return true;
                    })
                    .map(([branch, budget]) => {
                        const used = getRoundUsedByBranch(branch);
                        const executed = getRoundExecutedByBranch(branch);
                        const usageRate = budget > 0 ? ((used / budget) * 100).toFixed(2) : '0.00';
                        const executionRate = budget > 0 ? ((executed / budget) * 100).toFixed(2) : '0.00';

                        return {
                            '지점': branch,
                            '예산': budget,
                            '사용 예산': used,
                            '집행 예산': executed,
                            '소진율(%)': usageRate,
                            '집행율(%)': executionRate
                        };
                    });

                if (excelData.length === 0) {
                    alert('다운로드할 데이터가 없습니다.');
                    return;
                }

                // 엑셀 파일 생성
                const ws = XLSX.utils.json_to_sheet(excelData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '지점별 소진율');

                // 파일명 생성
                const managerSuffix = selectedManager !== 'all' ? `_${selectedManager}` : '';
                const fileName = `지점별소진율_${currentRound.name}${managerSuffix}_${new Date().toISOString().split('T')[0]}.xlsx`;

                // 다운로드
                XLSX.writeFile(wb, fileName);
            };

            // 필터링된 비용
            // 필터링된 비용 목록
            const filteredCosts = costs.filter(cost => {
                // Round 기간 필터 (현재 Round가 있을 때)
                if (currentRound) {
                    const costDate = cost.date;
                    if (costDate < currentRound.startDate || costDate > currentRound.endDate) {
                        return false;
                    }
                }

                // 지점 필터
                if (selectedBranch !== 'all' && cost.branchName !== selectedBranch) {
                    return false;
                }

                // 담당자 필터
                if (selectedManager !== 'all' && branchManagerMap[cost.branchName] !== selectedManager) {
                    return false;
                }

                // 추가 날짜 필터 (cost.date 기준)
                if (startDate || endDate) {
                    const costDate = new Date(cost.date);

                    if (startDate) {
                        const start = new Date(startDate);
                        start.setHours(0, 0, 0, 0);
                        if (costDate < start) return false;
                    }

                    if (endDate) {
                        const end = new Date(endDate);
                        end.setHours(23, 59, 59, 999);
                        if (costDate > end) return false;
                    }
                }

                // 포함/제외 필터
                if (filterValue.trim()) {
                    let fieldValue = '';

                    // 선택된 열의 값 가져오기
                    switch (filterColumn) {
                        case 'branchName':
                            fieldValue = (cost.branchName || '').toLowerCase();
                            break;
                        case 'team':
                            fieldValue = (cost.team || '').toLowerCase();
                            break;
                        case 'category':
                            // 카테고리의 경우 label도 검색
                            const categoryLabel = categories[cost.category]?.label || cost.category || '';
                            fieldValue = categoryLabel.toLowerCase();
                            break;
                        case 'amount':
                            fieldValue = String(cost.amount || '');
                            break;
                        case 'description':
                            fieldValue = (cost.description || '').toLowerCase();
                            break;
                        default:
                            fieldValue = '';
                    }

                    const searchValue = filterValue.toLowerCase().trim();
                    const isMatch = fieldValue.includes(searchValue);

                    // 포함 모드: 일치하면 true, 일치하지 않으면 false
                    // 제외 모드: 일치하면 false, 일치하지 않으면 true
                    if (filterMode === 'include') {
                        if (!isMatch) return false;
                    } else if (filterMode === 'exclude') {
                        if (isMatch) return false;
                    }
                }

                // 집행 탭 필터
                if (executionTab === 'all') {
                    // 전체: 필터링하지 않음
                } else if (executionTab === 'unexecuted') {
                    // 미집행건: isExecuted가 false이거나 없는 항목
                    if (cost.isExecuted === true) return false;
                } else if (executionTab === 'executed') {
                    // 집행건: isExecuted가 true인 항목
                    if (cost.isExecuted !== true) return false;
                }

                return true;
            });

            // 페이지네이션 계산
            const totalPages = Math.ceil(filteredCosts.length / ITEMS_PER_PAGE);
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const paginatedCosts = filteredCosts.slice(startIndex, endIndex);

            // 필터 변경 시 페이지 리셋
            useEffect(() => {
                setCurrentPage(1);
            }, [selectedBranch, selectedManager, startDate, endDate, filterColumn, filterMode, filterValue]);

            // 필터 초기화
            const handleResetFilters = () => {
                setSelectedBranch('all');
                setSelectedManager('all');
                setStartDate('');
                setEndDate('');
                setFilterColumn('branchName');
                setFilterMode('include');
                setFilterValue('');
                setCurrentPage(1);
            };

            // 체크박스 - 개별 선택
            const handleSelectCost = (id) => {
                setSelectedCosts(prev => {
                    if (prev.includes(id)) {
                        return prev.filter(costId => costId !== id);
                    } else {
                        return [...prev, id];
                    }
                });
            };

            // 체크박스 - 전체 선택
            const handleSelectAll = () => {
                const currentPageIds = paginatedCosts.map(cost => cost.id);
                const allCurrentPageSelected = currentPageIds.every(id => selectedCosts.includes(id));

                if (allCurrentPageSelected) {
                    // 현재 페이지 항목들을 선택 해제
                    setSelectedCosts(prev => prev.filter(id => !currentPageIds.includes(id)));
                } else {
                    // 현재 페이지 항목들을 선택에 추가
                    setSelectedCosts(prev => [...new Set([...prev, ...currentPageIds])]);
                }
            };

            // 집행 상태 토글
            const toggleExecutionStatus = async (costId, currentStatus) => {
                try {
                    const newStatus = !currentStatus;
                    const costRef = firebase.firestore().collection('costs').doc(costId);

                    await costRef.update({
                        isExecuted: newStatus,
                        executedAt: newStatus ? firebase.firestore.FieldValue.serverTimestamp() : null
                    });

                    // 로컬 상태 업데이트
                    setCosts(prevCosts =>
                        prevCosts.map(cost =>
                            cost.id === costId
                                ? { ...cost, isExecuted: newStatus }
                                : cost
                        )
                    );

                    // 상세 모달 닫기
                    setDetailCost(null);

                    // 해당 탭으로 자동 전환
                    setExecutionTab(newStatus ? 'executed' : 'unexecuted');
                    setCurrentPage(1);
                } catch (error) {
                    console.error('집행 상태 업데이트 실패:', error);
                    alert('집행 상태 업데이트에 실패했습니다.');
                }
            };

            // 비용 편집 시작
            const startEditingCost = () => {
                setEditedAmount(detailCost.amount.toString());
                setIsEditingCost(true);
            };

            // 비용 편집 취소
            const cancelEditingCost = () => {
                setIsEditingCost(false);
                setEditedAmount('');
            };

            // 비용 변경 시도 (비밀번호 모달 열기)
            const attemptUpdateCost = () => {
                const newAmount = parseInt(editedAmount);
                if (isNaN(newAmount) || newAmount < 0) {
                    alert('올바른 금액을 입력해주세요.');
                    return;
                }
                setEditPassword('');
                setShowPasswordModal(true);
            };

            // 비용 변경 실행 (비밀번호 확인 후)
            const updateCostAmount = async () => {
                try {
                    // Firestore에서 비밀번호 가져오기
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다. Round 관리에서 먼저 설정해주세요.');
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (editPassword !== storedPassword) {
                        alert('비밀번호가 올바르지 않습니다.');
                        return;
                    }

                    const newAmount = parseInt(editedAmount);
                    const costRef = firebase.firestore().collection('costs').doc(detailCost.id);

                    await costRef.update({
                        amount: newAmount,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // 로컬 상태 업데이트
                    setCosts(prevCosts =>
                        prevCosts.map(cost =>
                            cost.id === detailCost.id
                                ? { ...cost, amount: newAmount }
                                : cost
                        )
                    );

                    // detailCost 상태 업데이트
                    setDetailCost(prev => ({ ...prev, amount: newAmount }));

                    // 모달 닫기 및 상태 초기화
                    setShowPasswordModal(false);
                    setIsEditingCost(false);
                    setEditPassword('');
                    setEditedAmount('');

                    alert('비용이 성공적으로 변경되었습니다.');
                } catch (error) {
                    console.error('비용 업데이트 실패:', error);
                    alert('비용 업데이트에 실패했습니다.');
                }
            };

            // 삭제 모달 열기
            const openDeleteModal = () => {
                if (selectedCosts.length === 0) {
                    alert('삭제할 항목을 선택해주세요.');
                    return;
                }
                setDeletePassword('');
                setShowDeleteModal(true);
            };

            // 이미지 미리보기 열기
            const openImagePreview = (images) => {
                if (!images || images.length === 0) {
                    alert('등록된 이미지가 없습니다.');
                    return;
                }
                setPreviewImages(images);
                setCurrentImageIndex(0);
                setShowImageModal(true);
            };

            // 이미지 다운로드
            const handleDownloadImage = async () => {
                if (previewImages.length === 0) return;

                try {
                    const currentImage = previewImages[currentImageIndex];
                    const fileName = currentImage.name || `증빙이미지_${currentImageIndex + 1}.jpg`;

                    // fetch로 Blob 가져오기 (CORS 설정 완료)
                    const response = await fetch(currentImage.url);
                    if (!response.ok) throw new Error('이미지 다운로드 실패');

                    const blob = await response.blob();

                    // Blob URL 생성 후 다운로드
                    const blobUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Blob URL 메모리 해제
                    window.URL.revokeObjectURL(blobUrl);
                } catch (error) {
                    console.error('이미지 다운로드 오류:', error);
                    alert('이미지 다운로드에 실패했습니다.\n\n대안: 이미지에서 우클릭 → "다른 이름으로 이미지 저장"을 선택하세요.');
                }
            };

            // 이전/다음 이미지
            const handlePrevImage = () => {
                setCurrentImageIndex(prev => prev > 0 ? prev - 1 : previewImages.length - 1);
            };

            const handleNextImage = () => {
                setCurrentImageIndex(prev => prev < previewImages.length - 1 ? prev + 1 : 0);
            };

            // 비밀번호 확인 후 삭제 실행
            const handleConfirmDelete = async (e) => {
                e.preventDefault();

                if (!deletePassword) {
                    alert('고유 비밀번호를 입력해주세요.');
                    return;
                }

                setIsDeleting(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다. Round 관리에서 먼저 설정해주세요.');
                        setIsDeleting(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (deletePassword !== storedPassword) {
                        alert('고유 비밀번호가 올바르지 않습니다.');
                        setIsDeleting(false);
                        return;
                    }

                    // 선택된 비용의 이미지도 함께 삭제
                    for (const costId of selectedCosts) {
                        const costData = costs.find(c => c.id === costId);
                        if (costData && costData.userId) {
                            await deleteCostImages(costData.userId, costId);
                        }
                    }

                    // 툴킷 비용인 경우, 연결된 주문도 삭제
                    const deletedToolkitIds = new Set(); // 가격 재계산이 필요한 툴킷 ID
                    for (const costId of selectedCosts) {
                        const costData = costs.find(c => c.id === costId);
                        if (costData && costData.category === 'toolkit') {
                            // 해당 costId를 가진 주문 찾기
                            const orderSnapshot = await db.collection('toolkitOrders')
                                .where('costId', '==', costId)
                                .get();

                            // 주문 삭제 및 툴킷 ID 수집
                            for (const orderDoc of orderSnapshot.docs) {
                                const orderData = orderDoc.data();
                                if (orderData.toolkitId) {
                                    deletedToolkitIds.add(orderData.toolkitId);
                                }
                                await db.collection('toolkitOrders').doc(orderDoc.id).delete();
                            }
                        }
                    }

                    // 삭제된 주문이 있는 툴킷들의 가격 재계산
                    for (const toolkitId of deletedToolkitIds) {
                        try {
                            // 해당 툴킷 정보 가져오기
                            const toolkitDoc = await db.collection('toolkits').doc(toolkitId).get();
                            if (!toolkitDoc.exists) continue;
                            const toolkit = { id: toolkitDoc.id, ...toolkitDoc.data() };

                            // 해당 툴킷의 남은 주문들 가져오기
                            const remainingOrdersSnapshot = await db.collection('toolkitOrders')
                                .where('toolkitId', '==', toolkitId)
                                .get();

                            if (remainingOrdersSnapshot.empty) continue;

                            // 전체 수량 계산
                            let totalQty = 0;
                            remainingOrdersSnapshot.forEach(doc => {
                                totalQty += Number(doc.data().quantity || 0);
                            });

                            // 새로운 단가 계산
                            const priceRanges = toolkit.priceRanges || [];
                            let newPricePerUnit = 0;
                            for (let i = priceRanges.length - 1; i >= 0; i--) {
                                if (totalQty >= priceRanges[i].minQty) {
                                    newPricePerUnit = priceRanges[i].price;
                                    break;
                                }
                            }

                            // 모든 남은 주문과 비용 업데이트
                            const updateBatch = db.batch();
                            remainingOrdersSnapshot.forEach(doc => {
                                const orderData = doc.data();
                                const quantity = Number(orderData.quantity || 0);
                                const newTotalAmount = quantity * newPricePerUnit;

                                // 주문 업데이트
                                updateBatch.update(doc.ref, {
                                    pricePerUnit: newPricePerUnit,
                                    totalAmount: newTotalAmount,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });

                                // 연결된 비용 업데이트
                                if (orderData.costId) {
                                    const costRef = db.collection('costs').doc(orderData.costId);
                                    updateBatch.update(costRef, {
                                        amount: newTotalAmount,
                                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                    });
                                }
                            });
                            await updateBatch.commit();
                        } catch (error) {
                            console.error(`툴킷 ${toolkitId} 가격 재계산 오류:`, error);
                        }
                    }

                    // Firestore에서 비용 데이터 삭제
                    const batch = db.batch();
                    selectedCosts.forEach(id => {
                        const docRef = db.collection('costs').doc(id);
                        batch.delete(docRef);
                    });
                    await batch.commit();

                    alert(`${selectedCosts.length}개 항목이 삭제되었습니다.`);
                    setSelectedCosts([]);
                    setShowDeleteModal(false);
                } catch (error) {
                    console.error('삭제 오류:', error);
                    alert('삭제에 실패했습니다.\n\n오류: ' + (error.message || '알 수 없는 오류'));
                } finally {
                    setIsDeleting(false);
                    setDeletePassword('');
                }
            };

            // 엑셀 다운로드
            const handleExportExcel = () => {
                const dataToExport = selectedCosts.length > 0
                    ? filteredCosts.filter(cost => selectedCosts.includes(cost.id))
                    : filteredCosts;

                if (dataToExport.length === 0) {
                    alert('내보낼 데이터가 없습니다.');
                    return;
                }

                // CSV 데이터 생성
                const headers = ['지점', '팀', '날짜', '항목', '금액', '설명', '등록자', '등록일시'];
                const rows = dataToExport.map(cost => [
                    cost.branchName || '미설정',
                    cost.team || '-',
                    formatDateForExcel(cost.date),
                    categories[cost.category]?.label || cost.category,
                    formatAmountForExcel(cost.amount),
                    cost.description || '',
                    cost.userEmail || '',
                    formatDateForExcel(cost.createdAt)
                ]);

                // BOM 추가 (한글 깨짐 방지)
                const BOM = '\uFEFF';
                const csvContent = BOM + [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                ].join('\n');

                // 파일 다운로드
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                const fileName = `마케팅비용_${selectedBranch === 'all' ? '전체' : selectedBranch}_${new Date().toLocaleDateString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit' }).replace(/\./g, '')}.csv`;
                link.setAttribute('download', fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // 대량 업로드 모달 닫기 및 초기화
            const closeBulkUploadModal = () => {
                if (isUploading) return; // 업로드 중에는 닫지 못함
                setShowBulkUploadModal(false);
                setUploadFile(null);
                setUploadPreviewData([]);
                setUploadErrors([]);
                setUploadProgress(0);
            };

            // 대량 업로드 비밀번호 검증
            const handleBulkUploadPasswordSubmit = async (e) => {
                e.preventDefault();
                setIsVerifyingBulkPassword(true);

                try {
                    // Firestore에서 비밀번호 가져오기
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        alert('고유 비밀번호가 설정되지 않았습니다. Round 관리에서 먼저 설정해주세요.');
                        setIsVerifyingBulkPassword(false);
                        return;
                    }

                    const storedPassword = doc.data().password;

                    if (bulkUploadPassword === storedPassword) {
                        setShowBulkUploadPasswordModal(false);
                        setShowBulkUploadModal(true);
                        setBulkUploadPassword('');
                    } else {
                        alert('비밀번호가 일치하지 않습니다.');
                    }
                } catch (error) {
                    console.error('비밀번호 확인 오류:', error);
                    alert('비밀번호 확인 중 오류가 발생했습니다.');
                } finally {
                    setIsVerifyingBulkPassword(false);
                }
            };

            // 템플릿 엑셀 다운로드
            const handleDownloadTemplate = () => {
                const headers = ['지점명', '팀', '날짜(YYYY-MM-DD)', '항목', '금액', '설명'];
                const sampleData = [
                    ['강남점', '성인', '2026-02-01', '온라인 광고비', '500000', 'Google 광고 캠페인'],
                    ['홍대점', '주니어', '2026-02-02', '전단지', '300000', 'A4 전단지 5000매']
                ];

                // CSV 데이터 생성
                const BOM = '\uFEFF';
                const csvContent = BOM + [
                    headers.join(','),
                    ...sampleData.map(row => row.map(cell => `"${String(cell)}"`).join(','))
                ].join('\n');

                // 파일 다운로드
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', '마케팅비용_업로드_템플릿.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // 파일 읽기 및 검증
            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileExtension = file.name.split('.').pop().toLowerCase();

                if (!['csv', 'xlsx', 'xls'].includes(fileExtension)) {
                    alert('CSV 또는 엑셀 파일만 업로드 가능합니다.');
                    return;
                }

                if (file.size > 10 * 1024 * 1024) {
                    alert('파일 크기는 10MB 이하여야 합니다.');
                    return;
                }

                setUploadFile(file);

                const reader = new FileReader();

                if (fileExtension === 'csv') {
                    reader.onload = (e) => {
                        const text = e.target.result;
                        const lines = text.split('\n').filter(line => line.trim());

                        if (lines.length < 2) {
                            alert('파일에 데이터가 없습니다.');
                            return;
                        }

                        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                        const dataRows = lines.slice(1);

                        const parsedData = dataRows.map((line, index) => {
                            const values = line.split(',').map(v => v.replace(/"/g, '').trim());
                            return {
                                rowIndex: index + 2,
                                branchName: values[0] || '',
                                team: values[1] || '',
                                date: values[2] || '',
                                item: values[3] || '',
                                amount: values[4] || '',
                                description: values[5] || ''
                            };
                        });

                        validateUploadData(parsedData);
                    };
                    reader.readAsText(file, 'UTF-8');
                } else {
                    reader.onload = (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        if (jsonData.length < 2) {
                            alert('파일에 데이터가 없습니다.');
                            return;
                        }

                        const headers = jsonData[0];
                        const dataRows = jsonData.slice(1);

                        const parsedData = dataRows.map((row, index) => {
                            return {
                                rowIndex: index + 2,
                                branchName: String(row[0] || '').trim(),
                                team: String(row[1] || '').trim(),
                                date: String(row[2] || '').trim(),
                                item: String(row[3] || '').trim(),
                                amount: String(row[4] || '').trim(),
                                description: String(row[5] || '').trim()
                            };
                        }).filter(row => row.branchName || row.date || row.amount); // 빈 행 제거

                        validateUploadData(parsedData);
                    };
                    reader.readAsArrayBuffer(file);
                }
            };

            // 데이터 검증
            const validateUploadData = (data) => {
                const errors = [];
                const validatedData = data.map((row, index) => {
                    const rowErrors = [];

                    // 필수 필드 검증
                    if (!row.branchName) rowErrors.push('지점명 필수');
                    if (!row.date) rowErrors.push('날짜 필수');
                    if (!row.item) rowErrors.push('항목 필수');
                    if (!row.amount) rowErrors.push('금액 필수');

                    // 날짜 형식 검증
                    const dateRegex = /^\d{4}[-./]\d{1,2}[-./]\d{1,2}$/;
                    if (row.date && !dateRegex.test(row.date)) {
                        rowErrors.push('날짜 형식 오류 (YYYY-MM-DD)');
                    }

                    // 금액 검증
                    const amountNum = Number(row.amount.replace(/,/g, ''));
                    if (row.amount && (isNaN(amountNum) || amountNum <= 0)) {
                        rowErrors.push('금액은 0보다 큰 숫자여야 함');
                    }

                    // 지점명 검증 (등록된 지점인지)
                    if (row.branchName && !branches.includes(row.branchName)) {
                        rowErrors.push('미등록 지점');
                    }

                    if (rowErrors.length > 0) {
                        errors.push({
                            row: row.rowIndex,
                            errors: rowErrors
                        });
                    }

                    return {
                        ...row,
                        amountNum,
                        hasError: rowErrors.length > 0,
                        errorMessages: rowErrors
                    };
                });

                setUploadPreviewData(validatedData);
                setUploadErrors(errors);
            };

            // 대량 업로드 실행
            const handleBulkUpload = async () => {
                if (uploadPreviewData.length === 0) {
                    alert('업로드할 데이터가 없습니다.');
                    return;
                }

                if (uploadErrors.length > 0) {
                    const confirm = window.confirm(
                        `${uploadErrors.length}개의 오류가 있습니다.\n오류가 있는 행은 제외하고 업로드하시겠습니까?`
                    );
                    if (!confirm) return;
                }

                setIsUploading(true);
                setUploadProgress(0);

                try {
                    const validData = uploadPreviewData.filter(row => !row.hasError);
                    const totalCount = validData.length;
                    let uploadedCount = 0;
                    let failedCount = 0;

                    // Firestore batch write (500개씩)
                    const BATCH_SIZE = 500;

                    for (let i = 0; i < validData.length; i += BATCH_SIZE) {
                        const batch = db.batch();
                        const chunk = validData.slice(i, i + BATCH_SIZE);

                        for (const row of chunk) {
                            try {
                                const docRef = db.collection('costs').doc();

                                // 날짜 형식 변환
                                const dateStr = row.date.replace(/[./]/g, '-');

                                batch.set(docRef, {
                                    userId: user.uid,
                                    branchName: row.branchName,
                                    team: row.team || '',
                                    date: dateStr,
                                    category: 'etc',
                                    item: row.item,
                                    amount: row.amountNum,
                                    description: row.description || '',
                                    userEmail: user.email,
                                    userName: user.displayName || '관리자(대량업로드)',
                                    imageUrls: [],
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    status: 'pending'
                                });

                                uploadedCount++;
                            } catch (error) {
                                console.error(`Row ${row.rowIndex} upload failed:`, error);
                                failedCount++;
                            }
                        }

                        await batch.commit();
                        setUploadProgress(Math.round((i + chunk.length) / totalCount * 100));
                    }

                    setIsUploading(false);

                    if (failedCount > 0) {
                        alert(`업로드 완료!\n성공: ${uploadedCount}건\n실패: ${failedCount}건`);
                    } else {
                        alert(`${uploadedCount}건이 성공적으로 업로드되었습니다! 🎉`);
                    }

                    // 모달 닫기 및 초기화
                    closeBulkUploadModal();

                } catch (error) {
                    console.error('대량 업로드 오류:', error);
                    alert('업로드 중 오류가 발생했습니다: ' + error.message);
                    setIsUploading(false);
                }
            };

            // 결제요청서 생성
            const generatePaymentRequest = () => {
                if (selectedCosts.length === 0) {
                    alert('선택된 항목이 없습니다.');
                    return;
                }

                // 선택된 비용 데이터 가져오기
                const selectedData = costs.filter(cost => selectedCosts.includes(cost.id));

                // 지점명 추출 (중복 제거)
                const branches = [...new Set(selectedData.map(cost => cost.branchName || '미설정'))];
                const branchName = branches.length === 1 ? branches[0] : '다수 지점';

                // HTML 형식으로 생성
                let html = `<div style="font-family: 'Malgun Gothic', sans-serif; line-height: 1.8;">`;

                // 1. 목적
                html += `<p style="margin-bottom: 10px;"><strong>1. 목적</strong></p>`;
                html += `<p style="margin-left: 20px; margin-bottom: 20px;"> - '${branchName}'의 지점 마케팅 진행 비용 결제 요청</p>`;

                // 2. 내용 (테이블)
                html += `<p style="margin-bottom: 10px;"><strong>2. 내용</strong></p>`;
                html += `<table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; margin-bottom: 20px; margin-left: 20px;">`;
                html += `<thead><tr style="background-color: #f0f0f0;">`;
                html += `<th style="border: 1px solid #ccc; text-align: center; width: 100px; white-space: nowrap;">구분</th>`;
                html += `<th style="border: 1px solid #ccc; text-align: center; width: 120px; white-space: nowrap;">지점</th>`;
                html += `<th style="border: 1px solid #ccc; text-align: center;">내용</th>`;
                html += `<th style="border: 1px solid #ccc; text-align: center; width: 120px; white-space: nowrap;">금액</th>`;
                html += `<th style="border: 1px solid #ccc; text-align: center; width: 100px; white-space: nowrap;">비고</th>`;
                html += `</tr></thead><tbody>`;

                // 테이블 데이터
                selectedData.forEach((cost, index) => {
                    const category = categories[cost.category]?.label || cost.category;
                    const branch = cost.branchName || '미설정';
                    const description = cost.description || '-';
                    const amount = Number(cost.amount || 0).toLocaleString('ko-KR') + '원';
                    const remark = formatCostDate(cost.date);

                    html += `<tr>`;
                    html += `<td style="border: 1px solid #ccc; text-align: center; white-space: nowrap;">${category}</td>`;
                    html += `<td style="border: 1px solid #ccc; text-align: center; white-space: nowrap;">${branch}</td>`;
                    html += `<td style="border: 1px solid #ccc; padding-left: 10px;">${description}</td>`;
                    html += `<td style="border: 1px solid #ccc; text-align: right; padding-right: 10px; white-space: nowrap;">${amount}</td>`;
                    html += `<td style="border: 1px solid #ccc; text-align: center; white-space: nowrap;">${remark}</td>`;
                    html += `</tr>`;
                });

                // 총액 추가
                const totalAmount = selectedData.reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
                html += `<tr style="background-color: #f8f8f8; font-weight: bold;">`;
                html += `<td colspan="3" style="border: 1px solid #ccc; text-align: center; white-space: nowrap;">총액</td>`;
                html += `<td style="border: 1px solid #ccc; text-align: right; padding-right: 10px; white-space: nowrap;">${totalAmount.toLocaleString('ko-KR')}원</td>`;
                html += `<td style="border: 1px solid #ccc; white-space: nowrap;"></td>`;
                html += `</tr>`;
                html += `</tbody></table>`;

                // 3. 첨부파일
                html += `<p style="margin-bottom: 10px;"><strong>3. 첨부파일</strong></p>`;
                html += `<p style="margin-left: 20px;"> - 증빙 이미지 참조</p>`;
                html += `</div>`;

                setPaymentRequestText(html);
                setShowPaymentRequestModal(true);
            };

            // 결제요청서 복사 (HTML 형식)
            const copyPaymentRequest = async () => {
                try {
                    // HTML과 텍스트 모두 클립보드에 복사
                    const blob = new Blob([paymentRequestText], { type: 'text/html' });
                    const clipboardItem = new ClipboardItem({
                        'text/html': blob
                    });
                    await navigator.clipboard.write([clipboardItem]);
                    alert('결제요청서가 클립보드에 복사되었습니다.\n다우오피스에 붙여넣기(Ctrl+V) 하세요.');
                } catch (err) {
                    console.error('복사 실패:', err);
                    // 폴백: 텍스트로 복사 시도
                    try {
                        await navigator.clipboard.writeText(paymentRequestText);
                        alert('텍스트 형식으로 복사되었습니다.');
                    } catch (err2) {
                        alert('복사에 실패했습니다. 아래 내용을 직접 선택하여 복사해주세요.');
                    }
                }
            };

            // 이번 달 비용 계산
            const getMonthlyTotal = () => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                return filteredCosts
                    .filter(cost => {
                        const costDate = cost.date ? new Date(cost.date) : null;
                        return costDate && costDate.getMonth() === currentMonth && costDate.getFullYear() === currentYear;
                    })
                    .reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // 총 비용 계산
            const getTotalAmount = () => {
                return filteredCosts.reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            if (loading) {
                return (
                    <div className="loading-spinner">
                        <p>비용 데이터를 불러오는 중...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">마케팅 비용</h2>
                        <p className="page-subtitle">전체 지점의 마케팅 비용을 관리합니다</p>
                    </div>

                    {/* 현재 Round 정보 카드 - 전체 또는 선택된 지점 */}
                    {currentRound && totalBudget > 0 && (
                        <div style={{
                            background: selectedBranch !== 'all'
                                ? 'linear-gradient(135deg, #0d4f3c 0%, #1a6b4f 100%)'
                                : 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                            borderRadius: '12px',
                            padding: '24px',
                            marginBottom: '20px',
                            color: 'white'
                        }}>
                            <div style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                marginBottom: '16px'
                            }}>
                                <div>
                                    <div style={{display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '8px', flexWrap: 'wrap'}}>
                                        <div style={{
                                            display: 'inline-block',
