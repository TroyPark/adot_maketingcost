        // 설정 페이지
        function SettingsPage({ user, userInfo, setUserInfo, isEmailVerified, setIsEmailVerified, needsReauth, setNeedsReauth }) {
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [showMarketingPasswordModal, setShowMarketingPasswordModal] = useState(false);
            const [showReauthModal, setShowReauthModal] = useState(false);
            const [reauthPassword, setReauthPassword] = useState('');
            const [isReauthenticating, setIsReauthenticating] = useState(false);
            const [passwordForm, setPasswordForm] = useState({
                currentPassword: '',
                newPassword: '',
                confirmPassword: ''
            });
            const [marketingPasswordForm, setMarketingPasswordForm] = useState({
                newMarketingPassword: '',
                confirmMarketingPassword: ''
            });
            const [isChanging, setIsChanging] = useState(false);
            const [isChangingMarketing, setIsChangingMarketing] = useState(false);
            const [isSendingEmail, setIsSendingEmail] = useState(false);
            const [emailSent, setEmailSent] = useState(false);

            // needsReauth가 true이면 재인증 모달 자동 표시
            useEffect(() => {
                if (needsReauth) {
                    setShowReauthModal(true);
                }
            }, [needsReauth]);

            // 계정 비밀번호 변경
            const handlePasswordChange = async (e) => {
                e.preventDefault();

                if (!passwordForm.currentPassword || !passwordForm.newPassword || !passwordForm.confirmPassword) {
                    alert('모든 항목을 입력해주세요.');
                    return;
                }

                if (passwordForm.newPassword.length < 6) {
                    alert('새 비밀번호는 6자 이상이어야 합니다.');
                    return;
                }

                if (passwordForm.newPassword !== passwordForm.confirmPassword) {
                    alert('새 비밀번호가 일치하지 않습니다.');
                    return;
                }

                setIsChanging(true);

                try {
                    // 현재 비밀번호로 재인증
                    const credential = firebase.auth.EmailAuthProvider.credential(
                        user.email,
                        passwordForm.currentPassword
                    );
                    await user.reauthenticateWithCredential(credential);

                    // 비밀번호 변경
                    await user.updatePassword(passwordForm.newPassword);

                    alert('비밀번호가 변경되었습니다.');
                    setShowPasswordModal(false);
                    setPasswordForm({
                        currentPassword: '',
                        newPassword: '',
                        confirmPassword: ''
                    });
                } catch (error) {
                    console.error('비밀번호 변경 오류:', error);
                    if (error.code === 'auth/wrong-password') {
                        alert('현재 비밀번호가 올바르지 않습니다.');
                    } else if (error.code === 'auth/weak-password') {
                        alert('새 비밀번호가 너무 약합니다. 더 강력한 비밀번호를 사용해주세요.');
                    } else {
                        alert('비밀번호 변경에 실패했습니다: ' + error.message);
                    }
                } finally {
                    setIsChanging(false);
                }
            };

            // 인증 이메일 보내기
            const sendVerificationEmail = async () => {
                setIsSendingEmail(true);

                try {
                    // 이메일 언어를 한국어로 설정
                    firebase.auth().languageCode = 'ko';

                    const actionCodeSettings = {
                        url: window.location.origin + window.location.pathname + '?marketingPasswordChange=true',
                        handleCodeInApp: true
                    };

                    await firebase.auth().sendSignInLinkToEmail(user.email, actionCodeSettings);

                    // 이메일 저장 (링크 확인용)
                    localStorage.setItem('emailForSignIn', user.email);
                    localStorage.setItem('marketingPasswordPending', 'true');

                    setEmailSent(true);
                    alert(`인증 이메일이 ${user.email}로 전송되었습니다.\n이메일의 링크를 클릭하여 인증을 완료해주세요.`);
                } catch (error) {
                    console.error('인증 이메일 전송 오류:', error);
                    alert('인증 이메일 전송에 실패했습니다: ' + error.message);
                } finally {
                    setIsSendingEmail(false);
                }
            };

            // 계정 비밀번호로 재인증 (이메일 링크 인증 후)
            const handleReauthenticate = async (e) => {
                e.preventDefault();

                if (!reauthPassword) {
                    alert('비밀번호를 입력해주세요.');
                    return;
                }

                setIsReauthenticating(true);

                try {
                    // 현재 로그인된 사용자로 재인증 (reauthenticateWithCredential 사용)
                    const credential = firebase.auth.EmailAuthProvider.credential(user.email, reauthPassword);
                    await user.reauthenticateWithCredential(credential);

                    // 재인증 성공
                    localStorage.removeItem('emailForSignIn');
                    localStorage.removeItem('marketingPasswordPending');
                    localStorage.removeItem('needsReauth');

                    setIsEmailVerified(true);
                    setNeedsReauth(false);
                    setShowReauthModal(false);
                    setReauthPassword('');

                    alert('인증이 완료되었습니다!\n이제 마케팅 비용 비밀번호를 설정해주세요.');

                    // 인증 완료 후 마케팅 비밀번호 모달 자동 열기
                    setShowMarketingPasswordModal(true);
                } catch (error) {
                    console.error('재인증 오류:', error);
                    if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        alert('비밀번호가 올바르지 않습니다.');
                    } else {
                        alert('인증에 실패했습니다: ' + error.message);
                    }
                } finally {
                    setIsReauthenticating(false);
                }
            };

            // 재인증 취소
            const handleCancelReauth = () => {
                localStorage.removeItem('emailForSignIn');
                localStorage.removeItem('marketingPasswordPending');
                localStorage.removeItem('needsReauth');
                setNeedsReauth(false);
                setShowReauthModal(false);
                setReauthPassword('');
            };

            // 마케팅 비용 비밀번호 설정/변경 (이메일 인증 완료 후)
            const handleMarketingPasswordChange = async (e) => {
                e.preventDefault();

                if (!marketingPasswordForm.newMarketingPassword || !marketingPasswordForm.confirmMarketingPassword) {
                    alert('모든 항목을 입력해주세요.');
                    return;
                }

                if (marketingPasswordForm.newMarketingPassword.length < 4) {
                    alert('마케팅 비용 비밀번호는 4자 이상이어야 합니다.');
                    return;
                }

                if (marketingPasswordForm.newMarketingPassword !== marketingPasswordForm.confirmMarketingPassword) {
                    alert('새 비밀번호가 일치하지 않습니다.');
                    return;
                }

                setIsChangingMarketing(true);

                try {
                    const userDocRef = db.collection('users').doc(user.uid);

                    // 문서 존재 여부 확인
                    const doc = await userDocRef.get();

                    if (!doc.exists) {
                        // 문서가 없으면 생성
                        await userDocRef.set({
                            uid: user.uid,
                            email: user.email,
                            displayName: user.displayName || user.email.split('@')[0],
                            branchName: userInfo?.branchName || '',
                            team: userInfo?.team || '',
                            role: 'user',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
                            isActive: true,
                            marketingPassword: marketingPasswordForm.newMarketingPassword
                        });
                    } else {
                        // 문서가 있으면 업데이트
                        await userDocRef.update({
                            marketingPassword: marketingPasswordForm.newMarketingPassword
                        });
                    }

                    // 로컬 상태 업데이트
                    setUserInfo({
                        ...userInfo,
                        marketingPassword: marketingPasswordForm.newMarketingPassword
                    });

                    // 이메일 인증 상태 초기화
                    setIsEmailVerified(false);

                    alert('마케팅 비용 비밀번호가 설정되었습니다.');
                    setShowMarketingPasswordModal(false);
                    setMarketingPasswordForm({
                        newMarketingPassword: '',
                        confirmMarketingPassword: ''
                    });
                } catch (error) {
                    console.error('마케팅 비용 비밀번호 설정 오류:', error);
                    alert('비밀번호 설정에 실패했습니다: ' + error.message);
                } finally {
                    setIsChangingMarketing(false);
                }
            };

            // 마케팅 비밀번호 모달 열기
            const openMarketingPasswordModal = () => {
                if (isEmailVerified) {
                    setShowMarketingPasswordModal(true);
                } else {
                    setEmailSent(false);
                    setShowMarketingPasswordModal(true);
                }
            };

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">설정</h2>
                        <p className="page-subtitle">계정 설정을 관리합니다</p>
                    </div>

                    <div className="content-area">
                        <div className="settings-section">
                            <h3 className="section-title">계정 정보</h3>
                            <div className="settings-item">
                                <div className="settings-item-info">
                                    <h4>이메일</h4>
                                    <p>{user?.email}</p>
                                </div>
                            </div>
                            <div className="settings-item">
                                <div className="settings-item-info">
                                    <h4>이름</h4>
                                    <p>{userInfo?.displayName || '미설정'}</p>
                                </div>
                            </div>
                            <div className="settings-item">
                                <div className="settings-item-info">
                                    <h4>지점명</h4>
                                    <p>{userInfo?.branchName || '미설정'}</p>
                                </div>
                            </div>
                        </div>

                        <div className="settings-section">
                            <h3 className="section-title">보안</h3>
                            <div className="settings-item">
                                <div className="settings-item-info">
                                    <h4>계정 비밀번호 변경</h4>
                                    <p>로그인 비밀번호를 변경합니다</p>
                                </div>
                                <button
                                    className="btn"
                                    style={{padding: '8px 16px', fontSize: '12px'}}
                                    onClick={() => setShowPasswordModal(true)}
                                >
                                    변경
                                </button>
                            </div>
                            <div className="settings-item">
                                <div className="settings-item-info">
                                    <h4>마케팅 비용 비밀번호</h4>
                                    <p style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                        마케팅 비용 페이지 접근 비밀번호 [★원장님 전용]
                                        {userInfo?.marketingPassword ? (
                                            <span style={{
                                                background: '#e8f5e9',
                                                color: '#388e3c',
                                                padding: '2px 8px',
                                                borderRadius: '4px',
                                                fontSize: '11px',
                                                fontWeight: '600'
                                            }}>설정됨</span>
                                        ) : (
                                            <span style={{
                                                background: '#ffebee',
                                                color: '#c62828',
                                                padding: '2px 8px',
                                                borderRadius: '4px',
                                                fontSize: '11px',
                                                fontWeight: '600'
                                            }}>미설정</span>
                                        )}
                                    </p>
                                </div>
                                <button

                                    style={{padding: '8px 16px', fontSize: '12px'}}
                                    onClick={openMarketingPasswordModal}
                                >
                                    {userInfo?.marketingPassword ? '변경' : '설정'}
                                </button>
                            </div>

                    {/* 계정 비밀번호 변경 모달 */}

                                    <h3>계정 비밀번호 변경</h3>

                                            <label>현재 비밀번호</label>
                                            <input
                                                type="password"
                                                value={passwordForm.currentPassword}
                                                onChange={(e) => setPasswordForm({...passwordForm, currentPassword: e.target.value})}
                                                placeholder="현재 비밀번호를 입력하세요"
                                                required
                                                autoFocus
                                            />

                                            <label>새 비밀번호</label>
                                            <input
                                                type="password"
                                                value={passwordForm.newPassword}
                                                onChange={(e) => setPasswordForm({...passwordForm, newPassword: e.target.value})}
                                                placeholder="새 비밀번호 (6자 이상)"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>새 비밀번호 확인</label>
                                            <input
                                                type="password"
                                                value={passwordForm.confirmPassword}
                                                onChange={(e) => setPasswordForm({...passwordForm, confirmPassword: e.target.value})}
                                                placeholder="새 비밀번호를 다시 입력하세요"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button
                                            type="button"
                                            className="btn btn-secondary btn-sm"
                                            onClick={() => setShowPasswordModal(false)}
                                            disabled={isChanging}
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-sm"
                                            disabled={isChanging}
                                        >
                                            {isChanging ? '변경 중...' : '변경'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 계정 비밀번호 재인증 모달 (이메일 링크 인증 후) */}
                    {showReauthModal && (
                        <div className="modal-overlay" style={{zIndex: 1100}}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '400px'}}>
                                <div className="modal-header">
                                    <h3>🔐 계정 비밀번호 확인</h3>
                                </div>
                                <form onSubmit={handleReauthenticate}>
                                    <div className="modal-body">
                                        <div style={{
                                            background: '#e8f5e9',
                                            padding: '16px',
                                            borderRadius: '8px',
                                            marginBottom: '20px',
                                            textAlign: 'center'

                                            <p style={{fontSize: '14px', color: '#388e3c', fontWeight: '600'}}>

                                            </p>
                                        </div>

                                        <div style={{
                                            background: '#fff3e0',
                                            padding: '14px',
                                            borderRadius: '8px',

                                        }}>
                                            <p style={{fontSize: '13px', color: '#e65100', lineHeight: '1.5'}}>
                                                ⚠️ 보안을 위해 <strong>현재 계정 비밀번호</strong>를 한 번 더 입력해주세요.
                                            </p>
                                        </div>

                                        <div className="form-group">
                                            <label>계정 비밀번호</label>
                                            <input
                                                type="password"
                                                value={reauthPassword}
                                                onChange={(e) => setReauthPassword(e.target.value)}
                                                placeholder="현재 계정 비밀번호 입력"
                                                autoFocus

                                        </button>

                                            type="submit"
                                            className="btn btn-sm"
                                            disabled={isReauthenticating || !reauthPassword}
                                        >
                                            {isReauthenticating ? '확인 중...' : '확인'}

                                    </div>
                                </form>
                            </div>

                    {/* 마케팅 비용 비밀번호 설정 모달 */}

                                            marginBottom: '20px'
                                        }}>
                                            <div style={{fontSize: '12px', color: '#666', marginBottom: '4px'}}>인증 이메일 발송 주소</div>
                                            <div style={{fontSize: '15px', fontWeight: '600', color: '#333'}}>{user?.email}</div>
                                        </div>

                                        {emailSent && (
                                            <div style={{
                                                background: '#e8f5e9',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                marginBottom: '20px',
                                                fontSize: '13px',
                                                color: '#2e7d32'
                                            }}>
                                                ✅ 인증 이메일이 전송되었습니다. 이메일을 확인해주세요.
                                            </div>
                                        )}

                                        <div className="modal-footer" style={{borderTop: 'none', paddingTop: 0}}>
                                            <button
                                                type="button"
                                                className="btn btn-secondary btn-sm"
                                                onClick={() => setShowMarketingPasswordModal(false)}
                                            >
                                                취소
                                            </button>
                                            <button
                                                type="button"
                                                className="btn btn-sm"
                                                onClick={sendVerificationEmail}
                                                disabled={isSendingEmail}
                                            >
                                                {isSendingEmail ? '전송 중...' : (emailSent ? '다시 전송' : '인증 이메일 보내기')}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    /* 이메일 인증 완료 후 비밀번호 설정 */
                                    <form onSubmit={handleMarketingPasswordChange}>
                                        <div className="modal-body">
                                            <div style={{
                                                background: '#e8f5e9',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                marginBottom: '20px',
                                                fontSize: '13px',
                                                color: '#2e7d32'
                                            }}>
                                                ✅ 이메일 인증이 완료되었습니다. 새 비밀번호를 설정해주세요.
                                            </div>
                                            <div className="form-group">
                                                <label>새 마케팅 비용 비밀번호</label>
                                                <input
                                                    type="password"
                                                    value={marketingPasswordForm.newMarketingPassword}
                                                    onChange={(e) => setMarketingPasswordForm({...marketingPasswordForm, newMarketingPassword: e.target.value})}
                                                    placeholder="4자 이상"
                                                    required
                                                    autoFocus
                                                />
                                            </div>
                                            <div className="form-group">
                                                <label>새 마케팅 비용 비밀번호 확인</label>
                                                <input
                                                    type="password"
                                                    value={marketingPasswordForm.confirmMarketingPassword}
                                                    onChange={(e) => setMarketingPasswordForm({...marketingPasswordForm, confirmMarketingPassword: e.target.value})}
                                                    placeholder="비밀번호를 다시 입력하세요"
                                                    required
                                                />
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button
                                                type="button"
                                                className="btn btn-secondary btn-sm"
                                                onClick={() => {
                                                    setShowMarketingPasswordModal(false);
                                                    setIsEmailVerified(false);
                                                }}
                                                disabled={isChangingMarketing}
                                            >
                                                취소
                                            </button>
                                            <button
                                                type="submit"
                                                className="btn btn-sm"
                                                disabled={isChangingMarketing}
                                            >
                                                {isChangingMarketing ? '설정 중...' : '설정'}
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 지점 문의 창구 페이지
        function InquiryPage({ user, userInfo }) {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showWriteModal, setShowWriteModal] = useState(false);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [selectedInquiry, setSelectedInquiry] = useState(null);
            const [categoryRows, setCategoryRows] = useState([]);
            const [categoryTree, setCategoryTree] = useState([]);
            const [categoriesLoading, setCategoriesLoading] = useState(true);

            const normalizePhoneNumber = (value) => (value || '').replace(/\D/g, '');
            const isValidKoreanMobile = (value) => {
                const v = normalizePhoneNumber(value);
                // 숫자만 허용: 010xxxxxxxx(8자리) 또는 01[1/6/7/8/9]xxxxxxx(7자리)
                return /^01[016789]\d{7,8}$/.test(v);
            };

            const getMajorOptions = () => categoryTree.map(({ majorId, majorLabel }) => ({ majorId, majorLabel }));
            const getMinorOptions = (majorId) => {
                const major = categoryTree.find((m) => m.majorId === majorId);
                return major?.minors || [];
            };
            const getInquiryTypeLabels = (majorId, minorId) => {
                if (majorId === USER_MANUAL_TEAM_MAJOR_ID) {
                    const team = USER_ABP_TEAM_BY_ID[minorId];
                    return {
                        majorLabel: '담당부서 지정',
                        minorLabel: team?.name || minorId || ''
                    };
                }
                const m = majorId === 'unset' && !minorId ? 'general' : minorId;
                const major = categoryTree.find((x) => x.majorId === majorId);
                const majorLabel = major?.majorLabel || '';
                const minor = major?.minors?.find((mi) => mi.minorId === m);
                const minorLabel = minor?.minorLabel || '';
                return { majorLabel, minorLabel };
            };

            const sanitizeFileName = (name) =>
                (name || 'file')
                    .replace(/[^\w.\-]+/g, '_')
                    .replace(/_+/g, '_')
                    .replace(/^_+|_+$/g, '');

            const uploadInquiryAttachments = async ({ files, userId, inquiryId }) => {
                if (!files || !files.length) return [];
                const uploads = files.map(async (file, idx) => {
                    const timestamp = Date.now();
                    const safeName = sanitizeFileName(file.name);
                    const filePath = `inquiries/${userId}/${inquiryId}/${timestamp}_${idx + 1}_${safeName}`;
                    const ref = storage.ref(filePath);
                    const uploadTask = await ref.put(file);
                    const url = await uploadTask.ref.getDownloadURL();
                    return {
                        name: file.name,
                        path: filePath,
                        url,
                        contentType: file.type || '',
                        size: file.size || 0,
                        uploadedAtMs: Date.now()
                    };
                });
                return await Promise.all(uploads);
            };
            const [formData, setFormData] = useState({
                inquirerName: '',
                notifyContact: '',
                inquiryMajor: '',
                inquiryMinor: '',
                title: '',
                content: '',
                position: ''
            });
            const [attachedFiles, setAttachedFiles] = useState([]); // File[]
            const [editAttachedFiles, setEditAttachedFiles] = useState([]); // File[]
            const [editFormData, setEditFormData] = useState({
                inquirerName: '',
                notifyContact: '',
                inquiryMajor: '',
                inquiryMinor: '',
                title: '',
                content: '',
                position: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            // 직책 옵션
            const positionOptions = ['원장', '부원장', '실장', '강사'];

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        const list = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
                        setCategoryRows(list);
                        setCategoryTree(
                            mergeManualTeamMajorIntoCategoryTree(buildInquiryCategoryTreeFromRows(list))
                        );
                        setCategoriesLoading(false);
                    },
                    (err) => {
                        console.error('문의 유형 정의 로드 오류:', err);
                        setCategoriesLoading(false);
                    }
                );
                return () => unsub();
            }, []);

            // 내 지점 문의글 로드
            useEffect(() => {
                if (!user || !userInfo?.branchName) {
                    setLoading(false);
                    return;
                }

                const unsubscribe = db.collection('inquiries')
                    .where('branchName', '==', userInfo.branchName)
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);
                        setLoading(false);
                    }, (error) => {
                        console.error('문의글 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, [user, userInfo?.branchName]);

            // 날짜 포맷
            const formatDate = (timestamp) => {
                if (!timestamp) return '-';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            // 글 작성
            const handleSubmit = async (e) => {
                e.preventDefault();

                if (attachedFiles.length > 5) {
                    alert('첨부파일은 최대 5개까지 가능합니다.');
                    return;
                }
                if (!formData.inquirerName.trim()) {
                    alert('이름을 입력해주세요.');
                    return;
                }
                if (!formData.notifyContact.trim()) {
                    alert('알림 수신 연락처(휴대폰)를 입력해주세요.');
                    return;
                }
                if (!isValidKoreanMobile(formData.notifyContact)) {
                    alert('휴대폰 번호 형식이 올바르지 않습니다. 예) 01012345678');
                    return;
                }
                if (!formData.inquiryMajor) {
                    alert('문의 유형(대분류)을 선택해주세요.');
                    return;
                }
                // '미정'은 중분류 없이도 제출 가능 / '담당 부서 직접 지정'은 부서(중분류) 필수
                if (formData.inquiryMajor !== 'unset' && !formData.inquiryMinor) {
                    alert(formData.inquiryMajor === USER_MANUAL_TEAM_MAJOR_ID
                        ? '담당 부서를 선택해주세요.'
                        : '문의 유형(중분류)을 선택해주세요.');
                    return;
                }
                if (!formData.position) {
                    alert('작성자(직책)를 선택해주세요.');
                    return;
                }
                if (!formData.title.trim() || !formData.content.trim()) {
                    alert('제목과 내용을 입력해주세요.');
                    return;
                }
                if (categoriesLoading) {
                    alert('문의 유형을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
                    return;
                }
                if (categoryTree.length === 0) {
                    alert('등록된 문의 유형이 없습니다. 기획본부에 유형 등록을 요청해주세요.');
                    return;
                }

                setIsSubmitting(true);

                try {
                    const minorKey =
                        formData.inquiryMajor === 'unset'
                            ? formData.inquiryMinor || 'general'
                            : formData.inquiryMinor;
                    const inquiryTypeLabels = getInquiryTypeLabels(formData.inquiryMajor, minorKey);
                    const abpTargetTeam = resolveAbpTargetTeamFromCategoryRows(
                        formData.inquiryMajor,
                        minorKey,
                        categoryRows
                    );
                    if (!abpTargetTeam) {
                        alert('문의 유형에 맞는 기획본부 팀을 찾을 수 없습니다. 관리자에게 문의하세요.');
                        setIsSubmitting(false);
                        return;
                    }

                    const inquiriesRef = db.collection('inquiries').doc();
                    const abpRef = db.collection('abpInquiries').doc();
                    const inquiryId = inquiriesRef.id;
                    const attachments = await uploadInquiryAttachments({
                        files: attachedFiles,
                        userId: user.uid,
                        inquiryId
                    });

                    const inquiryPayload = {
                        userId: user.uid,
                        userEmail: user.email,
                        userName: userInfo?.displayName || '',
                        inquirerName: formData.inquirerName.trim(),
                        notifyContact: normalizePhoneNumber(formData.notifyContact),
                        inquiryMajor: formData.inquiryMajor,
                        inquiryMinor: formData.inquiryMajor === 'unset' ? '' : formData.inquiryMinor,
                        inquiryMajorLabel: inquiryTypeLabels.majorLabel,
                        inquiryMinorLabel: inquiryTypeLabels.minorLabel,
                        attachments,
                        position: formData.position,
                        branchName: userInfo?.branchName || '',
                        team: userInfo?.team || '',
                        title: formData.title.trim(),
                        content: formData.content.trim(),
                        status: 'pending',
                        reply: '',
                        repliedAt: null,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        abpTargetTeam,
                        abpInquiryId: abpRef.id,
                        abpRoutedBy:
                            formData.inquiryMajor === USER_MANUAL_TEAM_MAJOR_ID ? 'manual_team' : 'firestore'
                    };

                    const abpPayload = {
                        originalInquiryId: inquiryId,
                        originalInquiry: {
                            title: formData.title.trim(),
                            content: formData.content.trim()
                        },
                        branchName: userInfo?.branchName || '',
                        team: userInfo?.team || '',
                        position: formData.position,
                        targetTeam: abpTargetTeam,
                        content: formData.content.trim(),
                        authorName: formData.inquirerName.trim(),
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        abpRoutedBy:
                            formData.inquiryMajor === USER_MANUAL_TEAM_MAJOR_ID ? 'manual_team' : 'firestore',
                        inquiryMajor: formData.inquiryMajor,
                        inquiryMinor: formData.inquiryMajor === 'unset' ? '' : formData.inquiryMinor,
                        inquiryMajorLabel: inquiryTypeLabels.majorLabel,
                        inquiryMinorLabel: inquiryTypeLabels.minorLabel
                    };

                    const batch = db.batch();
                    batch.set(inquiriesRef, inquiryPayload);
                    batch.set(abpRef, abpPayload);
                    await batch.commit();

                    alert('문의가 등록되었습니다.');
                    setFormData({
                        inquirerName: '',
                        notifyContact: '',
                        inquiryMajor: '',
                        inquiryMinor: '',
                        title: '',
                        content: '',
                        position: ''
                    });
                    setAttachedFiles([]);
                    setShowWriteModal(false);
                } catch (error) {
                    console.error('문의 등록 오류:', error);
                    alert('문의 등록에 실패했습니다.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            // 상세보기
            const openDetail = (inquiry) => {
                setSelectedInquiry(inquiry);
                setShowDetailModal(true);
            };

            // 수정 모달 열기
            const openEditModal = (e) => {
                e.stopPropagation();
                setEditAttachedFiles([]);
                setEditFormData({
                    inquirerName: selectedInquiry.inquirerName || selectedInquiry.userName || '',
                    notifyContact: selectedInquiry.notifyContact || '',
                    inquiryMajor: selectedInquiry.inquiryMajor || '',
                    inquiryMinor: selectedInquiry.inquiryMinor || '',
                    title: selectedInquiry.title,
                    content: selectedInquiry.content,
                    position: selectedInquiry.position || ''
                });
                setShowDetailModal(false);
                setShowEditModal(true);
            };

            // 수정 저장
            const handleEdit = async (e) => {
                e.preventDefault();

                if (!editFormData.inquirerName.trim()) {
                    alert('이름을 입력해주세요.');
                    return;
                }
                if (!editFormData.notifyContact.trim()) {
                    alert('알림 수신 연락처(휴대폰)를 입력해주세요.');
                    return;
                }
                if (!isValidKoreanMobile(editFormData.notifyContact)) {
                    alert('휴대폰 번호 형식이 올바르지 않습니다. 예) 01012345678');
                    return;
                }
                if (!editFormData.inquiryMajor) {
                    alert('문의 유형(대분류)을 선택해주세요.');
                    return;
                }
                // '미정'은 중분류 없이도 제출 가능 / '담당 부서 직접 지정'은 부서(중분류) 필수
                if (editFormData.inquiryMajor !== 'unset' && !editFormData.inquiryMinor) {
                    alert(editFormData.inquiryMajor === USER_MANUAL_TEAM_MAJOR_ID
                        ? '담당 부서를 선택해주세요.'
                        : '문의 유형(중분류)을 선택해주세요.');
                    return;
                }
                if (!editFormData.position) {
                    alert('작성자(직책)를 선택해주세요.');
                    return;
                }
                if (!editFormData.title.trim() || !editFormData.content.trim()) {
                    alert('제목과 내용을 입력해주세요.');
                    return;
                }
                if (categoriesLoading || categoryTree.length === 0) {
                    alert('문의 유형 정보를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.');
                    return;
                }

                setIsSubmitting(true);

                try {
                    const editMinorKey =
                        editFormData.inquiryMajor === 'unset'
                            ? editFormData.inquiryMinor || 'general'
                            : editFormData.inquiryMinor;
                    const inquiryTypeLabels = getInquiryTypeLabels(editFormData.inquiryMajor, editMinorKey);
                    const nextAbpTargetTeam = resolveAbpTargetTeamFromCategoryRows(
                        editFormData.inquiryMajor,
                        editMinorKey,
                        categoryRows
                    );
                    if (!nextAbpTargetTeam) {
                        alert('문의 유형에 맞는 기획본부 팀을 찾을 수 없습니다. 관리자에게 문의하세요.');
                        setIsSubmitting(false);
                        return;
                    }

                    const existingAttachments = Array.isArray(selectedInquiry.attachments) ? selectedInquiry.attachments : [];
                    const totalAfter = existingAttachments.length + editAttachedFiles.length;
                    if (totalAfter > 5) {
                        alert('첨부파일은 최대 5개까지 가능합니다.');
                        setIsSubmitting(false);
                        return;
                    }

                    const newAttachments = await uploadInquiryAttachments({
                        files: editAttachedFiles,
                        userId: user.uid,
                        inquiryId: selectedInquiry.id
                    });
                    await db.collection('inquiries').doc(selectedInquiry.id).update({
                        inquirerName: editFormData.inquirerName.trim(),
                        notifyContact: normalizePhoneNumber(editFormData.notifyContact),
                        inquiryMajor: editFormData.inquiryMajor,
                        inquiryMinor: editFormData.inquiryMajor === 'unset' ? '' : editFormData.inquiryMinor,
                        inquiryMajorLabel: inquiryTypeLabels.majorLabel,
                        inquiryMinorLabel: inquiryTypeLabels.minorLabel,
                        attachments: [...existingAttachments, ...newAttachments],
                        title: editFormData.title.trim(),
                        content: editFormData.content.trim(),
                        position: editFormData.position,
                        abpTargetTeam: nextAbpTargetTeam,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    if (selectedInquiry.abpInquiryId) {
                        try {
                            await db.collection('abpInquiries').doc(selectedInquiry.abpInquiryId).update({
                                targetTeam: nextAbpTargetTeam,
                                content: editFormData.content.trim(),
                                originalInquiry: {
                                    title: editFormData.title.trim(),
                                    content: editFormData.content.trim()
                                },
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                                inquiryMajor: editFormData.inquiryMajor,
                                inquiryMinor: editFormData.inquiryMajor === 'unset' ? '' : editFormData.inquiryMinor,
                                inquiryMajorLabel: inquiryTypeLabels.majorLabel,
                                inquiryMinorLabel: inquiryTypeLabels.minorLabel,
                                abpRoutedBy:
                                    editFormData.inquiryMajor === USER_MANUAL_TEAM_MAJOR_ID ? 'manual_team' : 'firestore'
                            });
                        } catch (abpErr) {
                            // 권한(규칙) 또는 문서 상태 문제로 ABP 연동 업데이트가 실패해도,
                            // 지점 문의(inquiries) 수정은 성공 처리한다.
                            console.warn('abpInquiries 연동 업데이트 실패(무시):', abpErr);
                        }
                    }

                    alert('문의가 수정되었습니다.');
                    setShowEditModal(false);
                    setEditAttachedFiles([]);
                    setSelectedInquiry(null);
                } catch (error) {
                    console.error('문의 수정 오류:', error);
                    alert('문의 수정에 실패했습니다.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            // 삭제 모달 열기
            const handleDeleteClick = async (e) => {
                e.stopPropagation();
                if (!selectedInquiry?.id) return;

                const ok = window.confirm('삭제 된 문의는 원복 할 수 없습니다. 삭제 하시겠습니까?');
                if (!ok) return;

                try {
                    // 첨부파일(Storage) 먼저 삭제 (best-effort)
                    const attachments = Array.isArray(selectedInquiry.attachments) ? selectedInquiry.attachments : [];
                    if (attachments.length > 0) {
                        const deletes = attachments
                            .map(att => att?.path)
                            .filter(Boolean)
                            .map(async (path) => {
                                try {
                                    await storage.ref(path).delete();
                                } catch (err) {
                                    // 파일이 이미 없거나 권한/네트워크 문제 등: 문서 삭제는 계속 진행
                                    console.warn('첨부파일 삭제 실패:', path, err);
                                }
                            });
                        await Promise.all(deletes);
                    }

                    if (selectedInquiry.abpInquiryId) {
                        try {
                            await db.collection('abpInquiries').doc(selectedInquiry.abpInquiryId).delete();
                        } catch (abpErr) {
                            console.warn('연동 기획본부 문의 삭제 실패:', abpErr);
                        }
                    }
                    await db.collection('inquiries').doc(selectedInquiry.id).delete();
                    alert('문의가 삭제되었습니다.');
                    setShowDetailModal(false);
                    setSelectedInquiry(null);
                } catch (error) {
                    console.error('삭제 오류:', error);
                    alert('삭제에 실패했습니다: ' + error.message);
                }
            };

            // 상태 배지
            const getStatusBadge = (status) => {
                const styles = {
                    pending: { bg: '#fff3e0', color: '#f57c00', text: '대기중' },
                    answered: { bg: '#e8f5e9', color: '#388e3c', text: '답변완료' }
                };
                const style = styles[status] || styles.pending;
                return (
                    <span style={{

                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    style={{color: '#2563eb', textDecoration: 'underline'}}
                                                                >
                                                                    {att.name || `첨부파일 ${idx + 1}`}
                                                                </a>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                            <input
                                                type="file"
                                                accept="image/jpeg,image/png"
                                                multiple
                                                onChange={(e) => {
                                                    const existingCount = Array.isArray(selectedInquiry.attachments) ? selectedInquiry.attachments.length : 0;
                                                    const files = Array.from(e.target.files || []);
                                                    if (existingCount + files.length > 5) {
                                                        alert('첨부파일은 최대 5개까지 가능합니다.');
                                                        e.target.value = '';
                                                        setEditAttachedFiles([]);
                                                        return;
                                                    }
                                                    setEditAttachedFiles(files);
                                                }}
                                            />
                                            {editAttachedFiles.length > 0 && (
                                                <div style={{marginTop: '10px', fontSize: '13px', color: '#475569'}}>
                                                    <div style={{fontWeight: '600', marginBottom: '6px'}}>추가 선택된 파일</div>
                                                    <ul style={{margin: 0, paddingLeft: '18px'}}>
                                                        {editAttachedFiles.map((f, i) => (
                                                            <li key={`${f.name}_${i}`} style={{marginBottom: '4px'}}>
                                                                {f.name} ({Math.round((f.size || 0) / 1024)}KB)
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button
                                            type="button"
                                            className="btn btn-secondary btn-sm"
                                            onClick={() => setShowEditModal(false)}
                                            disabled={isSubmitting}
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-sm"
                                            disabled={isSubmitting}
                                        >
                                            {isSubmitting ? '수정 중...' : '수정'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // 사이드바 컴포넌트
        function Sidebar({ currentPage, setCurrentPage, user, userInfo, onLogout, onCostAccess, onToolkitAccess }) {
            const [visibleMenus, setVisibleMenus] = useState([]);
            const allMenuItems = [
                { id: 'dashboard', name: '대시보드', icon: Icons.Dashboard },
                { id: 'inquiry', name: '지점 문의 창구', icon: Icons.Inquiry },
                { id: 'cost', name: '마케팅 비용', icon: Icons.Cost, requiresPassword: true },
                { id: 'toolkit', name: '마케팅 툴킷 신청', icon: Icons.Toolkit, requiresPassword: true },
                { id: 'settings', name: '설정', icon: Icons.Settings }
            ];

            useEffect(() => {
                // Firestore에서 사이드바 설정 로드
                const loadMenuConfig = async () => {
                    try {
                        const doc = await db.collection('sidebarConfig').doc('user').get();
                        if (doc.exists) {
                            const config = doc.data().menus;
                            const filtered = allMenuItems.filter(item => {
                                const configItem = config.find(c => c.id === item.id);
                                return configItem ? configItem.visible !== false : true;
                            });
                            setVisibleMenus(filtered);
                        } else {
                            setVisibleMenus(allMenuItems);
                        }
                    } catch (error) {
                        console.error('사이드바 설정 로드 오류:', error);
                        setVisibleMenus(allMenuItems);
                    }
                };
                loadMenuConfig();
            }, []);

            const menuItems = visibleMenus;

            const handleMenuClick = (item) => {
                if (item.requiresPassword) {
                    if (item.id === 'cost') {
                        onCostAccess();
                    } else if (item.id === 'toolkit') {
                        onToolkitAccess();
                    }
                } else {
                    setCurrentPage(item.id);
                }
            };

            return (
                <aside className="sidebar">
                    <div className="sidebar-header">
                        {userInfo?.branchName && (
                            <div className="branch-badge">
                                {userInfo.branchName}
                            </div>
                        )}
                        <h1>마케팅 비용 관리</h1>
                        <p>Marketing Cost Compilater</p>
                    </div>

                    <nav className="sidebar-nav">
                        {menuItems.map(item => (
                            <div
                                key={item.id}
                                className={`nav-item ${currentPage === item.id ? 'active' : ''}`}
                                onClick={() => handleMenuClick(item)}
                            >
                                <item.icon />
                                <span>{item.name}</span>
                                {item.requiresPassword && (
                                    <svg style={{width: '14px', height: '14px', marginLeft: 'auto', opacity: 0.7}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                    </svg>
                                )}
                            </div>
                        ))}
                    </nav>

                    <div className="sidebar-footer">
                        <div className="user-info-sidebar">
                            <div className="user-avatar">
                                {userInfo?.displayName?.charAt(0).toUpperCase() || user?.email?.charAt(0).toUpperCase()}
                            </div>
                            <div className="user-details">
                                <div className="name">{userInfo?.displayName || user?.email}</div>
                                <div className="role">사용자</div>
                            </div>
                        </div>
                        <button className="logout-btn" onClick={onLogout}>
                            로그아웃
                        </button>
                    </div>
                </aside>
            );
        }

        // 메인 앱 컴포넌트
        function App() {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [user, setUser] = useState(null);
            const [userInfo, setUserInfo] = useState(null);
            const [loading, setLoading] = useState(true);

            // 마케팅 비용 비밀번호 모달 상태
            const [showCostPasswordModal, setShowCostPasswordModal] = useState(false);
            const [costPasswordInput, setCostPasswordInput] = useState('');
            const [isVerifyingCostPassword, setIsVerifyingCostPassword] = useState(false);

            // 마케팅 툴킷 신청 비밀번호 모달 상태
            const [showToolkitPasswordModal, setShowToolkitPasswordModal] = useState(false);
            const [toolkitPasswordInput, setToolkitPasswordInput] = useState('');
            const [isVerifyingToolkitPassword, setIsVerifyingToolkitPassword] = useState(false);

            // 이메일 인증 상태 (마케팅 비용 비밀번호 변경용)
            const [isEmailVerified, setIsEmailVerified] = useState(false);
            // 재인증 필요 상태 (이메일 링크 인증 후 계정 비밀번호 확인용)
            const [needsReauth, setNeedsReauth] = useState(false);

            // Firestore에서 사용자 정보 가져오기
            const fetchUserInfo = async (uid) => {
                try {
                    const docRef = db.collection('users').doc(uid);
                    const doc = await docRef.get();

                    if (doc.exists) {
                        setUserInfo(doc.data());
                    } else {
                        // 🚨 문서가 없으면 무단 계정 차단
                        console.error('🚨 Firestore에 등록되지 않은 계정입니다!');
                        alert('⚠️ 관리자가 승인하지 않은 계정입니다.\n\n계정 생성은 관리자에게 문의하세요.\n담당자: 학원사업마케팅팀 / 박영주');
                        await auth.signOut();
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    console.error('사용자 정보 가져오기 오류:', error);
                    alert('사용자 정보를 불러오는데 실패했습니다.\n관리자에게 문의하세요.');
                    await auth.signOut();
                    window.location.href = 'index.html';
                }
            };

            // 이메일 링크 인증 확인 (signInWithEmailLink 호출하지 않음 - 현재 세션 유지)
            useEffect(() => {
                // URL에 marketingPasswordChange 파라미터가 있고, 이메일 링크인 경우
                const urlParams = new URLSearchParams(window.location.search);
                const isMarketingPasswordChange = urlParams.get('marketingPasswordChange') === 'true';
                const isPending = localStorage.getItem('marketingPasswordPending');

                if (isMarketingPasswordChange && isPending && firebase.auth().isSignInWithEmailLink(window.location.href)) {
                    // URL에서 인증 파라미터 제거
                    window.history.replaceState({}, document.title, window.location.pathname);

                    // 이메일 링크 인증 완료 - 계정 비밀번호로 재인증 필요
                    // signInWithEmailLink를 호출하지 않으므로 현재 세션이 유지됨
                    localStorage.setItem('needsReauth', 'true');

                    setCurrentPage('settings');
                    setNeedsReauth(true);
                }
            }, []);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (!currentUser) {
                        window.location.href = 'index.html';
                    } else if (currentUser.email === ADMIN_EMAIL) {
                        window.location.href = 'admin.html';
                    } else if (currentUser.email === ABP_EMAIL) {
                        window.location.href = 'abp.html';
                    } else {

                        setUser(currentUser);
                        fetchUserInfo(currentUser.uid);
                        setLoading(false);

                        // localStorage에서 재인증 필요 상태 복원
                        if (localStorage.getItem('needsReauth') === 'true') {
                            setNeedsReauth(true);
                            setCurrentPage('settings');
                        }
                        // window.location.href = 'user.html';
                    }
                });

                // ===== 보안: 이메일 변조 실시간 감시 시작 =====
                const emailMonitorInterval = startEmailMonitoring();

                return () => {
                    unsubscribe();
                    // 감시 중지
                    if (emailMonitorInterval) {
                        clearInterval(emailMonitorInterval);
                    }
                };
            }, []);

            const handleLogout = async () => {
                if (confirm('로그아웃 하시겠습니까?')) {
                    const result = await logout();
                    if (result.success) {
                        window.location.href = 'index.html';
                    } else {
                        alert('로그아웃 실패: ' + result.message);
                    }
                }
            };

            // 마케팅 비용 접근 핸들러
            const handleCostAccess = () => {
                // 비밀번호가 설정되어 있지 않으면 바로 접근
                if (!userInfo?.marketingPassword) {
                    alert('마케팅 비용 비밀번호가 설정되어 있지 않습니다.\n설정 페이지에서 비밀번호를 먼저 설정해주세요.');
                    setCurrentPage('settings');
                    return;
                }
                setCostPasswordInput('');
                setShowCostPasswordModal(true);
            };

            // 마케팅 비용 비밀번호 확인
            const verifyCostPassword = async (e) => {
                e.preventDefault();

                if (!costPasswordInput) {
                    alert('비밀번호를 입력해주세요.');
                    return;
                }

                setIsVerifyingCostPassword(true);

                try {
                    if (costPasswordInput === userInfo.marketingPassword) {
                        setShowCostPasswordModal(false);
                        setCostPasswordInput('');
                        setCurrentPage('cost');
                    } else {
                        alert('비밀번호가 올바르지 않습니다.');
                    }
                } catch (error) {
                    console.error('비밀번호 확인 오류:', error);
                    alert('비밀번호 확인에 실패했습니다.');
                } finally {
                    setIsVerifyingCostPassword(false);
                }
            };

            // 마케팅 툴킷 신청 접근 핸들러
            const handleToolkitAccess = () => {
                // 비밀번호가 설정되어 있지 않으면 바로 접근
                if (!userInfo?.marketingPassword) {
                    alert('마케팅 비용 비밀번호가 설정되어 있지 않습니다.\n설정 페이지에서 비밀번호를 먼저 설정해주세요.');
                    setCurrentPage('settings');
                    return;
                }
                setToolkitPasswordInput('');
                setShowToolkitPasswordModal(true);
            };

            // 마케팅 툴킷 신청 비밀번호 확인
            const verifyToolkitPassword = async (e) => {
                e.preventDefault();

                if (!toolkitPasswordInput) {
                    alert('비밀번호를 입력해주세요.');
                    return;
                }

                setIsVerifyingToolkitPassword(true);

                try {
                    if (toolkitPasswordInput === userInfo.marketingPassword) {
                        setShowToolkitPasswordModal(false);
                        setToolkitPasswordInput('');
                        setCurrentPage('toolkit');
                    } else {
                        alert('비밀번호가 올바르지 않습니다.');
                    }
                } catch (error) {
                    console.error('비밀번호 확인 오류:', error);
                    alert('비밀번호 확인에 실패했습니다.');
                } finally {
                    setIsVerifyingToolkitPassword(false);
                }
            };

            if (loading) {
                return <div className="loading">로딩 중...</div>;
            }

            const renderPage = () => {
                switch (currentPage) {
                    case 'dashboard':
                        return <DashboardPage userInfo={userInfo} />;
                    case 'cost':
                        return <MarketingCostPage user={user} userInfo={userInfo} />;
                    case 'inquiry':
                        return <InquiryPage user={user} userInfo={userInfo} />;
                    case 'toolkit':
                        return <ToolkitOrderPage user={user} userInfo={userInfo} />;
                    case 'settings':
                        return <SettingsPage user={user} userInfo={userInfo} setUserInfo={setUserInfo} isEmailVerified={isEmailVerified} setIsEmailVerified={setIsEmailVerified} needsReauth={needsReauth} setNeedsReauth={setNeedsReauth} />;
                    default:
                        return <DashboardPage userInfo={userInfo} />;
                }
            };

            return (
                <div className="app-container">
                    <Sidebar
                        currentPage={currentPage}
                        setCurrentPage={setCurrentPage}
                        user={user}
                        userInfo={userInfo}
                        onLogout={handleLogout}
                        onCostAccess={handleCostAccess}
                        onToolkitAccess={handleToolkitAccess}
                    />
                    <main className="main-content">
                        {renderPage()}
                    </main>

                    {/* 마케팅 비용 비밀번호 모달 */}
                    {showCostPasswordModal && (
                        <div className="modal-overlay" onClick={() => setShowCostPasswordModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '400px'}}>
                                <div className="modal-header">
                                    <h3>🔒 마케팅 비용 접근</h3>
                                    <button className="modal-close" onClick={() => setShowCostPasswordModal(false)}>×</button>
                                </div>
                                <form onSubmit={verifyCostPassword}>
                                    <div className="modal-body">
                                        <p style={{marginBottom: '20px', color: '#666', fontSize: '14px'}}>
                                            마케팅 비용 페이지에 접근하려면 비밀번호를 입력하세요.
                                        </p>
                                        <div className="form-group">
                                            <label>비밀번호</label>
                                            <input
                                                type="password"
                                                value={costPasswordInput}
                                                onChange={(e) => setCostPasswordInput(e.target.value)}
                                                placeholder="마케팅 비용 비밀번호"
                                                required
                                                autoFocus
                                            />
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button
                                            type="button"
                                            className="btn btn-secondary btn-sm"
                                            onClick={() => setShowCostPasswordModal(false)}
                                            disabled={isVerifyingCostPassword}
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-sm"
                                            disabled={isVerifyingCostPassword}
                                        >
                                            {isVerifyingCostPassword ? '확인 중...' : '확인'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 마케팅 툴킷 신청 비밀번호 모달 */}
                    {showToolkitPasswordModal && (
                        <div className="modal-overlay" onClick={() => setShowToolkitPasswordModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '400px'}}>
                                <div className="modal-header">
                                    <h3>🔒 마케팅 툴킷 신청 접근</h3>
                                    <button className="modal-close" onClick={() => setShowToolkitPasswordModal(false)}>×</button>
                                </div>
                                <form onSubmit={verifyToolkitPassword}>
                                    <div className="modal-body">
                                        <p style={{marginBottom: '20px', color: '#666', fontSize: '14px'}}>
                                            마케팅 툴킷 신청 페이지에 접근하려면 비밀번호를 입력하세요.
                                        </p>
                                        <div className="form-group">
                                            <label>비밀번호</label>
                                            <input
                                                type="password"
                                                value={toolkitPasswordInput}
                                                onChange={(e) => setToolkitPasswordInput(e.target.value)}
                                                placeholder="마케팅 비용 비밀번호"
                                                required
                                                autoFocus
                                            />
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button
                                            type="button"
                                            className="btn btn-secondary btn-sm"
                                            onClick={() => setShowToolkitPasswordModal(false)}
                                            disabled={isVerifyingToolkitPassword}
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-sm"
                                            disabled={isVerifyingToolkitPassword}
                                        >
                                            {isVerifyingToolkitPassword ? '확인 중...' : '확인'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // React 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
