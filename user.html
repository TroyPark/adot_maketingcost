    <!-- Firebase 설정 -->

    <script type="text/babel">
        const { useState, useEffect } = React;
        const INQUIRY_CATEGORY_DEFS_COLLECTION = 'inquiryCategoryDefinitions';

        /**
         * Firestore에 행을 만들지 않아도 되는 시스템 대분류.
         * 선택 시 중분류 값 = 기획본부 팀 id → 해당 팀함으로 직접 라우팅.
         */
        const USER_MANUAL_TEAM_MAJOR_ID = 'manual_team';
        const USER_ABP_TEAM_DEFS = [
            { id: 'biz_plan', name: '사업기획팀' },
            { id: 'sales_ops', name: '영업지원팀' },
            { id: 'hrd_academy', name: '학원HRD팀' },
            { id: 'eng_lab', name: '영어연구소' },
            { id: 'content_prod', name: '콘텐츠제작팀' },
            { id: 'it_dev', name: 'IT본부' },
            { id: 'corp_admin', name: '경영지원팀' },
            { id: 'biz_mk1', name: '사업마케팅1팀' },
            { id: 'biz_mk2', name: '사업마케팅2팀' }
        ];
        const USER_ABP_TEAM_BY_ID = Object.fromEntries(USER_ABP_TEAM_DEFS.map((t) => [t.id, t]));

        /** Firestore에 manual_team 행이 있으면 그걸 쓰고, 없으면 코드 목록으로 대분류만 주입 */
        function mergeManualTeamMajorIntoCategoryTree(baseTree) {
            const rest = (baseTree || []).filter((m) => m.majorId !== USER_MANUAL_TEAM_MAJOR_ID);
            const fromFirestore = (baseTree || []).find((m) => m.majorId === USER_MANUAL_TEAM_MAJOR_ID);
            if (fromFirestore && Array.isArray(fromFirestore.minors) && fromFirestore.minors.length > 0) {
                return [...rest, fromFirestore];
            }
            return [
                ...rest,
                {
                    majorId: USER_MANUAL_TEAM_MAJOR_ID,
                    majorLabel: '담당부서 지정',
                    minors: USER_ABP_TEAM_DEFS.map((t) => ({ minorId: t.id, minorLabel: t.name }))
                }
            ];
        }

        function buildInquiryCategoryTreeFromRows(rows) {
            const active = (rows || []).filter((r) => r.active !== false);
            const byMajor = new Map();
            active.forEach((r) => {
                if (!r.majorId || !r.minorId) return;
                if (!byMajor.has(r.majorId)) {
                    byMajor.set(r.majorId, {
                        majorId: r.majorId,
                        majorLabel: r.majorLabel || r.majorId,
                        minors: []
                    });
                }
                byMajor.get(r.majorId).minors.push({ minorId: r.minorId, minorLabel: r.minorLabel });
            });
            const majors = Array.from(byMajor.values());
            majors.forEach((m) =>
                m.minors.sort((a, b) => (a.minorLabel || '').localeCompare(b.minorLabel || '', 'ko'))
            );
            majors.sort((a, b) => (a.majorLabel || '').localeCompare(b.majorLabel || '', 'ko'));
            return majors;
        }

        function resolveAbpTargetTeamFromCategoryRows(majorId, minorId, categoryRows) {
            if (majorId === USER_MANUAL_TEAM_MAJOR_ID) {
                const tid = minorId && String(minorId).trim();
                if (tid && USER_ABP_TEAM_BY_ID[tid]) return tid;
                return null;
            }
            let m = minorId;
            if (majorId === 'unset' && !m) m = 'general';
            const hit = (categoryRows || []).find(
                (r) => r.active !== false && r.majorId === majorId && r.minorId === m
            );
            return hit?.targetTeam || null;
        }
        const ADMIN_EMAIL = 'admin@dshare.co.kr';
        const ABP_EMAIL = 'abp@dshare.co.kr';

        // 아이콘 컴포넌트
        const Icons = {
            Dashboard: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
            ),
            Cost: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            ),
            Inquiry: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            ),
            Settings: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            ),
            Toolkit: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            )
        };

        // 카테고리 정보
        const categories = {
            online: { label: '온라인 광고', className: 'online' },
            offline: { label: '오프라인 광고', className: 'offline' },
            event: { label: '이벤트/프로모션', className: 'event' },
            material: { label: '홍보물 제작', className: 'material' },
            toolkit: { label: '툴킷', className: 'toolkit' },
            '툴킷': { label: '툴킷', className: 'toolkit' },
            other: { label: '기타', className: 'other' }
        };

        // 마케팅 툴킷 신청 페이지
        function ToolkitOrderPage({ user, userInfo }) {
            const [toolkits, setToolkits] = useState([]);
            const [myOrders, setMyOrders] = useState({});
            const [allOrders, setAllOrders] = useState([]);
            const [loading, setLoading] = useState(true);

            // 예산 관련 상태
            const [currentRound, setCurrentRound] = useState(null);
            const [branchBudget, setBranchBudget] = useState(0);
            const [costs, setCosts] = useState([]);

            useEffect(() => {
                loadData();
            }, [user]);

            // 툴킷 주문 실시간 감지 (다른 지점의 주문 변경 시 자동 업데이트)
            useEffect(() => {
                if (!user) return;

                const unsubscribe = db.collection('toolkitOrders')
                    .onSnapshot((snapshot) => {
                        // 주문이 추가/수정/삭제되면 데이터 다시 로드
                        if (!snapshot.metadata.hasPendingWrites) {
                            // 로컬 변경이 아닌 서버 업데이트만 처리
                            loadData();
                        }
                    }, (error) => {
                        console.error('툴킷 주문 실시간 감지 오류:', error);
                    });

                return () => unsubscribe();
            }, [user]);

            // 현재 Round와 배정 비용 로드
            useEffect(() => {
                if (!userInfo?.branchName) return;

                const today = new Date().toISOString().split('T')[0];

                const roundsUnsubscribe = db.collection('rounds')
                    .onSnapshot(async (snapshot) => {
                        const roundsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));

                        const activeRound = roundsData.find(round => {
                            return today >= round.startDate && today <= round.endDate;
                        });

                        if (activeRound) {
                            setCurrentRound(activeRound);

                            try {
                                const budgetDoc = await db.collection('roundBudgets').doc(activeRound.id).get();
                                if (budgetDoc.exists) {
                                    const budgets = budgetDoc.data().budgets || {};
                                    setBranchBudget(budgets[userInfo.branchName] || 0);
                                }
                            } catch (error) {
                                console.error('배정 비용 로드 오류:', error);
                            }
                        } else {
                            setCurrentRound(null);
                            setBranchBudget(0);
                        }
                    });

                return () => roundsUnsubscribe();
            }, [userInfo]);

            // 마케팅 비용 로드 (지점별)
            useEffect(() => {
                if (!user || !userInfo?.branchName) return;

                const unsubscribe = db.collection('costs')
                    .where('branchName', '==', userInfo.branchName)
                    .onSnapshot((snapshot) => {
                        const costsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setCosts(costsData);
                    }, (error) => {
                        console.error('비용 목록 로드 오류:', error);
                    });

                return () => unsubscribe();
            }, [user, userInfo?.branchName]);

            const loadData = async () => {
                setLoading(true);
                try {
                    // 같은 지점의 주문 먼저 가져오기 (같은 지점의 모든 주문 표시)
                    const branchOrdersSnapshot = await db.collection('toolkitOrders')
                        .where('branchName', '==', userInfo?.branchName)
                        .get();

                    const myOrdersMap = {};
                    const branchToolkitIds = new Set(); // 같은 지점이 신청한 툴킷 ID

                    branchOrdersSnapshot.forEach(doc => {
                        const data = doc.data();
                        branchToolkitIds.add(data.toolkitId);

                        // 같은 지점의 모든 주문을 myOrdersMap에 저장 (가장 최근 주문으로 덮어씀)
                        // 한 툴킷에 여러 명이 신청한 경우, 가장 최근 주문이 표시됨
                        if (!myOrdersMap[data.toolkitId] ||
                            (data.updatedAt && myOrdersMap[data.toolkitId].updatedAt &&
                             data.updatedAt.toMillis() > myOrdersMap[data.toolkitId].updatedAt.toMillis())) {
                            myOrdersMap[data.toolkitId] = { id: doc.id, ...data };
                        }
                    });
                    setMyOrders(myOrdersMap);

                    // 툴킷 목록 가져오기 (오래된 것부터 → 최신 툴킷이 오른쪽에 표시됨)
                    const toolkitsSnapshot = await db.collection('toolkits').orderBy('createdAt', 'asc').get();
                    const toolkitsData = [];
                    toolkitsSnapshot.forEach(doc => {
                        const data = doc.data();
                        // 취합 완료되지 않은 툴킷만 표시 (완료된 툴킷은 신청 여부와 관계없이 숨김)
                        if (!data.isCompleted) {
                            toolkitsData.push({ id: doc.id, ...data });
                        }
                    });
                    setToolkits(toolkitsData);

                    // 모든 주문 가져오기 (전체 수량 계산용)
                    const allOrdersSnapshot = await db.collection('toolkitOrders').get();
                    const allOrdersData = [];
                    allOrdersSnapshot.forEach(doc => {
                        allOrdersData.push({ id: doc.id, ...doc.data() });
                    });
                    setAllOrders(allOrdersData);

                    // 가격 변동 확인 및 비용 자동 업데이트
                    await updateCostsIfPriceChanged(toolkitsData, allOrdersData, myOrdersMap);
                } catch (error) {
                    console.error('데이터 로드 오류:', error);
                    alert('데이터를 불러오는데 실패했습니다.');
                } finally {
                    setLoading(false);
                }
            };

            // 가격 변동 시 비용 자동 업데이트
            const updateCostsIfPriceChanged = async (toolkitsData, allOrdersData, myOrdersMap) => {
                try {
                    const batch = db.batch();
                    let hasUpdates = false;

                    for (const [toolkitId, order] of Object.entries(myOrdersMap)) {
                        if (!order.costId) continue; // 연결된 비용이 없으면 스킵

                        // 현재 단가 계산
                        const toolkit = toolkitsData.find(t => t.id === toolkitId);
                        if (!toolkit) continue;

                        const totalQty = allOrdersData
                            .filter(o => o.toolkitId === toolkitId)
                            .reduce((sum, o) => sum + Number(o.quantity || 0), 0);

                        const currentPricePerUnit = getPricePerUnitHelper(toolkit, totalQty);
                        const currentTotalAmount = order.quantity * currentPricePerUnit;

                        // 저장된 단가와 다르면 업데이트
                        if (order.pricePerUnit !== currentPricePerUnit || order.totalAmount !== currentTotalAmount) {
                            // toolkitOrders 업데이트
                            const orderRef = db.collection('toolkitOrders').doc(order.id);
                            batch.update(orderRef, {
                                pricePerUnit: currentPricePerUnit,
                                totalAmount: currentTotalAmount,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            // costs 업데이트
                            const costRef = db.collection('costs').doc(order.costId);
                            batch.update(costRef, {
                                description: `${toolkit.name} (${order.quantity}개)`,
                                amount: currentTotalAmount,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            hasUpdates = true;
                        }
                    }

                    if (hasUpdates) {
                        await batch.commit();
                        console.log('가격 변동으로 인한 비용 자동 업데이트 완료');
                    }
                } catch (error) {
                    console.error('비용 자동 업데이트 오류:', error);
                }
            };

            // getPricePerUnit 헬퍼 함수 (allOrders를 매개변수로 받지 않음)
            const getPricePerUnitHelper = (toolkit, totalQty) => {
                if (!toolkit.priceRanges) return 0;

                const sortedRanges = [...toolkit.priceRanges].sort((a, b) => a.minQty - b.minQty);

                for (let i = sortedRanges.length - 1; i >= 0; i--) {
                    const range = sortedRanges[i];
                    if (totalQty >= range.minQty && (range.maxQty === null || totalQty <= range.maxQty)) {
                        return Number(range.pricePerUnit || 0);
                    }
                }

                return Number(sortedRanges[0]?.pricePerUnit || 0);
            };

            // 툴킷별 전체 주문 수량 계산 (현재 입력 중인 수량 포함)
            const getTotalOrderQty = (toolkitId) => {
                // 다른 사용자들의 주문 수량
                const othersTotal = allOrders
                    .filter(order => order.toolkitId === toolkitId && order.userId !== user.uid)
                    .reduce((sum, order) => sum + Number(order.quantity || 0), 0);

                // 현재 사용자의 입력 중인 수량 (myOrders에서)
                const myQty = Number(myOrders[toolkitId]?.quantity || 0);

                return othersTotal + myQty;
            };

            // 수량에 따른 단가 계산
            const getPricePerUnit = (toolkit, totalQty) => {
                if (!toolkit.priceRanges) return 0;

                const sortedRanges = [...toolkit.priceRanges].sort((a, b) => a.minQty - b.minQty);

                for (let i = sortedRanges.length - 1; i >= 0; i--) {
                    const range = sortedRanges[i];
                    if (totalQty >= range.minQty && (range.maxQty === null || totalQty <= range.maxQty)) {
                        return Number(range.pricePerUnit || 0);
                    }
                }

                return Number(sortedRanges[0]?.pricePerUnit || 0);
            };

            // 특정 툴킷의 모든 주문 및 비용 업데이트 (가격 구간 변경 시)
            const updateAllOrdersForToolkit = async (toolkitId) => {
                try {
                    console.log(`[updateAllOrdersForToolkit] 시작: 툴킷 ID = ${toolkitId}`);

                    // 1. 해당 툴킷 정보 가져오기
                    const toolkitDoc = await db.collection('toolkits').doc(toolkitId).get();
                    if (!toolkitDoc.exists) {
                        console.log(`[updateAllOrdersForToolkit] 툴킷을 찾을 수 없음`);
                        return;
                    }
                    const toolkit = { id: toolkitDoc.id, ...toolkitDoc.data() };
                    console.log(`[updateAllOrdersForToolkit] 툴킷 이름: ${toolkit.name}`);

                    // 2. 해당 툴킷의 모든 주문 가져오기
                    const ordersSnapshot = await db.collection('toolkitOrders')
                        .where('toolkitId', '==', toolkitId)
                        .get();

                    if (ordersSnapshot.empty) {
                        console.log(`[updateAllOrdersForToolkit] 주문이 없음`);
                        return;
                    }
                    console.log(`[updateAllOrdersForToolkit] 총 ${ordersSnapshot.size}개의 주문 발견`);

                    // 3. 전체 수량 계산
                    let totalQty = 0;
                    ordersSnapshot.forEach(doc => {
                        const qty = Number(doc.data().quantity || 0);
                        totalQty += qty;
                        console.log(`[updateAllOrdersForToolkit] 주문 ${doc.id}: ${qty}개, costId: ${doc.data().costId || '없음'}`);
                    });
                    console.log(`[updateAllOrdersForToolkit] 전체 수량: ${totalQty}개`);

                    // 4. 새로운 단가 계산
                    const newPricePerUnit = getPricePerUnit(toolkit, totalQty);
                    console.log(`[updateAllOrdersForToolkit] 새 단가: ${newPricePerUnit}원`);

                    // 5. Batch로 모든 주문과 비용 업데이트
                    const batch = db.batch();
                    let orderUpdateCount = 0;
                    let costUpdateCount = 0;

                    ordersSnapshot.forEach(doc => {
                        const orderData = doc.data();
                        const quantity = Number(orderData.quantity || 0);
                        const newTotalAmount = quantity * newPricePerUnit;

                        // 주문 업데이트
                        batch.update(doc.ref, {
                            pricePerUnit: newPricePerUnit,
                            totalAmount: newTotalAmount,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        orderUpdateCount++;

                        // 연결된 비용도 업데이트
                        if (orderData.costId) {
                            const costRef = db.collection('costs').doc(orderData.costId);
                            batch.update(costRef, {
                                amount: newTotalAmount,
                                description: `${toolkit.name} (${quantity}개)`,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            costUpdateCount++;
                        } else {
                            console.warn(`[updateAllOrdersForToolkit] 주문 ${doc.id}에 costId가 없음 - 비용 업데이트 스킵`);
                        }
                    });

                    console.log(`[updateAllOrdersForToolkit] Batch 커밋 시작: 주문 ${orderUpdateCount}개, 비용 ${costUpdateCount}개`);
                    await batch.commit();
                    console.log(`[updateAllOrdersForToolkit] ✅ 완료: 툴킷 "${toolkit.name}", 새 단가: ${newPricePerUnit.toLocaleString()}원`);
                } catch (error) {
                    console.error('[updateAllOrdersForToolkit] ❌ 오류:', error);
                }
            };

            // 주문 수량 변경
            const handleQuantityChange = (toolkitId, value) => {
                const quantity = value === '' ? '' : Math.max(0, Number(value));
                setMyOrders(prev => ({
                    ...prev,
                    [toolkitId]: {
                        ...prev[toolkitId],
                        quantity: quantity,
                        toolkitId: toolkitId
                    }
                }));
            };

            // 주문 저장 (비용도 함께 저장/업데이트)
            const handleSaveOrder = async (toolkit) => {
                console.log('🚀 [handleSaveOrder] 시작:', toolkit.name);
                const order = myOrders[toolkit.id];
                const quantity = Number(order?.quantity || 0);
                console.log('📦 [handleSaveOrder] 수량:', quantity);

                if (quantity === 0) {
                    alert('수량을 입력해주세요.');
                    return;
                }

                // 최소 주문 수량 체크
                if (toolkit.minOrderQty && quantity < toolkit.minOrderQty) {
                    alert(`최소 주문 수량은 ${toolkit.minOrderQty}개입니다.\n현재 입력: ${quantity}개`);
                    return;
                }

                // 주문 단위(배수) 체크
                if (toolkit.orderUnit) {
                    const baseQty = toolkit.minOrderQty || 0;
                    const diff = quantity - baseQty;

                    if (diff % toolkit.orderUnit !== 0) {
                        const validQty = baseQty + Math.ceil(diff / toolkit.orderUnit) * toolkit.orderUnit;
                        alert(`주문 단위는 ${toolkit.orderUnit}개입니다.\n현재 입력: ${quantity}개\n\n가장 가까운 유효 수량: ${validQty}개`);
                        return;
                    }
                }

                try {
                    // 🔥 최신 주문 목록을 Firestore에서 직접 가져와서 정확한 단가 계산
                    const latestOrdersSnapshot = await db.collection('toolkitOrders')
                        .where('toolkitId', '==', toolkit.id)
                        .get();

                    // 다른 사용자들의 총 수량 계산
                    let othersTotal = 0;
                    latestOrdersSnapshot.forEach(doc => {
                        const orderData = doc.data();
                        // 현재 사용자의 기존 주문은 제외 (새로 저장될 것이므로)
                        if (doc.id !== order?.id) {
                            othersTotal += Number(orderData.quantity || 0);
                        }
                    });

                    // 전체 수량 = 다른 사용자들 + 현재 입력값
                    const newTotalQty = othersTotal + quantity;
                    const pricePerUnit = getPricePerUnit(toolkit, newTotalQty);
                    const totalAmount = quantity * pricePerUnit;

                    console.log(`[handleSaveOrder] 툴킷: ${toolkit.name}, 다른 사용자: ${othersTotal}개, 내 수량: ${quantity}개, 총: ${newTotalQty}개, 단가: ${pricePerUnit}원`);

                    const orderData = {
                        toolkitId: toolkit.id,
                        toolkitName: toolkit.name,
                        userId: user.uid,
                        userEmail: user.email,
                        branchName: userInfo?.branchName || '미설정',
                        team: userInfo?.team || '',
                        quantity: quantity,
                        pricePerUnit: pricePerUnit,
                        totalAmount: totalAmount,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    let orderDocId = order?.id;
                    let costDocId = order?.costId;

                    // 1. 툴킷 주문 저장/업데이트
                    if (orderDocId) {
                        // 기존 주문 업데이트
                        await db.collection('toolkitOrders').doc(orderDocId).update(orderData);
                    } else {
                        // 새 주문 생성
                        orderData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        const orderRef = await db.collection('toolkitOrders').add(orderData);
                        orderDocId = orderRef.id;
                    }

                    // 2. 마케팅 비용 저장/업데이트
                    const costData = {
                        category: 'toolkit',
                        description: `${toolkit.name} (${quantity}개)`,
                        amount: totalAmount,
                        date: new Date().toISOString().split('T')[0],
                        userId: user.uid,
                        userEmail: user.email,
                        branchName: userInfo?.branchName || '미설정',
                        team: userInfo?.team || '',
                        round: currentRound?.name || '',
                        toolkitOrderId: orderDocId,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    if (costDocId) {
                        // 기존 비용 업데이트
                        await db.collection('costs').doc(costDocId).update(costData);
                    } else {
                        // 새 비용 생성
                        costData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        const costRef = await db.collection('costs').add(costData);
                        costDocId = costRef.id;

                        // toolkitOrders에 costId 저장
                        await db.collection('toolkitOrders').doc(orderDocId).update({ costId: costDocId });
                    }

                    // 3. 다른 지점들의 비용도 업데이트 (가격 구간이 변경될 수 있으므로)
                    console.log('🔄 [handleSaveOrder] updateAllOrdersForToolkit 호출 전');
                    await updateAllOrdersForToolkit(toolkit.id);
                    console.log('✅ [handleSaveOrder] updateAllOrdersForToolkit 호출 후');

                    alert(order?.id ? '주문이 수정되었습니다.' : '주문이 등록되었습니다.');
                    loadData();
                } catch (error) {
                    console.error('❌ [handleSaveOrder] 주문 저장 오류:', error);
                    alert('주문 저장에 실패했습니다: ' + error.message);
                }
            };

            // 주문 취소 (툴킷 주문 및 연결된 비용 삭제)
            const handleCancelOrder = async (toolkit) => {
                const order = myOrders[toolkit.id];

                if (!order?.id) {
                    alert('취소할 주문이 없습니다.');
                    return;
                }

                if (!confirm(`"${toolkit.name}" 주문을 취소하시겠습니까?\n연결된 비용도 함께 삭제됩니다.`)) {
                    return;
                }

                try {
                    // 1. 연결된 비용 삭제 (존재하는 경우만)
                    if (order.costId) {
                        try {
                            const costDoc = await db.collection('costs').doc(order.costId).get();
                            if (costDoc.exists) {
                                await db.collection('costs').doc(order.costId).delete();
                            }
                        } catch (costError) {
                            console.error('비용 삭제 오류:', costError);
                            // 비용 삭제 실패해도 주문은 삭제 진행
                        }
                    }

                    // 2. 툴킷 주문 삭제
                    await db.collection('toolkitOrders').doc(order.id).delete();

                    // 3. 다른 지점들의 비용도 업데이트 (가격 구간이 변경될 수 있으므로)
                    await updateAllOrdersForToolkit(toolkit.id);

                    alert('주문이 취소되었습니다.');
                    loadData();
                } catch (error) {
                    console.error('주문 취소 오류:', error);
                    alert('주문 취소에 실패했습니다: ' + error.message);
                }
            };

            if (loading) {
                return <div className="loading-spinner"><p>데이터를 불러오는 중...</p></div>;
            }

            // 내 주문 총 금액 계산
            const myTotalAmount = toolkits.reduce((sum, toolkit) => {
                const myQty = Number(myOrders[toolkit.id]?.quantity || 0);
                const totalQty = getTotalOrderQty(toolkit.id);
                const pricePerUnit = getPricePerUnit(toolkit, totalQty);
                return sum + (myQty * pricePerUnit);
            }, 0);

            // 잔여 예산 계산
            const totalSpent = costs.reduce((sum, cost) => sum + (cost.amount || 0), 0);
            const remainingBudget = branchBudget - totalSpent;

                    </div>

                    {/* 예산 정보 */}
                    {currentRound && branchBudget > 0 && (
                        <div style={{

                            padding: '24px',
                            marginBottom: '20px',
                            color: 'white'

                            <div style={{
                                display: 'flex',

                                alignItems: 'center',
                                marginBottom: '16px'

                                <div>
                                    <h3 style={{fontSize: '14px', opacity: 0.9, marginBottom: '4px'}}>
                                        {currentRound.name}

                                    <p style={{fontSize: '12px', opacity: 0.7}}>
                                        {currentRound.startDate} ~ {currentRound.endDate}
                                    </p>
                                </div>
                                <div style={{
                                    background: totalSpent > branchBudget ? '#dc3545' : '#f07c00',
                                    padding: '6px 14px',
                                    borderRadius: '20px',
                                    fontSize: '13px',
                                    fontWeight: '600'
                                }}>
                                    {branchBudget > 0 ? Math.round((totalSpent / branchBudget) * 100) : 0}% 사용
                                </div>
                            </div>

                            {/* 프로그레스 바 */}

                                background: 'rgba(255,255,255,0.2)',
                                borderRadius: '10px',
                                height: '12px',
                                marginBottom: '16px',

                                    transition: 'width 0.5s ease'

                            </div>

                            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px'}}>

                                    <div style={{fontSize: '12px', opacity: 0.8, marginBottom: '4px'}}>배정 비용</div>
                                    <div style={{fontSize: '20px', fontWeight: '700'}}>
                                        ₩{branchBudget.toLocaleString()}
                                    </div>
                                </div>
                                <div>
                                    <div style={{fontSize: '12px', opacity: 0.8, marginBottom: '4px'}}>사용 비용</div>
                                    <div style={{fontSize: '20px', fontWeight: '700'}}>
                                        ₩{totalSpent.toLocaleString()}
                                    </div>

                                    <div style={{
                                        fontSize: '20px',
                                        fontWeight: '700',
                                        color: remainingBudget < 0 ? '#ff6b6b' : '#4ade80'
                                    }}>
                                        ₩{remainingBudget.toLocaleString()}
                                    </div>
                                </div>
                            </div>

                            {remainingBudget < myTotalAmount && myTotalAmount > 0 && (

                                    marginTop: '16px',
                                    padding: '12px 16px',
                                    background: 'rgba(254, 202, 202, 0.2)',
                                    borderRadius: '8px',
                                    fontSize: '13px',
                                    border: '1px solid rgba(254, 202, 202, 0.3)',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '8px'
                                }}>
                                    <span>⚠️</span>
                                    툴킷 신청 금액이 잔여 예산을 초과합니다!
                                </div>
                            )}
                        </div>
                    )}

                    {/* 안내 사항 */}
                    <div style={{
                        marginBottom: '20px',
                        padding: '20px',
                        background: 'white',
                        borderRadius: '10px',
                        boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
                        border: '1px solid #e5e7eb'
                    }}>
                        <h4 style={{fontSize: '14px', marginBottom: '12px', color: '#001236', fontWeight: '600'}}>📌 안내사항</h4>
                        <ul style={{fontSize: '13px', color: '#666', lineHeight: '1.8', paddingLeft: '20px', margin: 0}}>
                            <li><strong>전체 지점의 주문 합계</strong>에 따라 개당 단가가 결정됩니다.</li>
                            <li>다른 지점의 신청 현황을 확인하여 <strong>예상 단가</strong>를 참고하세요.</li>
                            <li><strong style={{color: '#dc2626'}}>배송비는 별도로 청구됩니다.</strong></li>
                            <li>주문 수정은 언제든지 가능합니다.</li>
                            <li>툴킷 신청 시 자동으로 <strong>마케팅 비용</strong>에 등록됩니다.</li>
                        </ul>
                    </div>

                    {/* 내 주문 총 금액 */}
                    {myTotalAmount > 0 && (
                        <div style={{
                            marginBottom: '20px',
                            padding: '20px',
                            background: 'white',
                            borderRadius: '10px',
                            boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
                            border: '1px solid #e5e7eb',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center'
                        }}>
                            <div>
                                <div style={{fontSize: '13px', color: '#666', marginBottom: '6px'}}>내 지점 예상 총 금액</div>
                                <div style={{fontSize: '26px', fontWeight: '700', color: '#f07c00'}}>
                                    {myTotalAmount.toLocaleString()}원
                                </div>
                            </div>
                            <div style={{fontSize: '12px', color: '#999', textAlign: 'right'}}>
                                (배송비 별도)

                        </div>

                    {/* 툴킷 목록 */}
                    <div className="content-area">
                        {toolkits.length === 0 ? (
                            <div className="empty-state">
                                <p>등록된 툴킷이 없습니다.</p>

                                {toolkits.map(toolkit => {

                                const myQty = Number(myOrders[toolkit.id]?.quantity || 0);
                                const pricePerUnit = getPricePerUnit(toolkit, totalQty);
                                const myAmount = myQty * pricePerUnit;

                                return (
                                    <div key={toolkit.id} style={{
                                        padding: '30px',

                                        flexDirection: 'column',

                                        e.currentTarget.style.boxShadow = '0 4px 12px rgba(0,0,0,0.12)';

                                    onMouseLeave={(e) => {
                                        e.currentTarget.style.transform = 'translateY(0)';
                                        e.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
                                    }}>
                                        {/* 이미지 */}
                                        <div style={{textAlign: 'center', marginBottom: '15px'}}>
                                            {toolkit.imageUrl ? (
                                                <div style={{position: 'relative', display: 'inline-block'}}>

                                                        today.setHours(0, 0, 0, 0);
                                                        const due = new Date(toolkit.dueDate);
                                                        due.setHours(0, 0, 0, 0);
                                                        const diffTime = due - today;
                                                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                                                        return (
                                                            <div style={{
                                                                position: 'absolute',
                                                                top: '8px',

                                                                boxShadow: '0 2px 8px rgba(0,0,0,0.3)'

                                        {(toolkit.minOrderQty || toolkit.orderUnit) && (

                                        <div style={{padding: '14px', background: '#fff7ed', borderRadius: '8px', marginBottom: '12px', textAlign: 'center', border: '1px solid #fed7aa'}}>

                                            <div style={{fontSize: '20px', fontWeight: '700', color: '#f07c00'}}>
                                                {myAmount.toLocaleString()}원
                                            </div>
                                        </div>

                                        {/* 버튼 영역 */}
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                            {/* 저장 버튼 */}
                                            <button
                                                className="btn"
                                                style={{background: '#f07c00', width: '100%', padding: '12px', fontSize: '14px', fontWeight: '600'}}
                                                onClick={() => handleSaveOrder(toolkit)}
                                            >
                                                💾 저장
                                            </button>

                                            {/* 신청 취소 버튼 - 기존 주문이 있을 때만 표시 */}
                                            {myOrders[toolkit.id]?.id && (
                                                <button
                                                    className="btn"
                                                    style={{
                                                        background: 'white',
                                                        border: '2px solid #e94560',
                                                        color: '#e94560',
                                                        width: '100%',
                                                        padding: '12px',
                                                        fontSize: '14px',
                                                        fontWeight: '600'
                                                    }}
                                                    onClick={() => handleCancelOrder(toolkit)}
                                                >
                                                    ✕ 신청 취소
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // 마케팅 비용 페이지
        function MarketingCostPage({ user, userInfo }) {
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [costs, setCosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({
                category: '',
                amount: '',
                date: new Date().toISOString().split('T')[0],
                description: ''
            });

            // 이미지 업로드 상태 (최소 3개, 최대 5개)
            const [imageFiles, setImageFiles] = useState([]);
            const [imagePreviews, setImagePreviews] = useState([]);
            const MIN_IMAGES = 3;
            const MAX_IMAGES = 5;

            // 증빙 방식 선택 상태 ('branch' 또는 'hq')
            const [verifyType, setVerifyType] = useState('branch');

            // 선택 및 삭제 관련 상태
            const [selectedCosts, setSelectedCosts] = useState([]);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [isDeleting, setIsDeleting] = useState(false);

            // 비용 등록 로딩 상태
            const [isSubmitting, setIsSubmitting] = useState(false);

            // 이미지 미리보기 모달 상태
            const [showImageModal, setShowImageModal] = useState(false);
            const [previewImages, setPreviewImages] = useState([]);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);

            // Round 배정 비용 관련 상태
            const [currentRound, setCurrentRound] = useState(null);
            const [branchBudget, setBranchBudget] = useState(0);

            // Firestore에서 비용 목록 로드 (지점별)
            useEffect(() => {
                if (!user || !userInfo?.branchName) return;

                const unsubscribe = db.collection('costs')
                    .where('branchName', '==', userInfo.branchName)
                    .onSnapshot((snapshot) => {
                        const costsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 날짜 기준 내림차순 정렬 (클라이언트에서)
                        costsData.sort((a, b) => {
                            const dateA = new Date(a.date);
                            const dateB = new Date(b.date);
                            return dateB - dateA;
                        });
                        setCosts(costsData);
                        setLoading(false);
                    }, (error) => {
                        console.error('비용 목록 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, [user, userInfo?.branchName]);

            // 현재 진행 중인 Round와 배정 비용 로드
            useEffect(() => {
                if (!userInfo?.branchName) return;

                const today = new Date().toISOString().split('T')[0];

                // 현재 날짜에 해당하는 Round 찾기
                const roundsUnsubscribe = db.collection('rounds')
                    .onSnapshot(async (snapshot) => {
                        const roundsData = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));

                        // 현재 날짜가 포함된 Round 찾기
                        const activeRound = roundsData.find(round => {
                            return today >= round.startDate && today <= round.endDate;
                        });

                        if (activeRound) {
                            setCurrentRound(activeRound);

                            // 해당 Round의 지점 배정 비용 가져오기
                            try {
                                const budgetDoc = await db.collection('roundBudgets').doc(activeRound.id).get();
                                if (budgetDoc.exists) {
                                    const budgets = budgetDoc.data().budgets || {};
                                    setBranchBudget(budgets[userInfo.branchName] || 0);
                                }
                            } catch (error) {
                                console.error('배정 비용 로드 오류:', error);
                            }
                        } else {
                            setCurrentRound(null);
                            setBranchBudget(0);
                        }
                    });

                return () => roundsUnsubscribe();
            }, [userInfo?.branchName]);

            // Round 기간 내 사용 비용 계산
            const getRoundUsedAmount = () => {
                if (!currentRound) return 0;

                return costs.filter(cost => {
                    const costDate = cost.date;
                    return costDate >= currentRound.startDate && costDate <= currentRound.endDate;
                }).reduce((sum, cost) => sum + Number(cost.amount || 0), 0);
            };

            // 금액 포맷 (표시용)
            const formatAmount = (amount) => {
                return new Intl.NumberFormat('ko-KR', {
                    style: 'currency',
                    currency: 'KRW'
                }).format(amount);
            };

            // 금액 입력 포맷 (콤마 추가)
            const formatInputAmount = (value) => {
                // 숫자만 추출
                const numericValue = value.replace(/[^\d]/g, '');
                // 콤마 추가
                return numericValue.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            };

            // 콤마 제거하고 숫자로 변환
            const parseAmount = (value) => {
                return value.replace(/,/g, '');
            };

            // 금액 입력 핸들러
            const handleAmountChange = (e) => {
                const formatted = formatInputAmount(e.target.value);
                setFormData({...formData, amount: formatted});
            };

            // 이미지 업로드 핸들러 (다중)
            const handleImageChange = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                // 최대 개수 체크
                const remainingSlots = MAX_IMAGES - imageFiles.length;
                if (files.length > remainingSlots) {
                    alert(`최대 ${MAX_IMAGES}개까지만 업로드 가능합니다. ${remainingSlots}개만 추가됩니다.`);
                }

                const filesToAdd = files.slice(0, remainingSlots);
                const validFiles = [];
                const validPreviews = [];

                // 파일 형식 및 크기 검증
                const validTypes = ['image/jpeg', 'image/png'];
                const MAX_WIDTH = 3500;
                const MAX_HEIGHT = 3500;

                for (const file of filesToAdd) {
                    // 형식 검증
                    if (!validTypes.includes(file.type)) {
                        alert(`${file.name}: JPG 또는 PNG 파일만 업로드 가능합니다.`);
                        continue;
                    }

                    // 이미지 크기(픽셀) 검증
                    const dimensionCheck = await validateImageDimensions(file);
                    if (!dimensionCheck.valid) {
                        alert(`${file.name}: ${dimensionCheck.message}`);
                        continue;
                    }

                    validFiles.push(file);
                }

                if (validFiles.length === 0) {
                    e.target.value = '';
                    return;
                }

                // 미리보기 생성
                let loadedCount = 0;
                validFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        validPreviews[index] = event.target.result;
                        loadedCount++;

                        if (loadedCount === validFiles.length) {
                            setImageFiles(prev => [...prev, ...validFiles]);
                            setImagePreviews(prev => [...prev, ...validPreviews]);
                        }
                    };
                    reader.readAsDataURL(file);
                });

                e.target.value = '';
            };

            // 개별 이미지 제거
            const handleImageRemove = (index) => {
                setImageFiles(prev => prev.filter((_, i) => i !== index));
                setImagePreviews(prev => prev.filter((_, i) => i !== index));
            };

            // 증빙 방식 변경 시 이미지 초기화 (본사 증빙 선택 시)
            useEffect(() => {
                if (verifyType === 'hq') {
                    setImageFiles([]);
                    setImagePreviews([]);
                }
            }, [verifyType]);

            // 모든 이미지 제거
            const handleImageRemoveAll = () => {
                setImageFiles([]);
                setImagePreviews([]);
            };

            // 날짜 포맷
            const formatDate = (dateValue) => {
                if (!dateValue) return '-';
                // Firestore Timestamp 처리
                const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
                return date.toLocaleDateString('ko-KR', {
                    year: '2-digit',
                    month: '2-digit',
                    day: '2-digit'
                });
            };

            // 이번 달 비용 계산
            const getMonthlyTotal = () => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                return costs
                    .filter(cost => {
                        const costDate = new Date(cost.date);
                        return costDate.getMonth() === currentMonth && costDate.getFullYear() === currentYear;
                    })
                    .reduce((sum, cost) => sum + Number(cost.amount), 0);
            };

            // 총 비용 계산
            const getTotalAmount = () => {
                return costs.reduce((sum, cost) => sum + Number(cost.amount), 0);
            };

            // 폼 제출 (Firestore에 저장)
            const handleSubmit = async (e) => {
                e.preventDefault();

                const numericAmount = parseAmount(formData.amount);

                if (!formData.category || !numericAmount || !formData.date) {
                    alert('필수 항목을 모두 입력해주세요.');
                    return;
                }

                // 이미지 개수 검증 (지점 증빙 선택 시에만 필수)
                if (verifyType === 'branch' && imageFiles.length < MIN_IMAGES) {
                    alert(`증빙 이미지는 최소 ${MIN_IMAGES}개 이상 업로드해주세요. (현재 ${imageFiles.length}개)`);
                    return;
                }

                setIsSubmitting(true);

                try {
                    // 먼저 Firestore에 비용 데이터 저장 (costId 필요)
                    const costDocRef = await db.collection('costs').add({
                        userId: user.uid,
                        userEmail: user.email,
                        branchName: userInfo?.branchName || '',
                        team: userInfo?.team || '',
                        category: formData.category,
                        amount: Number(numericAmount),
                        date: formData.date,
                        description: formData.description,
                        imageCount: imageFiles.length,
                        images: [],
                        canVerifyAtHQ: verifyType === 'hq',  // 본사 증빙 여부
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    const costId = costDocRef.id;

                    // 이미지가 있으면 Storage에 업로드
                    if (imageFiles.length > 0) {
                        const uploadResult = await uploadImages(imageFiles, user.uid, costId);

                        if (uploadResult.success && uploadResult.images.length > 0) {
                            // Firestore 문서에 이미지 정보 업데이트
                            await costDocRef.update({
                                images: uploadResult.images,
                                imageCount: uploadResult.images.length
                            });
                        }
                    }

                    setFormData({
                        category: '',
                        amount: '',
                        date: new Date().toISOString().split('T')[0],
                        description: ''
                    });
                    setImageFiles([]);
                    setImagePreviews([]);
                    setVerifyType('branch');  // 증빙 방식 초기화
                    setIsDrawerOpen(false);
                    alert('비용이 등록되었습니다.');
                } catch (error) {
                    console.error('비용 등록 오류:', error);
                    alert('비용 등록에 실패했습니다.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            // 체크박스 - 개별 선택
            const handleSelectCost = (id) => {
                setSelectedCosts(prev => {
                    if (prev.includes(id)) {
                        return prev.filter(costId => costId !== id);
                    } else {
                        return [...prev, id];
                    }
                });
            };

            // 체크박스 - 전체 선택 (툴킷 비용 제외)
            const handleSelectAll = () => {
                const selectableCosts = costs.filter(cost =>
                    cost.category !== 'toolkit' && cost.category !== '툴킷'
                );

                if (selectedCosts.length === selectableCosts.length && selectableCosts.length > 0) {
                    setSelectedCosts([]);
                } else {
                    setSelectedCosts(selectableCosts.map(cost => cost.id));
                }
            };

            // 삭제 모달 열기
            const openDeleteModal = () => {
                if (selectedCosts.length === 0) {
                    alert('삭제할 항목을 선택해주세요.');
                    return;
                }
                setDeletePassword('');
                setShowDeleteModal(true);
            };

            // 이미지 미리보기 열기
            const openImagePreview = (images) => {
                if (!images || images.length === 0) {
                    alert('등록된 이미지가 없습니다.');
                    return;
                }
                setPreviewImages(images);
                setCurrentImageIndex(0);
                setShowImageModal(true);
            };

            // 이전/다음 이미지
            const handlePrevImage = () => {
                setCurrentImageIndex(prev => prev > 0 ? prev - 1 : previewImages.length - 1);
            };

            const handleNextImage = () => {
                setCurrentImageIndex(prev => prev < previewImages.length - 1 ? prev + 1 : 0);
            };

            // 비밀번호 확인 후 삭제 실행
            const handleConfirmDelete = async (e) => {
                e.preventDefault();

                if (!deletePassword) {
                    alert('비밀번호를 입력해주세요.');
                    return;
                }

                setIsDeleting(true);

                try {
                    // 비밀번호 확인 (재인증)
                    const credential = firebase.auth.EmailAuthProvider.credential(
                        user.email,
                        deletePassword
                    );
                    await user.reauthenticateWithCredential(credential);

                    // 선택된 비용의 이미지도 함께 삭제
                    for (const costId of selectedCosts) {
                        // Storage에서 이미지 삭제
                        await deleteCostImages(user.uid, costId);
                    }

                    // Firestore에서 비용 데이터 삭제
                    const batch = db.batch();
                    selectedCosts.forEach(id => {
                        const docRef = db.collection('costs').doc(id);
                        batch.delete(docRef);
                    });
                    await batch.commit();

                    alert(`${selectedCosts.length}개 항목이 삭제되었습니다.`);
                    setSelectedCosts([]);
                    setShowDeleteModal(false);
                } catch (error) {
                    console.error('삭제 오류:', error);
                    if (error.code === 'auth/wrong-password') {
                        alert('비밀번호가 올바르지 않습니다.');
                    } else {
                        alert('삭제에 실패했습니다: ' + error.message);
                    }
                } finally {
                    setIsDeleting(false);
                    setDeletePassword('');
                }
            };

            if (loading) {
                return (
                    <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '50vh'}}>
                        <p>비용 목록을 불러오는 중...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">마케팅 비용</h2>
                        <p className="page-subtitle">마케팅 비용을 등록하고 관리합니다</p>
                    </div>

                    {/* Round 배정 비용 카드 */}
                    {currentRound && branchBudget > 0 && (
                        <div style={{
                            background: 'linear-gradient(135deg, #001236 0%, #002856 100%)',
                            borderRadius: '12px',
                            padding: '24px',
                            marginBottom: '20px',
                            color: 'white'
                        }}>
                            <div style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                marginBottom: '16px'
                            }}>
                                <div>
                                    <h3 style={{fontSize: '14px', opacity: 0.9, marginBottom: '4px'}}>
                                        {currentRound.name}
                                    </h3>
                                    <p style={{fontSize: '12px', opacity: 0.7}}>
                                        {currentRound.startDate} ~ {currentRound.endDate}
                                    </p>
                                </div>
                                <div style={{
                                    background: getRoundUsedAmount() > branchBudget ? '#dc3545' : '#f07c00',
                                    padding: '6px 14px',
                                    borderRadius: '20px',
                                    fontSize: '13px',
                                    fontWeight: '600'
                                }}>
                                    {branchBudget > 0 ? Math.round((getRoundUsedAmount() / branchBudget) * 100) : 0}% 사용
                                </div>
                            </div>

                            {/* 프로그레스 바 */}
                            <div style={{
                                background: 'rgba(255,255,255,0.2)',
                                borderRadius: '10px',
                                height: '12px',
                                marginBottom: '16px',
                                overflow: 'hidden'
                            }}>
                                <div style={{
                                    width: `${Math.min((getRoundUsedAmount() / branchBudget) * 100, 100)}%`,
                                    height: '100%',
                                    background: getRoundUsedAmount() > branchBudget ? '#dc3545' : '#f07c00',
                                    transition: 'width 0.5s ease'
                                }} />
                            </div>

                            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px'}}>
                                <div>
                                    <div style={{fontSize: '12px', opacity: 0.8, marginBottom: '4px'}}>배정 비용</div>
                                    <div style={{fontSize: '20px', fontWeight: '700'}}>{formatAmount(branchBudget)}</div>
                                </div>
                                <div>
                                    <div style={{fontSize: '12px', opacity: 0.8, marginBottom: '4px'}}>사용 비용</div>
                                    <div style={{fontSize: '20px', fontWeight: '700'}}>{formatAmount(getRoundUsedAmount())}</div>
                                </div>
                                <div>
                                    <div style={{fontSize: '12px', opacity: 0.8, marginBottom: '4px'}}>잔여 비용</div>
                                    <div style={{
                                        fontSize: '20px',
                                        fontWeight: '700',
                                        color: branchBudget - getRoundUsedAmount() < 0 ? '#ff6b6b' : '#4ade80'
                                    }}>
                                        {formatAmount(branchBudget - getRoundUsedAmount())}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="stats-grid">
                        <div className="stat-card">
                            <h3>이번 달 비용</h3>
                            <div className="value">{formatAmount(getMonthlyTotal())}</div>
                        </div>
                        <div className="stat-card">
                            <h3>누적 비용</h3>
                            <div className="value">{formatAmount(getTotalAmount())}</div>
                        </div>
                        <div className="stat-card">
                            <h3>등록된 항목</h3>
                            <div className="value">{costs.length}</div>
                        </div>
                    </div>

                    <div className="content-area">
                        <div className="table-header">
                            <h3 className="section-title" style={{marginBottom: 0}}>비용 목록</h3>
                            <button className="btn" onClick={() => setIsDrawerOpen(true)}>
                                + 비용 등록
                            </button>
                        </div>

                        {costs.length === 0 ? (
                            <div className="empty-table">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                    <path d="M12 11v6M9 14h6"/>
                                </svg>
                                <p>등록된 비용이 없습니다.</p>
                                <p style={{marginTop: '8px', color: '#bbb'}}>위의 '비용 등록' 버튼을 클릭하여 비용을 추가하세요.</p>
                            </div>
                        ) : (
                            <>
                                {/* 삭제 기능 비활성화됨 */}
                                {/* {selectedCosts.length > 0 && (
                                    <div className="delete-action-bar">
                                        <span>{selectedCosts.length}개 선택됨</span>
                                        <button className="btn btn-sm btn-danger" onClick={openDeleteModal}>
                                            선택 삭제
                                        </button>
                                    </div>
                                )} */}
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            {/* 체크박스 컬럼 비활성화됨 */}
                                            {/* <th style={{width: '50px', textAlign: 'center'}}>
                                                <input
                                                    type="checkbox"
                                                    checked={(() => {
                                                        const selectableCosts = costs.filter(cost =>
                                                            cost.category !== 'toolkit' && cost.category !== '툴킷'
                                                        );
                                                        return selectedCosts.length === selectableCosts.length && selectableCosts.length > 0;
                                                    })()}
                                                    onChange={handleSelectAll}
                                                    style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                                />
                                            </th> */}
                                            <th style={{textAlign: 'center'}}>날짜</th>
                                            <th style={{textAlign: 'center'}}>항목</th>
                                            <th style={{textAlign: 'center'}}>금액</th>
                                            <th style={{textAlign: 'center'}}>설명</th>
                                            <th style={{width: '80px', textAlign: 'center'}}>증빙</th>

        // 대시보드 페이지 (지점별)
        function DashboardPage({ userInfo }) {
            // 전일 날짜를 기본값으로 계산
            const getYesterdayStr = () => {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const year = yesterday.getFullYear();
                const month = String(yesterday.getMonth() + 1).padStart(2, '0');
                const day = String(yesterday.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const [loading, setLoading] = useState(true);
            const [dashboardData, setDashboardData] = useState({
                students: {},
                registrations: {},
                withdrawals: {}
            });
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedDate, setSelectedDate] = useState(getYesterdayStr());
            const [dateA, setDateA] = useState(getYesterdayStr());
            const [dateB, setDateB] = useState(getYesterdayStr());
            const chartRefs = {
                trend: React.useRef(null),
                compare: React.useRef(null)
            };
            const chartInstances = React.useRef({});

            const branchName = userInfo?.branchName;

            // 데이터 로드
            useEffect(() => {
                if (!branchName) {
                    setLoading(false);
                    return;
                }

                const loadDashboardData = async () => {
                    try {
                        const dataTypes = ['studentCount', 'registrationCount', 'withdrawalCount'];
                        const dataKeys = ['students', 'registrations', 'withdrawals'];

                        // 모든 데이터를 한 번에 수집
                        const allData = {
                            students: {},
                            registrations: {},
                            withdrawals: {}
                        };

                        for (let i = 0; i < dataTypes.length; i++) {
                            const baseDocId = dataTypes[i];
                            const dataKey = dataKeys[i];
                            const loadedData = {};

                            // 모든 월별 문서 가져오기
                            const snapshot = await db.collection('dashboardData')
                                .where(firebase.firestore.FieldPath.documentId(), '>=', baseDocId)
                                .where(firebase.firestore.FieldPath.documentId(), '<=', baseDocId + '\uf8ff')
                                .get();

                            snapshot.docs.forEach(doc => {
                                const monthData = doc.data().branches || {};
                                // 자신의 지점 데이터만 필터링
                                if (monthData[branchName]) {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);
                                }
                            });

                            // allData 객체에 수집
                            allData[dataKey] = loadedData;
                        }

                        // 모든 데이터를 한 번에 업데이트
                        setDashboardData(allData);
                        setLoading(false);
                    } catch (error) {
                        console.error('대시보드 데이터 로드 오류:', error);
                        setLoading(false);
                    }
                };

                loadDashboardData();

                // 컴포넌트 언마운트 시 차트 정리
                return () => {
                    Object.values(chartInstances.current).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                };
            }, [branchName]);

            // 차트 생성/업데이트 (종합 탭)
            useEffect(() => {
                if (loading || !branchName || activeTab !== 'overview') return;
                if (!dashboardData.students[branchName]) return;

                // 선택한 날짜 기준으로 최근 30일 계산
                const endDate = new Date(selectedDate);
                const startDate = new Date(selectedDate);
                startDate.setDate(endDate.getDate() - 29);

                // 날짜별 데이터 계산
                const dateMap = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    if (dashboardData[type][branchName]) {
                        Object.keys(dashboardData[type][branchName]).forEach(date => {
                            const dateObj = new Date(date);
                            if (dateObj >= startDate && dateObj <= endDate) {
                                if (!dateMap[date]) {
                                    dateMap[date] = { students: 0, registrations: 0, withdrawals: 0 };
                                }
                                const value = Number(dashboardData[type][branchName][date]) || 0;
                                dateMap[date][type] = value;
                            }
                        });
                    }
                });

                const sortedDates = Object.keys(dateMap).sort();

                // 추세 차트 생성
                if (chartRefs.trend.current) {
                    if (chartInstances.current.trend) {
                        chartInstances.current.trend.destroy();
                    }

                    const ctx = chartRefs.trend.current.getContext('2d');
                    chartInstances.current.trend = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: sortedDates,
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: sortedDates.map(date => dateMap[date].students),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
                                    data: sortedDates.map(date => dateMap[date].registrations),
                                    borderColor: 'rgb(34, 197, 94)',
                                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                },
                                {
                                    label: '퇴원수',
                                    data: sortedDates.map(date => dateMap[date].withdrawals),
                                    borderColor: 'rgb(239, 68, 68)',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '재원생수',
                                        color: 'rgb(59, 130, 246)',
                                        font: { weight: 'bold' }
                                    }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    beginAtZero: true,
                                    grid: { drawOnChartArea: false },
                                    title: {
                                        display: true,
                                        text: '등록/퇴원수',
                                        color: 'rgb(34, 197, 94)',
                                        font: { weight: 'bold' }
                                    }
                                }
                            }
                        }
                    });
