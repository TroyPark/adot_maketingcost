            const [user, setUser] = useState(null);

            // 비밀번호 변경 관련 상태
            const [uniquePassword, setUniquePassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [isChangingPassword, setIsChangingPassword] = useState(false);
            const [passwordMessage, setPasswordMessage] = useState({ type: '', text: '' });

            useEffect(() => {
                const currentUser = auth.currentUser;
                if (currentUser) {
                    setUser(currentUser);
                }
            }, []);

            // 비밀번호 변경 처리 (고유 비밀번호로 인증)
            const handlePasswordChange = async (e) => {
                e.preventDefault();
                setPasswordMessage({ type: '', text: '' });

                // 유효성 검사
                if (!uniquePassword.trim()) {
                    setPasswordMessage({ type: 'error', text: '고유 비밀번호를 입력해주세요.' });
                    return;
                }
                if (!newPassword.trim()) {
                    setPasswordMessage({ type: 'error', text: '새 비밀번호를 입력해주세요.' });
                    return;
                }
                if (newPassword.length < 6) {
                    setPasswordMessage({ type: 'error', text: '비밀번호는 최소 6자 이상이어야 합니다.' });
                    return;
                }
                if (newPassword !== confirmPassword) {
                    setPasswordMessage({ type: 'error', text: '새 비밀번호가 일치하지 않습니다.' });
                    return;
                }

                setIsChangingPassword(true);

                try {
                    // Firestore에서 고유 비밀번호 확인
                    const doc = await db.collection('settings').doc('roundPassword').get();

                    if (!doc.exists) {
                        setPasswordMessage({ type: 'error', text: '고유 비밀번호가 설정되지 않았습니다.' });
                        setIsChangingPassword(false);
                        return;
                    }

                    const storedPassword = String(doc.data().password || '').trim();
                    const inputPassword = String(uniquePassword || '').trim();

                    if (!storedPassword || inputPassword !== storedPassword) {
                        setPasswordMessage({ type: 'error', text: '고유 비밀번호가 올바르지 않습니다.' });
                        setIsChangingPassword(false);
                        return;
                    }

                    // 비밀번호 변경
                    const currentUser = auth.currentUser;
                    await currentUser.updatePassword(newPassword);

                    setPasswordMessage({ type: 'success', text: '비밀번호가 성공적으로 변경되었습니다.' });
                    setUniquePassword('');
                    setNewPassword('');
                    setConfirmPassword('');
                } catch (error) {
                    console.error('비밀번호 변경 오류:', error);
                    if (error.code === 'auth/requires-recent-login') {
                        setPasswordMessage({ type: 'error', text: '보안을 위해 다시 로그인 후 시도해주세요.' });
                    } else {
                        setPasswordMessage({ type: 'error', text: '비밀번호 변경에 실패했습니다: ' + error.message });
                    }
                } finally {
                    setIsChangingPassword(false);
                }
            };

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">설정</h2>
                        <p className="page-subtitle">시스템 설정</p>
                    </div>

                    <div className="content-area">
                        {/* 계정 정보 */}
                        <div style={{
                            borderBottom: '1px solid #eee',
                            paddingBottom: '25px',
                            marginBottom: '25px'
                        }}>
                            <h3 className="section-title">계정 정보</h3>
                            <div style={{
                                background: '#f8f9fa',
                                padding: '20px',
                                borderRadius: '10px',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '15px'
                            }}>
                                <div style={{
                                    width: '50px',
                                    height: '50px',
                                    background: '#10b981',
                                    borderRadius: '50%',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    fontSize: '20px',
                                    fontWeight: '700',
                                    color: 'white'
                                }}>
                                    {user?.email?.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div style={{fontSize: '16px', fontWeight: '600', marginBottom: '5px'}}>
                                        {user?.email}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 비밀번호 변경 */}
                        <div style={{borderBottom: 'none', paddingBottom: 0}}>
                            <h3 className="section-title">비밀번호 변경</h3>
                            <p style={{color: '#666', fontSize: '14px', marginBottom: '20px'}}>
                                비밀번호 변경을 위해 고유 비밀번호 인증이 필요합니다.
                            </p>
                            <p style={{color: '#666', fontSize: '14px', marginBottom: '20px'}}>
                                담당자 : 박영주 / 010-4037-0928
                            </p>

                            <form onSubmit={handlePasswordChange}>
                                <div style={{maxWidth: '400px'}}>
                                    <div className="form-group">
                                        <label>고유 비밀번호 *</label>
                                        <input
                                            type="password"
                                            value={uniquePassword}
                                            onChange={(e) => setUniquePassword(e.target.value)}
                                            placeholder="고유 비밀번호를 입력하세요"
                                            disabled={isChangingPassword}
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>새 비밀번호 *</label>
                                        <input
                                            type="password"
                                            value={newPassword}
                                            onChange={(e) => setNewPassword(e.target.value)}
                                            placeholder="새 비밀번호 (최소 6자)"
                                            disabled={isChangingPassword}
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>새 비밀번호 확인 *</label>
                                        <input
                                            type="password"
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}
                                            placeholder="새 비밀번호를 다시 입력하세요"
                                            disabled={isChangingPassword}
                                        />
                                    </div>

                                    {passwordMessage.text && (
                                        <div style={{
                                            padding: '12px 16px',
                                            borderRadius: '8px',
                                            marginBottom: '15px',
                                            background: passwordMessage.type === 'success' ? '#d1fae5' : '#fee2e2',
                                            color: passwordMessage.type === 'success' ? '#065f46' : '#991b1b',
                                            fontSize: '14px'
                                        }}>
                                            {passwordMessage.text}
                                        </div>
                                    )}

                                    <button
                                        type="submit"
                                        className="btn"
                                        disabled={isChangingPassword}
                                        style={{marginTop: '10px'}}
                                    >
                                        {isChangingPassword ? '변경 중...' : '비밀번호 변경'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        /** 기획본부 화면용: 수정·삭제 시 표시할 현재 계정 라벨 */
        function getAbpEditorLabel(u) {
            if (!u) return '';
            const dn = (u.displayName || '').trim();
            if (dn) return dn;
            return u.email || '';
        }

        // 문의 유형 카테고리 · 담당 부서 (Firestore inquiryCategoryDefinitions 단일 소스)
        function InquiryCategoryDeptPage({ user }) {
            const [rows, setRows] = useState([]);
            const [firestoreError, setFirestoreError] = useState(null);
            const [filterTeam, setFilterTeam] = useState('all');
            const [filterMajor, setFilterMajor] = useState('all');
            const [filterSearch, setFilterSearch] = useState('');
            const [showInactive, setShowInactive] = useState(false);

            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('add');
            const [editingId, setEditingId] = useState(null);
            const [formMajorId, setFormMajorId] = useState('');
            const [formBootstrapMajorId, setFormBootstrapMajorId] = useState('');
            const [formBootstrapMajorLabel, setFormBootstrapMajorLabel] = useState('');
            /** 분류 추가 시: 기존 대분류 선택 vs 새 대분류 id·표시명 입력 */
            const [addMajorSource, setAddMajorSource] = useState('existing');
            const [formMinorLabel, setFormMinorLabel] = useState('');
            const [formTargetTeam, setFormTargetTeam] = useState('');
            /** 분류 수정 시: true = 사용, false = 비활성 */
            const [formActive, setFormActive] = useState(true);
            const [saving, setSaving] = useState(false);

            const uniqueMajorOptions = useMemo(() => {
                const m = new Map();
                rows.forEach((r) => {
                    if (r.majorId) m.set(r.majorId, r.majorLabel || r.majorId);
                });
                return Array.from(m.entries())
                    .map(([majorId, majorLabel]) => ({ majorId, majorLabel }))
                    .sort((a, b) => a.majorLabel.localeCompare(b.majorLabel, 'ko'));
            }, [rows]);

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        const list = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
                        list.sort((a, b) => {
                            const ta = a.createdAt?.toDate?.() || new Date(0);
                            const tb = b.createdAt?.toDate?.() || new Date(0);
                            return tb - ta;
                        });
                        setRows(list);
                        setFirestoreError(null);
                    },
                    (err) => {
                        if (err.code === 'permission-denied') {
                            console.warn(
                                '[inquiryCategoryDefinitions] 읽기 권한 없음. Firebase 콘솔 규칙을 확인하세요.'
                            );
                            setFirestoreError(null);
                            return;
                        }
                        console.error('문의 유형 정의 로드 오류:', err);
                        setFirestoreError(err.message || String(err));
                    }
                );
                return () => unsub();
            }, []);

            const filteredRows = useMemo(() => {
                return rows.filter((row) => {
                    if (!showInactive && row.active === false) return false;

                    // 팀/대분류 필터 — OR 조건
                    const teamActive = filterTeam !== 'all';
                    const majorActive = filterMajor !== 'all';
                    if (teamActive || majorActive) {
                        const matchTeam = teamActive && row.targetTeam === filterTeam;
                        const matchMajor = majorActive && row.majorId === filterMajor;
                        if (!matchTeam && !matchMajor) return false;
                    }

                    // 검색어 필터 (대분류·소분류·담당 부서명 대상)
                    if (filterSearch.trim()) {
                        const q = filterSearch.trim().toLowerCase();
                        const teamName = ABP_TEAM_BY_ID[row.targetTeam]?.name || '';
                        if (
                            !(row.majorLabel || '').toLowerCase().includes(q) &&
                            !(row.minorLabel || '').toLowerCase().includes(q) &&
                            !teamName.toLowerCase().includes(q)
                        ) return false;
                    }

                    return true;
                });
            }, [rows, filterTeam, filterMajor, filterSearch, showInactive]);

            const openAdd = () => {
                setModalMode('add');
                setEditingId(null);
                setAddMajorSource(uniqueMajorOptions.length > 0 ? 'existing' : 'new');
                if (uniqueMajorOptions.length > 0) {
                    setFormMajorId(uniqueMajorOptions[0].majorId);
                    setFormBootstrapMajorId('');
                    setFormBootstrapMajorLabel('');
                } else {
                    setFormMajorId('');
                    setFormBootstrapMajorId('');
                    setFormBootstrapMajorLabel('');
                }
                setFormMinorLabel('');
                setFormTargetTeam('');
                setFormActive(true);
                setShowModal(true);
            };

            const openEdit = (row) => {
                setModalMode('edit');
                setEditingId(row.id);
                setFormMajorId(row.majorId || '');
                setFormBootstrapMajorId('');
                setFormBootstrapMajorLabel('');
                setFormMinorLabel(row.minorLabel || '');
                setFormTargetTeam(row.targetTeam || '');
                setFormActive(row.active !== false);
                setShowModal(true);
            };

            const handleSave = async () => {
                const minor = formMinorLabel.trim();
                if (!minor) {
                    alert('문의 유형 카테고리 명을 입력해주세요.');
                    return;
                }
                if (!formTargetTeam) {
                    alert('담당 부서를 선택해주세요.');
                    return;
                }
                if (!isKnownAbpTargetTeam(formTargetTeam)) {
                    alert('유효한 담당 부서를 선택해주세요.');
                    return;
                }

                let resolvedMajorId;
                let resolvedMajorLabel;
                const useBootstrapMajor =
                    modalMode === 'add' &&
                    (uniqueMajorOptions.length === 0 || addMajorSource === 'new');

                if (useBootstrapMajor) {
                    resolvedMajorId = formBootstrapMajorId.trim();
                    resolvedMajorLabel = formBootstrapMajorLabel.trim();
                    if (!resolvedMajorId || !resolvedMajorLabel) {
                        alert('대분류 id(영문)·대분류 표시명을 모두 입력해주세요.');
                        return;
                    }
                } else {
                    resolvedMajorId = formMajorId;
                    resolvedMajorLabel = inquiryMajorLabelFromRows(formMajorId, rows);
                    if (modalMode === 'add' && !resolvedMajorId) {
                        alert('대분류를 선택해주세요.');
                        return;
                    }
                }

                if (modalMode === 'add') {
                    setSaving(true);
                    try {
                        await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).add({
                            majorId: resolvedMajorId,
                            majorLabel: resolvedMajorLabel,
                            minorId: generateInquiryMinorId(minor),
                            minorLabel: minor,
                            targetTeam: formTargetTeam,
                            active: true,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedByName: getAbpEditorLabel(user),
                            updatedByUid: user?.uid || ''
                        });
                        setShowModal(false);
                    } catch (e) {
                        console.error(e);
                        alert('저장에 실패했습니다: ' + (e.message || e));
                    } finally {
                        setSaving(false);
                    }
                    return;
                }

                if (modalMode === 'edit' && editingId) {
                    setSaving(true);
                    try {
                        await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(editingId).update({
                            majorId: resolvedMajorId,
                            majorLabel: resolvedMajorLabel,
                            minorLabel: minor,
                            targetTeam: formTargetTeam,
                            active: formActive,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedByName: getAbpEditorLabel(user),
                            updatedByUid: user?.uid || ''
                        });
                        setShowModal(false);
                    } catch (e) {
                        console.error(e);
                        alert('수정에 실패했습니다: ' + (e.message || e));
                    } finally {
                        setSaving(false);
                    }
                }
            };

            const handleSoftDelete = async (row) => {
                if (!confirm(`「${row.majorLabel || inquiryMajorLabelFromRows(row.majorId, rows)} › ${row.minorLabel}」 분류를 비활성화할까요?`)) return;
                try {
                    await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(row.id).update({
                        active: false,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedByName: getAbpEditorLabel(user),
                        updatedByUid: user?.uid || ''
                    });
                } catch (e) {
                    console.error(e);
                    alert('삭제 처리에 실패했습니다: ' + (e.message || e));
                }
            };

            const handleRestore = async (row) => {
                try {
                    await db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).doc(row.id).update({
                        active: true,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedByName: getAbpEditorLabel(user),
                        updatedByUid: user?.uid || ''
                    });
                } catch (e) {
                    console.error(e);
                    alert('복구에 실패했습니다: ' + (e.message || e));
                }
            };

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">담당 부서 / 문의 유형</h2>
                    </div>

                    {firestoreError && (
                        <div
                            style={{
                                margin: '0 24px 12px',
                                padding: '12px 16px',
                                background: '#fef2f2',
                                color: '#991b1b',
                                borderRadius: '8px',
                                fontSize: '14px'
                            }}
                        >
                            Firestore 연동 오류: {firestoreError}
                        </div>
                    )}

                    <div className="content-area">
                        <div style={{ marginBottom: '20px' }}>
                            <div
                                style={{
                                    display: 'flex',
                                    flexWrap: 'wrap',
                                    gap: '12px',
                                    alignItems: 'center',
                                    padding: '12px 16px',
                                    background: '#f8fafc',
                                    borderRadius: '10px'
                                }}
                            >
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', flex: 1, minWidth: '180px' }}>
                                    <label style={{ fontSize: '12px', color: '#64748b' }}>검색</label>
                                    <input
                                        type="text"
                                        value={filterSearch}
                                        onChange={(e) => setFilterSearch(e.target.value)}
                                        placeholder="대분류·소분류·부서명 검색"
                                        style={{
                                            padding: '8px 12px',
                                            borderRadius: '8px',
                                            border: '1px solid #e2e8f0',
                                            fontSize: '14px',
                                            width: '100%',
                                            boxSizing: 'border-box'
                                        }}
                                    />
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    <label style={{ fontSize: '12px', color: '#64748b' }}>팀 / 부서</label>
                                    <select
                                        value={filterTeam}
                                        onChange={(e) => setFilterTeam(e.target.value)}
                                        style={{
                                            padding: '8px 12px',
                                            borderRadius: '8px',
                                            border: '1px solid #e2e8f0',
                                            minWidth: '160px'
                                        }}
                                    >
                                        <option value="all">전체</option>
                                        {ABP_TEAM_DEFS.map((t) => (
                                            <option key={t.id} value={t.id}>
                                                {t.name}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                    <label style={{ fontSize: '12px', color: '#64748b' }}>유형(대분류)</label>
                                    <select
                                        value={filterMajor}
                                        onChange={(e) => setFilterMajor(e.target.value)}
                                        style={{
                                            padding: '8px 12px',
                                            borderRadius: '8px',
                                            border: '1px solid #e2e8f0',
                                            minWidth: '200px'
                                        }}
                                    >
                                        <option value="all">전체</option>
                                        {uniqueMajorOptions.map((m) => (
                                            <option key={m.majorId} value={m.majorId}>
                                                {m.majorLabel}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <label
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '8px',
                                        cursor: 'pointer',
                                        alignSelf: 'flex-end',
                                        paddingBottom: '2px'
                                    }}
                                >
                                    <input
                                        type="checkbox"
                                        checked={showInactive}
                                        onChange={(e) => setShowInactive(e.target.checked)}
                                    />
                                    <span style={{ fontSize: '13px', color: '#475569', whiteSpace: 'nowrap' }}>
                                        비활성 포함
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div className="inquiry-category-section-head">
                            <h3 className="section-title">문의 유형 카테고리 ({filteredRows.length}건)</h3>
                            <button type="button" className="btn btn-sm" onClick={openAdd} style={{ background: '#10b981' }}>
                                + 분류 추가
                            </button>
                        </div>

                        {filteredRows.length === 0 ? (
                            <div className="empty-state">
                                <p>{rows.length === 0 ? '등록된 분류가 없습니다. 상단에서 분류를 추가하세요.' : '조건에 맞는 분류가 없습니다.'}</p>
                            </div>
                        ) : (
                            <div style={{ overflowX: 'auto' }}>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th style={{ width: '44px', textAlign: 'center' }}>No</th>
                                            <th style={{ minWidth: '240px' }}>문의 유형 카테고리</th>
                                            <th style={{ width: '140px' }}>담당 부서</th>
                                            <th style={{ width: '100px', textAlign: 'center' }}>상태</th>
                                            <th style={{ width: '100px' }}>최종 수정자</th>
                                            <th style={{ width: '150px' }}>생성일</th>
                                            <th style={{ width: '140px', textAlign: 'center' }}>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredRows.map((row, index) => {
                                            const teamMeta = ABP_TEAM_BY_ID[row.targetTeam];
                                            const path = `${row.majorLabel || inquiryMajorLabelFromRows(row.majorId, rows)} › ${row.minorLabel || '-'}`;
                                            return (
                                                <tr key={row.id} style={{ opacity: row.active === false ? 0.65 : 1 }}>
                                                    <td style={{ textAlign: 'center', color: '#94a3b8' }}>{index + 1}</td>
                                                    <td style={{ fontSize: '14px' }}>{path}</td>
                                                    <td>
                                                        <span
                                                            className={`team-badge ${teamMeta?.className || ''}`}
                                                            style={{ fontSize: '12px' }}
                                                        >
                                                            {teamMeta?.name || row.targetTeam || '-'}
                                                        </span>
                                                    </td>
                                                    <td style={{ textAlign: 'center', fontSize: '12px' }}>
                                                        {row.active === false ? (
                                                            <span className="status-badge pending">비활성</span>
                                                        ) : (
                                                            <span className="status-badge answered">사용</span>
                                                        )}
                                                    </td>
                                                    <td style={{ fontSize: '13px' }}>{row.updatedByName || '—'}</td>
                                                    <td style={{ fontSize: '13px', color: '#64748b' }}>{formatDate(row.createdAt)}</td>
                                                    <td style={{ textAlign: 'center' }}>
                                                        <button
                                                            type="button"
                                                            className="btn btn-sm btn-action-edit"
                                                            style={{ marginRight: '8px', padding: '5px 12px' }}
                                                            onClick={() => openEdit(row)}
                                                        >
                                                            수정
                                                        </button>
                                                        {row.active !== false ? (
                                                            <button
                                                                type="button"
                                                                className="btn btn-sm btn-action-delete"
                                                                style={{ padding: '5px 12px' }}
                                                                onClick={() => handleSoftDelete(row)}
                                                            >
                                                                삭제
                                                            </button>
                                                        ) : (
                                                            <button
                                                                type="button"
                                                                className="btn btn-sm btn-action-restore"
                                                                style={{ padding: '5px 12px' }}
                                                                onClick={() => handleRestore(row)}
                                                            >
                                                                복구
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {showModal && (
                        <div className="modal-overlay" onClick={() => !saving && setShowModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '480px' }}>
                                <div className="modal-header">
                                    <h3>{modalMode === 'add' ? '분류 추가' : '분류 수정'}</h3>
                                    <button className="modal-close" disabled={saving} onClick={() => setShowModal(false)}>
                                        ×
                                    </button>
                                </div>
                                <div className="modal-body">
                                    {modalMode === 'add' && uniqueMajorOptions.length === 0 ? (
                                        <>
                                            <div className="form-group">
                                                <label>대분류 id (영문, 예: marketing) *</label>
                                                <input
                                                    type="text"
                                                    value={formBootstrapMajorId}
                                                    onChange={(e) => setFormBootstrapMajorId(e.target.value)}
                                                    style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}
                                                />
                                            </div>
                                            <div className="form-group">
                                                <label>대분류 표시명 *</label>
                                                <input
                                                    type="text"
                                                    value={formBootstrapMajorLabel}
                                                    onChange={(e) => setFormBootstrapMajorLabel(e.target.value)}
                                                    style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}
                                                />
                                            </div>
                                        </>
                                    ) : modalMode === 'add' ? (
                                        <>
                                            <div className="form-group">
                                                <label>대분류 *</label>
                                                <div className="inquiry-major-mode-toggle" role="group" aria-label="대분류 등록 방식">
                                                    <button
                                                        type="button"
                                                        className={
                                                            'inquiry-major-mode-btn' +
                                                            (addMajorSource === 'existing' ? ' is-active' : '')
                                                        }
                                                        onClick={() => setAddMajorSource('existing')}
                                                    >
                                                        기존 대분류
                                                    </button>
                                                    <button
                                                        type="button"
                                                        className={
                                                            'inquiry-major-mode-btn' +
                                                            (addMajorSource === 'new' ? ' is-active' : '')
                                                        }
                                                        onClick={() => setAddMajorSource('new')}
                                                    >
                                                        새 대분류
                                                    </button>
                                                </div>
                                            </div>
                                            {addMajorSource === 'existing' ? (
                                                <div className="form-group">
                                                    <label>선택한 대분류</label>
                                                    <select
                                                        value={formMajorId}
                                                        onChange={(e) => setFormMajorId(e.target.value)}
                                                        style={{
                                                            width: '100%',
                                                            padding: '10px 12px',
                                                            borderRadius: '8px',
                                                            border: '1px solid #e2e8f0'
                                                        }}
                                                    >
                                                        {uniqueMajorOptions.map((m) => (
                                                            <option key={m.majorId} value={m.majorId}>
                                                                {m.majorLabel}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="form-group">
                                                        <label>대분류 id (영문) *</label>
                                                        <input
                                                            type="text"
                                                            value={formBootstrapMajorId}
                                                            onChange={(e) => setFormBootstrapMajorId(e.target.value)}
                                                            placeholder="예: marketing"
                                                            style={{
                                                                width: '100%',
                                                                padding: '10px 12px',
                                                                borderRadius: '8px',
                                                                border: '1px solid #e2e8f0'
                                                            }}
                                                        />
                                                    </div>
                                                    <div className="form-group">
                                                        <label>대분류 표시명 *</label>
                                                        <input
                                                            type="text"
                                                            value={formBootstrapMajorLabel}
                                                            onChange={(e) => setFormBootstrapMajorLabel(e.target.value)}
                                                            placeholder="예: 마케팅"
                                                            style={{
                                                                width: '100%',
                                                                padding: '10px 12px',
                                                                borderRadius: '8px',
                                                                border: '1px solid #e2e8f0'
                                                            }}
                                                        />
                                                    </div>
                                                </>
                                            )}
                                        </>
                                    ) : (
                                        <div className="form-group">
                                            <label>대분류 *</label>
                                            <select
                                                value={formMajorId}
                                                onChange={(e) => setFormMajorId(e.target.value)}
                                                style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}
                                            >
                                                {uniqueMajorOptions.map((m) => (
                                                    <option key={m.majorId} value={m.majorId}>
                                                        {m.majorLabel}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    <div className="form-group">
                                        <label>문의 유형 카테고리 명 (중분류 표시) *</label>
                                        <input
                                            type="text"
                                            value={formMinorLabel}
                                            onChange={(e) => setFormMinorLabel(e.target.value)}
                                            placeholder="예: 홍보 / 프로모션"
                                            style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>담당 부서 *</label>
                                        <select
                                            value={formTargetTeam}
                                            onChange={(e) => setFormTargetTeam(e.target.value)}
                                            style={{ width: '100%', padding: '10px 12px', borderRadius: '8px', border: '1px solid #e2e8f0' }}
                                        >
                                            <option value="">-- 선택 --</option>
                                            {ABP_TEAM_DEFS.map((t) => (
                                                <option key={t.id} value={t.id}>
                                                    {t.name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    {modalMode === 'edit' && (
                                        <div className="form-group inquiry-modal-status">
                                            <span className="inquiry-modal-status-title">상태</span>
                                            <div className="inquiry-modal-status-row">
                                                <input
                                                    type="checkbox"
                                                    id="inquiryCategoryFormActive"
                                                    checked={formActive}
                                                    onChange={(e) => setFormActive(e.target.checked)}
                                                />
                                                <label htmlFor="inquiryCategoryFormActive" className="inquiry-modal-status-label">
                                                    사용 중
                                                </label>
                                            </div>
                                            <p className="inquiry-modal-status-hint">
                                                해제하면 비활성 처리되며, 지점 문의 유형 목록에서 숨깁니다.
                                            </p>
                                        </div>
                                    )}
                                </div>
                                <div className="modal-actions" style={{ padding: '15px 0 0', borderTop: '1px solid #eee' }}>
                                    <button
                                        type="button"
                                        className="btn btn-secondary btn-sm"
                                        disabled={saving}
                                        onClick={() => setShowModal(false)}
                                    >
                                        취소
                                    </button>
                                    <button type="button" className="btn btn-sm" disabled={saving} onClick={handleSave} style={{ background: '#10b981' }}>
                                        {saving ? '저장 중...' : modalMode === 'add' ? '등록' : '저장'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 사이드바 컴포넌트
        function Sidebar({ currentPage, setCurrentPage, user, onLogout }) {
            // 각 팀의 대기중 문의 수 계산
            const [pendingCounts, setPendingCounts] = useState({});

            useEffect(() => {
                const unsubscribe = db.collection('abpInquiries')
                    .where('status', '==', 'pending')
                    .onSnapshot((snapshot) => {
                        const counts = {};
                        snapshot.docs.forEach(doc => {
                            const data = doc.data();
                            if (!isKnownAbpTargetTeam(data.targetTeam)) return;
                            counts[data.targetTeam] = (counts[data.targetTeam] || 0) + 1;
                        });
                        setPendingCounts(counts);
                    });

                return () => unsubscribe();
            }, []);

            const totalPendingInquiries = Object.values(pendingCounts).reduce((a, b) => a + b, 0);

            return (
                <aside className="sidebar">
                    <div className="sidebar-header">
                        <div className="abp-badge">ABP</div>
                        <h1>지점 문의 관리 시스템</h1>
                    </div>

                    <nav className="sidebar-nav">
                        <div className="nav-section-title">대시보드</div>
                        <div
                            className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('dashboard')}
                        >
                            <Icons.Dashboard />
                            <span>종합</span>
                        </div>

                        <div className="nav-section-title" style={{marginTop: '20px'}}>팀별 문의함</div>
                        {TEAMS.map(team => (
                            <div
                                key={team.id}
                                className={`nav-item ${currentPage === team.id ? 'active' : ''}`}
                                onClick={() => setCurrentPage(team.id)}
                            >
                                <Icons.Team />
                                <span>{team.name}</span>
                                {pendingCounts[team.id] > 0 && (
                                    <span className="badge">{pendingCounts[team.id]}</span>
                                )}
                            </div>
                        ))}

                        <div className="nav-section-title" style={{marginTop: '20px'}}>문의</div>
                        <div
                            className={`nav-item ${currentPage === 'all_inquiries' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('all_inquiries')}
                        >
                            <Icons.InboxAll />
                            <span>전체 문의함</span>
                            {totalPendingInquiries > 0 && (
                                <span className="badge">{totalPendingInquiries}</span>
                            )}
                        </div>

                        <div
                            className={`nav-item ${currentPage === 'inquiry_category_dept' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('inquiry_category_dept')}
                        >
                            <Icons.DeptCategory />
                            <span>담당 부서 / 문의 유형</span>
                        </div>

                        <div className="nav-section-title" style={{marginTop: '20px'}}>시스템</div>
                        <div
                            className={`nav-item ${currentPage === 'settings' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('settings')}
                        >
                            <Icons.Settings />
                            <span>설정</span>
                        </div>
                    </nav>

                    <div className="sidebar-footer">
                        <div className="user-info-sidebar">
                            <div className="user-avatar">
                                {user?.email?.charAt(0).toUpperCase()}
                            </div>
                            <div className="user-details">
                                <div className="name">{user?.email}</div>
                                <div className="role">{getAbpRoleLabel(user?.email)}</div>
                            </div>
                        </div>
                        <button className="logout-btn" onClick={onLogout}>
                            로그아웃
                        </button>
                    </div>
                </aside>
            );
        }

        // 메인 앱 컴포넌트
        function App() {
            const [openInquiryId] = useState(() => new URLSearchParams(window.location.search).get('open') || null);
            const [currentPage, setCurrentPage] = useState(() =>
                new URLSearchParams(window.location.search).has('open') ? 'all_inquiries' : 'dashboard'
            );
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const wasLoggedIn = React.useRef(false);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (!currentUser) {
                        if (!wasLoggedIn.current) {
                            sessionStorage.setItem('loginReturnUrl', window.location.href);
                            sessionStorage.setItem('loginReturnUrlTs', Date.now().toString());
                        }
                        window.location.href = 'index';
                    } else if (currentUser.email === ADMIN_EMAIL || BIZ_MK_EMAILS.has((currentUser.email || '').toLowerCase())) {
                        // admin / biz_mk1 / biz_mk2 → admin.html로 이동 (?open= 파라미터 전달)
                        const params = new URLSearchParams(window.location.search);
                        // abp.html에서 쓰는 open= 을 admin.html의 abpOpen= 으로도 전달 (다른 쿼리스트링은 그대로 보존)
                        const openId = params.get('open');
                        if (openId && !params.get('abpOpen')) {
                            params.set('abpOpen', openId);
                        }
                        const qs = params.toString();
                        window.location.href = qs ? 'admin?' + qs : 'admin';
                    } else if (currentUser.email !== ABP_EMAIL && !(typeof isAbpTeamEmail === 'function' && isAbpTeamEmail(currentUser.email))) {
                        // ABP 계정/ABP 팀 계정 외 → user.html (open= 파라미터 전달)
                        const openId = new URLSearchParams(window.location.search).get('open');
                        window.location.href = openId ? `user?path=inquiries&${encodeURIComponent(openId)}&open` : 'user';
                    } else {
                        wasLoggedIn.current = true;
                        setUser(currentUser);
                        setLoading(false);
                    }
                });

                // ===== 보안: 이메일 변조 실시간 감시 시작 =====
                const emailMonitorInterval = startEmailMonitoring();

                return () => {
                    unsubscribe();
                    // 감시 중지
                    if (emailMonitorInterval) {
                        clearInterval(emailMonitorInterval);
                    }
                };
            }, []);

            const handleLogout = async () => {
                if (confirm('로그아웃 하시겠습니까?')) {
                    const result = await logout();
                    if (result.success) {
                        window.location.href = 'index';
                    } else {
                        alert('로그아웃 실패: ' + result.message);
                    }
                }
            };

            if (loading) {
                return <div className="loading">로딩 중...</div>;
            }

            const renderPage = () => {
                if (currentPage === 'dashboard') {
                    return <DashboardPage />;
                }
                if (currentPage === 'settings') {
                    return <SettingsPage />;
                }
                if (currentPage === 'inquiry_category_dept') {
                    return <InquiryCategoryDeptPage user={user} />;
                }
                if (currentPage === 'all_inquiries') {
                    return <TeamInquiryPage allTeams openInquiryId={openInquiryId} />;
                }
                // 팀 페이지
                const team = TEAMS.find(t => t.id === currentPage);
                if (team) {
                    return <TeamInquiryPage teamId={currentPage} />;
                }
                return <DashboardPage />;
            };

            return (
                <div className="app-container">
                    <Sidebar
                        currentPage={currentPage}
                        setCurrentPage={setCurrentPage}
                        user={user}
                        onLogout={handleLogout}
                    />
                    <main className="main-content">
                        {renderPage()}
                    </main>
                </div>
            );
        }

        // React 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
