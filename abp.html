<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기획본부 - Marketing Cost Compilater</title>
    <link rel="icon" type="image/png" href="image/symbol_white.png">
    <link rel="stylesheet" href="css/abp.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <div id="root">
        <div class="loading">로딩 중...</div>
    </div>

    <!-- Firebase 설정 -->
    <script src="firebase.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const ADMIN_EMAIL = 'admin@dshare.co.kr';
        const ABP_EMAIL = 'abp@dshare.co.kr';

        // 기획본부 팀 정의 (Firestore abpInquiries.targetTeam 에 저장되는 id)
        const ABP_TEAM_DEFS = [
            { id: 'biz_plan', name: '사업기획팀', className: 'biz_plan' },
            { id: 'sales_ops', name: '영업지원팀', className: 'sales_ops' },
            { id: 'hrd_academy', name: '학원HRD팀', className: 'hrd_academy' },
            { id: 'eng_lab', name: '영어연구소', className: 'eng_lab' },
            { id: 'content_prod', name: '콘텐츠제작팀', className: 'content_prod' },
            { id: 'it_dev', name: 'IT본부', className: 'it_dev' },
            { id: 'corp_admin', name: '경영지원팀', className: 'corp_admin' },
            { id: 'biz_mk1', name: '사업마케팅1팀', className: 'biz_mk1' },
            { id: 'biz_mk2', name: '사업마케팅2팀', className: 'biz_mk2' }
        ];
        const ABP_TEAM_BY_ID = Object.fromEntries(ABP_TEAM_DEFS.map(t => [t.id, t]));
        // 기획본부(abp.html) 사이드바 노출 순서
        const ABP_SIDEBAR_ORDER = [
            'biz_plan', 'sales_ops', 'hrd_academy', 'eng_lab', 'content_prod',
            'it_dev', 'corp_admin', 'biz_mk1', 'biz_mk2'
        ];
        const TEAMS = ABP_SIDEBAR_ORDER.map(id => ABP_TEAM_BY_ID[id]);

        const getAbpRoleLabel = (email) => {
            if (!email) return '기획본부';
            const parts = String(email).toLowerCase().split('@');
            if (parts.length !== 2) return '기획본부';
            const [local, domain] = parts;
            if (domain === 'kogrop.co.kr' && ABP_TEAM_BY_ID[local]?.name) {
                return ABP_TEAM_BY_ID[local].name;
            }
            return '기획본부';
        };

        // 아이콘 컴포넌트
        const Icons = {
            Dashboard: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
            ),
            Team: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            ),
            Settings: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            )
        };

        // 날짜 포맷
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ko-KR', {
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 팀별 문의 페이지
        function TeamInquiryPage({ teamId }) {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [selectedInquiry, setSelectedInquiry] = useState(null);
            const [replyText, setReplyText] = useState('');
            const [replyAuthor, setReplyAuthor] = useState('');
            const [isReplying, setIsReplying] = useState(false);

            // 선택 및 이동 관련 상태
            const [selectedInquiries, setSelectedInquiries] = useState([]);
            const [showMoveModal, setShowMoveModal] = useState(false);
            const [targetTeamForMove, setTargetTeamForMove] = useState('');
            const [isMoving, setIsMoving] = useState(false);

            const team = TEAMS.find(t => t.id === teamId);

            // 해당 팀의 문의글 로드
            useEffect(() => {
                // 팀 변경 시 선택 초기화
                setSelectedInquiries([]);

                const unsubscribe = db.collection('abpInquiries')
                    .where('targetTeam', '==', teamId)
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);
                        setLoading(false);
                    }, (error) => {
                        console.error('문의글 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, [teamId]);

            // 체크박스 - 개별 선택
            const handleSelectInquiry = (id, e) => {
                e.stopPropagation();
                setSelectedInquiries(prev => {
                    if (prev.includes(id)) {
                        return prev.filter(inquiryId => inquiryId !== id);
                    } else {
                        return [...prev, id];
                    }
                });
            };

            // 체크박스 - 전체 선택
            const handleSelectAll = () => {
                if (selectedInquiries.length === inquiries.length) {
                    setSelectedInquiries([]);
                } else {
                    setSelectedInquiries(inquiries.map(inquiry => inquiry.id));
                }
            };

            // 팀 이동 모달 열기
            const openMoveModal = () => {
                if (selectedInquiries.length === 0) {
                    alert('이동할 문의를 선택해주세요.');
                    return;
                }
                setTargetTeamForMove('');
                setShowMoveModal(true);
            };

            // 선택된 문의들을 다른 팀으로 이동
            const handleMoveToTeam = async () => {
                if (!targetTeamForMove) {
                    alert('이동할 팀을 선택해주세요.');
                    return;
                }
                if (targetTeamForMove === teamId) {
                    alert('현재 팀과 동일한 팀입니다. 다른 팀을 선택해주세요.');
                    return;
                }

                setIsMoving(true);

                try {
                    const batch = db.batch();
                    selectedInquiries.forEach(id => {
                        const docRef = db.collection('abpInquiries').doc(id);
                        batch.update(docRef, { targetTeam: targetTeamForMove });
                    });
                    await batch.commit();

                    const targetTeamName = TEAMS.find(t => t.id === targetTeamForMove)?.name || targetTeamForMove;
                    alert(`${selectedInquiries.length}개 문의가 ${targetTeamName}으로 이동되었습니다.`);
                    setSelectedInquiries([]);
                    setShowMoveModal(false);
                } catch (error) {
                    console.error('팀 이동 오류:', error);
                    alert('팀 이동에 실패했습니다.');
                } finally {
                    setIsMoving(false);
                }
            };

            // 상세보기
            const openDetail = (inquiry) => {
                setSelectedInquiry(inquiry);
                setReplyText(inquiry.reply || '');
                setReplyAuthor(inquiry.replyAuthor || '');
                setShowDetailModal(true);
            };

            // 답변 저장
            const handleReply = async () => {
                if (!replyText.trim()) {
                    alert('답변 내용을 입력해주세요.');
                    return;
                }
                if (!replyAuthor.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }

                setIsReplying(true);

                try {
                    const abpRef = db.collection('abpInquiries').doc(selectedInquiry.id);
                    const payload = {
                        reply: replyText.trim(),
                        replyAuthor: replyAuthor.trim(),
                        status: 'answered',
                        repliedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    // 1) 기획본부 문의에만 먼저 저장 (배치에 inquiries를 넣으면 규칙/문서 문제 시 전부 실패할 수 있음)
                    await abpRef.update(payload);

                    // 2) 지점 원본 문의(inquiries) 동기화 — 사용자 화면은 inquiries만 구독함
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db.collection('inquiries').doc(selectedInquiry.originalInquiryId).update(payload);
                        } catch (syncErr) {
                            console.error('inquiries 동기화 오류:', syncErr);
                            alert(
                                '기획본부 문의에는 답변이 저장되었습니다.\n\n' +
                                '다만 지점 문의(inquiries)에 반영되지 않았습니다. (Firestore 규칙에서 기획본부 계정의 inquiries 업데이트 허용 여부를 확인해 주세요.)\n' +
                                (syncErr.message || String(syncErr))
                            );
                            setShowDetailModal(false);
                            return;
                        }
                    }

                    alert('답변이 저장되었습니다.');
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('답변 저장 오류:', error);
                    alert('답변 저장에 실패했습니다: ' + (error.message || error));
                } finally {
                    setIsReplying(false);
                }
            };

            // 상태 배지
            const getStatusBadge = (status) => {
                if (status === 'answered') {
                    return <span className="status-badge answered">답변완료</span>;
                }
                return <span className="status-badge pending">대기중</span>;
            };

            if (loading) {
                return (
                    <div className="loading-spinner">
                        <p>문의 목록을 불러오는 중...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">{team?.name}</h2>
                        <p className="page-subtitle">지점에서 접수된 문의사항에 답변합니다</p>
                    </div>

                    {/* 통계 카드 */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <h3>전체 문의</h3>
                            <div className="value">{inquiries.length}</div>
                        </div>
                        <div className="stat-card">
                            <h3>대기중</h3>
                            <div className="value">{inquiries.filter(i => i.status === 'pending').length}</div>
                        </div>
                        <div className="stat-card">
                            <h3>답변완료</h3>
                            <div className="value">{inquiries.filter(i => i.status === 'answered').length}</div>
                        </div>
                    </div>

                    <div className="content-area">
                        <div className="page-header-actions">
                            <div style={{display: 'flex', alignItems: 'center', gap: '15px'}}>
                                <h3 className="section-title" style={{marginBottom: 0}}>
                                    문의 목록 ({inquiries.length}건)
                                </h3>
                                {selectedInquiries.length > 0 && (
                                    <span style={{fontSize: '14px', color: '#10b981'}}>{selectedInquiries.length}개 선택됨</span>
                                )}
                            </div>
                            {selectedInquiries.length > 0 && (
                                <button
                                    className="btn btn-sm"
                                    onClick={openMoveModal}
                                    style={{background: '#6366f1'}}
                                >
                                    🔀 다른 팀으로 이동
                                </button>
                            )}
                        </div>

                        {inquiries.length === 0 ? (
                            <div className="empty-state">
                                <p>접수된 문의가 없습니다.</p>
                            </div>
                        ) : (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th style={{width: '40px'}}>
                                            <input
                                                type="checkbox"
                                                checked={selectedInquiries.length === inquiries.length && inquiries.length > 0}
                                                onChange={handleSelectAll}
                                                style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                            />
                                        </th>
                                        <th style={{width: '50px', textAlign: 'center'}}>No</th>
                                        <th style={{width: '100px'}}>상태</th>
                                        <th>문의 내용</th>
                                        <th style={{width: '100px'}}>작성자</th>
                                        <th style={{width: '160px'}}>작성일</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {inquiries.map((inquiry, index) => (
                                        <tr
                                            key={inquiry.id}
                                            onClick={() => openDetail(inquiry)}
                                            style={{
                                                cursor: 'pointer',
                                                background: selectedInquiries.includes(inquiry.id) ? 'rgba(16, 185, 129, 0.1)' : 'transparent'
                                            }}
                                        >
                                            <td onClick={(e) => e.stopPropagation()}>
                                                <input
                                                    type="checkbox"
                                                    checked={selectedInquiries.includes(inquiry.id)}
                                                    onChange={(e) => handleSelectInquiry(inquiry.id, e)}
                                                    style={{width: '18px', height: '18px', cursor: 'pointer'}}
                                                />
                                            </td>
                                            <td style={{textAlign: 'center', color: '#888', fontSize: '13px'}}>{index + 1}</td>
                                            <td>{getStatusBadge(inquiry.status)}</td>
                                            <td style={{
                                                maxWidth: '300px',
                                                overflow: 'hidden',
                                                textOverflow: 'ellipsis',
                                                whiteSpace: 'nowrap'
                                            }}>
                                                {inquiry.content}
                                            </td>
                                            <td style={{fontSize: '13px'}}>{inquiry.authorName || '-'}</td>
                                            <td style={{fontSize: '13px', color: '#666'}}>{formatDate(inquiry.createdAt)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>

                    {/* 문의 상세/답변 모달 */}
                    {showDetailModal && selectedInquiry && (
                        <div className="modal-overlay" onClick={() => setShowDetailModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>문의 상세</h3>
                                    <button className="modal-close" onClick={() => setShowDetailModal(false)}>×</button>
                                </div>
                                <div style={{maxHeight: '70vh', overflowY: 'auto'}}>
                                    {/* 문의 정보 */}
                                    <div style={{marginBottom: '20px'}}>
                                        <div style={{display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '15px'}}>
                                            {getStatusBadge(selectedInquiry.status)}
                                            <span style={{fontSize: '13px', color: '#666', marginLeft: 'auto'}}>
                                                {formatDate(selectedInquiry.createdAt)}
                                            </span>
                                        </div>

                                        {/* 원본 지점 문의 내용 */}
                                        {selectedInquiry.originalInquiry && (
                                            <div className="original-inquiry-box">
                                                <p><strong>{selectedInquiry.originalInquiry.title}</strong></p>
                                                <p style={{marginTop: '8px', color: '#555'}}>{selectedInquiry.originalInquiry.content}</p>
                                            </div>
                                        )}

                                        <div style={{fontSize: '13px', color: '#666', marginBottom: '10px'}}>
                                            작성자: {selectedInquiry.authorName || '-'}
                                        </div>
                                    </div>

                                    {/* 답변 작성 영역 */}
                                    <div style={{
                                        borderTop: '1px solid #eee',
                                        paddingTop: '20px'
                                    }}>
                                        <div style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '8px',
                                            marginBottom: '12px'
                                        }}>
                                            <span className={`team-badge ${team?.className}`}>
                                                {team?.name} 답변
                                            </span>
                                            {selectedInquiry.repliedAt && (
                                                <span style={{fontSize: '13px', color: '#666'}}>
                                                    {formatDate(selectedInquiry.repliedAt)}
                                                </span>
                                            )}
                                        </div>

                                        <div className="form-group">
                                            <label>작성자 이름 *</label>
                                            <input
                                                type="text"
                                                value={replyAuthor}
                                                onChange={(e) => setReplyAuthor(e.target.value)}
                                                placeholder="답변 작성자 이름을 입력하세요"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label>답변 내용 *</label>
                                            <textarea
                                                rows="5"
                                                value={replyText}
                                                onChange={(e) => setReplyText(e.target.value)}
                                                placeholder="답변 내용을 입력하세요"
                                                style={{resize: 'vertical'}}
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div className="modal-actions" style={{padding: '15px 0 0', borderTop: '1px solid #eee'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowDetailModal(false)}
                                        disabled={isReplying}
                                    >
                                        닫기
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleReply}
                                        disabled={isReplying}
                                    >
                                        {isReplying ? '저장 중...' : '답변 저장'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 팀 이동 모달 */}
                    {showMoveModal && (
                        <div className="modal-overlay" onClick={() => setShowMoveModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '450px'}}>
                                <div className="modal-header">
                                    <h3 style={{color: '#6366f1'}}>🔀 다른 팀으로 이동</h3>
                                    <button className="modal-close" onClick={() => setShowMoveModal(false)}>×</button>
                                </div>
                                <div>
                                    <p style={{marginBottom: '20px', color: '#666'}}>
                                        선택한 <strong style={{color: '#10b981'}}>{selectedInquiries.length}개</strong> 문의를 다른 팀으로 이동합니다.
                                    </p>

                                    <div className="form-group">
                                        <label>이동할 팀 선택 *</label>
                                        <select
                                            value={targetTeamForMove}
                                            onChange={(e) => setTargetTeamForMove(e.target.value)}
                                            style={{
                                                width: '100%',
                                                padding: '12px 16px',
                                                borderRadius: '8px',
                                                border: '2px solid #e0e0e0',
                                                fontSize: '14px',
                                                background: 'white'
                                            }}
                                        >
                                            <option value="">-- 팀을 선택하세요 --</option>
                                            {TEAMS.filter(t => t.id !== teamId).map(t => (
                                                <option key={t.id} value={t.id}>{t.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {targetTeamForMove && (
                                        <div style={{
                                            background: '#f0f9ff',
                                            border: '1px solid #bae6fd',
                                            borderRadius: '8px',
                                            padding: '12px 16px',
                                            marginTop: '15px'
                                        }}>
                                            <p style={{fontSize: '14px', color: '#0369a1'}}>
                                                📋 선택한 문의가 <strong>{TEAMS.find(t => t.id === targetTeamForMove)?.name}</strong>으로 이동됩니다.
                                            </p>
                                        </div>
                                    )}
                                </div>
                                <div className="modal-actions" style={{padding: '20px 0 0', borderTop: '1px solid #eee', marginTop: '20px'}}>
                                    <button
                                        className="btn btn-secondary btn-sm"
                                        onClick={() => setShowMoveModal(false)}
                                        disabled={isMoving}
                                    >
                                        취소
                                    </button>
                                    <button
                                        className="btn btn-sm"
                                        onClick={handleMoveToTeam}
                                        disabled={isMoving || !targetTeamForMove}
                                        style={{background: '#6366f1'}}
                                    >
                                        {isMoving ? '이동 중...' : '이동 확인'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 대시보드 페이지
        function DashboardPage() {
            // 전일 날짜를 기본값으로 계산
            const getYesterdayStr = () => {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const year = yesterday.getFullYear();
                const month = String(yesterday.getMonth() + 1).padStart(2, '0');
                const day = String(yesterday.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const [loading, setLoading] = useState(true);
            const [dashboardData, setDashboardData] = useState({
                students: {},
                registrations: {},
                withdrawals: {}
            });
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedDate, setSelectedDate] = useState(getYesterdayStr());
            const [dateA, setDateA] = useState(getYesterdayStr()); // 비교 날짜 A
            const [dateB, setDateB] = useState(getYesterdayStr()); // 비교 날짜 B
            const chartRefs = {
                trend: React.useRef(null),
                branch: React.useRef(null),
                compare: React.useRef(null),
                periodTrend: React.useRef(null),
                netChange: React.useRef(null)
            };
            const chartInstances = React.useRef({});

            // 데이터 로드
            useEffect(() => {
                const loadDashboardData = async () => {
                    try {
                        const dataTypes = ['studentCount', 'registrationCount', 'withdrawalCount'];
                        const dataKeys = ['students', 'registrations', 'withdrawals'];

                        for (let i = 0; i < dataTypes.length; i++) {
                            const baseDocId = dataTypes[i];
                            const dataKey = dataKeys[i];
                            const loadedData = {};

                            const snapshot = await db.collection('dashboardData')
                                .where(firebase.firestore.FieldPath.documentId(), '>=', baseDocId)
                                .where(firebase.firestore.FieldPath.documentId(), '<=', baseDocId + '\uf8ff')
                                .get();

                            snapshot.docs.forEach(doc => {
                                const monthData = doc.data().branches || {};
                                Object.keys(monthData).forEach(branchName => {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);
                                });
                            });

                            setDashboardData(prev => ({
                                ...prev,
                                [dataKey]: loadedData
                            }));
                        }

                        setLoading(false);
                    } catch (error) {
                        console.error('대시보드 데이터 로드 오류:', error);
                        setLoading(false);
                    }
                };

                loadDashboardData();

                return () => {
                    Object.values(chartInstances.current).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                };
            }, []);

            // 차트 생성/업데이트
            useEffect(() => {
                if (loading || Object.keys(dashboardData.students).length === 0 || activeTab !== 'overview') return;

                const endDate = new Date(selectedDate);
                const startDate = new Date(selectedDate);
                startDate.setDate(endDate.getDate() - 29);

                const dateMap = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {
                        Object.keys(dashboardData[type][branch]).forEach(date => {
                            const dateObj = new Date(date);
                            if (dateObj >= startDate && dateObj <= endDate) {
                                if (!dateMap[date]) {
                                    dateMap[date] = { students: 0, registrations: 0, withdrawals: 0 };
                                }
                                const value = Number(dashboardData[type][branch][date]) || 0;
                                dateMap[date][type] += value;
                            }
                        });
                    });
                });

                const sortedDates = Object.keys(dateMap).sort();

                const branchSelectedDateData = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {
                        if (!branchSelectedDateData[branch]) {
                            branchSelectedDateData[branch] = { students: 0, registrations: 0, withdrawals: 0 };
                        }

                        if (dashboardData[type][branch][selectedDate]) {
                            branchSelectedDateData[branch][type] = Number(dashboardData[type][branch][selectedDate]) || 0;
                        }
                    });
                });

                // 추세 차트
                if (chartRefs.trend.current) {
                    if (chartInstances.current.trend) {
                        chartInstances.current.trend.destroy();
                    }

                    const ctx = chartRefs.trend.current.getContext('2d');
                    chartInstances.current.trend = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: sortedDates,
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: sortedDates.map(date => dateMap[date].students),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
                                    data: sortedDates.map(date => dateMap[date].registrations),
                                    borderColor: 'rgb(34, 197, 94)',
                                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                },
                                {
                                    label: '퇴원수',
                                    data: sortedDates.map(date => dateMap[date].withdrawals),
                                    borderColor: 'rgb(239, 68, 68)',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '재원생수',
                                        color: 'rgb(59, 130, 246)',
                                        font: { weight: 'bold' }
                                    },
                                    ticks: { color: 'rgb(59, 130, 246)' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '등록수 / 퇴원수',
                                        color: 'rgb(34, 197, 94)',
                                        font: { weight: 'bold' }
                                    },
                                    ticks: { color: 'rgb(34, 197, 94)' },
                                    grid: { drawOnChartArea: false }
                                }
                            }
                        }
                    });
                }

                // 지점별 차트
                if (chartRefs.branch.current) {
                    if (chartInstances.current.branch) {
                        chartInstances.current.branch.destroy();
                    }

                    const sortedBranches = Object.entries(branchSelectedDateData)
                        .sort((a, b) => b[1].students - a[1].students)
                        .slice(0, 10);

                    const ctx = chartRefs.branch.current.getContext('2d');
                    chartInstances.current.branch = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: sortedBranches.map(([branch]) => branch),
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: sortedBranches.map(([, totals]) => totals.students),
                                    backgroundColor: 'rgba(59, 130, 246, 0.8)',
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
                                    data: sortedBranches.map(([, totals]) => totals.registrations),
                                    backgroundColor: 'rgba(34, 197, 94, 0.8)',
                                    yAxisID: 'y1'
                                },
                                {
                                    label: '퇴원수',
                                    data: sortedBranches.map(([, totals]) => totals.withdrawals),
                                    backgroundColor: 'rgba(239, 68, 68, 0.8)',
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '재원생수',
                                        color: 'rgb(59, 130, 246)',
                                        font: { weight: 'bold' }
                                    },
                                    ticks: { color: 'rgb(59, 130, 246)' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '등록수 / 퇴원수',
                                        color: 'rgb(34, 197, 94)',
                                        font: { weight: 'bold' }
                                    },
                                    ticks: { color: 'rgb(34, 197, 94)' },
                                    grid: { drawOnChartArea: false }
                                }
                            }
                        }
                    });
                }
            }, [dashboardData, selectedDate, loading, activeTab]);

            // 비교 차트
            useEffect(() => {
                if (loading || Object.keys(dashboardData.students).length === 0 || activeTab !== 'compare') return;

                const totalsA = { students: 0, registrations: 0, withdrawals: 0 };
                const totalsB = { students: 0, registrations: 0, withdrawals: 0 };

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.values(dashboardData[type]).forEach(branchData => {
                        if (branchData[dateA]) {
                            totalsA[type] += Number(branchData[dateA]) || 0;
                        }
                    });
                });

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.values(dashboardData[type]).forEach(branchData => {
                        if (branchData[dateB]) {
                            totalsB[type] += Number(branchData[dateB]) || 0;
                        }
                    });
                });

                if (chartRefs.compare.current) {
                    if (chartInstances.current.compare) {
                        chartInstances.current.compare.destroy();
                    }

                    const ctx = chartRefs.compare.current.getContext('2d');
                    chartInstances.current.compare = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: [`A (${dateA})`, `B (${dateB})`],
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: [totalsA.students, totalsB.students],
                                    backgroundColor: 'rgba(59, 130, 246, 0.8)',
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
                                    data: [totalsA.registrations, totalsB.registrations],
                                    backgroundColor: 'rgba(34, 197, 94, 0.8)',
                                    yAxisID: 'y1'
                                },
                                {
                                    label: '퇴원수',
                                    data: [totalsA.withdrawals, totalsB.withdrawals],
                                    backgroundColor: 'rgba(239, 68, 68, 0.8)',
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                }
                            },
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '재원생수',
                                        color: 'rgb(59, 130, 246)',
                                        font: {
                                            weight: 'bold'
                                        }
                                    },
                                    ticks: {
                                        color: 'rgb(59, 130, 246)'
                                    }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '등록수 / 퇴원수',
                                        color: 'rgb(34, 197, 94)',
                                        font: {
                                            weight: 'bold'
                                        }
                                    },
                                    ticks: {
                                        color: 'rgb(34, 197, 94)'
                                    },
                                    grid: {
                                        drawOnChartArea: false
                                    }
                                }
                            }
                        }
                    });
                }

                // 기간 추세선 그래프 (A 날짜부터 B 날짜까지)
                if (chartRefs.periodTrend.current && activeTab === 'compare') {
                    if (chartInstances.current.periodTrend) {
                        chartInstances.current.periodTrend.destroy();
                    }

                    // A 날짜부터 B 날짜까지의 모든 날짜 생성
                    const startDate = new Date(dateA);
                    const endDate = new Date(dateB);
                    const dateList = [];
                    const currentDate = new Date(startDate);

                    while (currentDate <= endDate) {
                        const year = currentDate.getFullYear();
                        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                        const day = String(currentDate.getDate()).padStart(2, '0');
                        dateList.push(`${year}-${month}-${day}`);
                        currentDate.setDate(currentDate.getDate() + 1);
                    }

                    // 각 날짜별 데이터 수집
                    const studentsData = [];
                    const registrationsData = [];
                    const withdrawalsData = [];

                    dateList.forEach(date => {
                        const dateTotals = calculateDateTotals(date);
                        studentsData.push(dateTotals.students);
                        registrationsData.push(dateTotals.registrations);
                        withdrawalsData.push(dateTotals.withdrawals);
                    });

                    const ctx = chartRefs.periodTrend.current.getContext('2d');
                    chartInstances.current.periodTrend = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: dateList,
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: studentsData,
                                    borderColor: 'rgba(59, 130, 246, 1)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
                                    data: registrationsData,
                                    borderColor: 'rgba(34, 197, 94, 1)',
                                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                },
                                {
                                    label: '퇴원수',
                                    data: withdrawalsData,
                                    borderColor: 'rgba(239, 68, 68, 1)',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                },
                                tooltip: {
                                    mode: 'index',
                                    intersect: false
                                }
                            },
                            interaction: {
                                mode: 'nearest',
                                axis: 'x',
                                intersect: false
                            },
                            scales: {
                                x: {
                                    display: true,
                                    title: {
                                        display: true,
                                        text: '날짜'
                                    },
                                    ticks: {
                                        maxRotation: 45,
                                        minRotation: 45,
                                        autoSkip: true,
                                        maxTicksLimit: 15
                                    }
                                },
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '재원생수',
                                        color: 'rgb(59, 130, 246)',
                                        font: {
                                            weight: 'bold'
                                        }
                                    },
                                    ticks: {
                                        color: 'rgb(59, 130, 246)'
                                    }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: '등록수 / 퇴원수',
                                        color: 'rgb(34, 197, 94)',
                                        font: {
                                            weight: 'bold'
                                        }
                                    },
                                    ticks: {
                                        color: 'rgb(34, 197, 94)'
                                    },
                                    grid: {
                                        drawOnChartArea: false
                                    }
                                }
                            }
                        }
                    });
                }

                // 순증감 추세 그래프 (A 날짜 기준 0으로 시작)
                if (chartRefs.netChange.current && activeTab === 'compare') {
                    if (chartInstances.current.netChange) {
                        chartInstances.current.netChange.destroy();
                    }

                    // A 날짜부터 B 날짜까지의 모든 날짜 생성
                    const startDate = new Date(dateA);
                    const endDate = new Date(dateB);
                    const dateList = [];
                    const currentDate = new Date(startDate);

                    while (currentDate <= endDate) {
                        const year = currentDate.getFullYear();
                        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                        const day = String(currentDate.getDate()).padStart(2, '0');
                        dateList.push(`${year}-${month}-${day}`);
                        currentDate.setDate(currentDate.getDate() + 1);
                    }

                    // 각 날짜별 순증감 계산 (A 날짜 재원생수 기준)
                    const netChangeData = [];
                    const baseTotals = calculateDateTotals(dateA);
                    const baseStudents = baseTotals.students;

                    dateList.forEach(date => {
                        const dateTotals = calculateDateTotals(date);
                        const netChange = dateTotals.students - baseStudents;
                        netChangeData.push(netChange);
                    });

                    const ctx = chartRefs.netChange.current.getContext('2d');
                    chartInstances.current.netChange = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: dateList,
                            datasets: [
                                {
                                    label: '누적 순증감',
                                    data: netChangeData,
                                    borderColor: 'rgba(16, 185, 129, 1)',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 3,
                                    pointHoverRadius: 6,
                                    pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                                    pointBorderColor: '#fff',
                                    pointBorderWidth: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top'
                                },
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            const value = context.parsed.y;
                                            label += (value > 0 ? '+' : '') + value.toLocaleString() + '명';
                                            return label;
                                        }
                                    }
                                }
                            },
                            interaction: {
                                mode: 'nearest',
                                axis: 'x',
                                intersect: false
                            },
                            scales: {
                                x: {
                                    display: true,
                                    title: {
                                        display: true,
                                        text: '날짜'
                                    },
                                    ticks: {
                                        maxRotation: 45,
                                        minRotation: 45,
                                        autoSkip: true,
                                        maxTicksLimit: 15
                                    }
                                },
                                y: {
                                    display: true,
                                    title: {
                                        display: true,
                                        text: '누적 순증감 (명)',
                                        color: 'rgb(16, 185, 129)',
                                        font: {
                                            weight: 'bold'
                                        }
                                    },
                                    ticks: {
                                        color: 'rgb(16, 185, 129)',
                                        callback: function(value) {
                                            return (value > 0 ? '+' : '') + value.toLocaleString();
                                        }
                                    },
                                    grid: {
                                        color: function(context) {
                                            if (context.tick.value === 0) {
                                                return 'rgba(0, 0, 0, 0.3)';
                                            }
                                            return 'rgba(0, 0, 0, 0.05)';
                                        },
                                        lineWidth: function(context) {
                                            if (context.tick.value === 0) {
                                                return 2;
                                            }
                                            return 1;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }, [dashboardData, dateA, dateB, loading, activeTab]);

            const calculateTotals = () => {
                const totals = { students: 0, registrations: 0, withdrawals: 0, date: selectedDate };

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.values(dashboardData[type]).forEach(branchData => {
                        if (branchData[selectedDate]) {
                            totals[type] += Number(branchData[selectedDate]) || 0;
                        }
                    });
                });

                return totals;
            };

            const calculateDateTotals = (targetDate) => {
                const totals = { students: 0, registrations: 0, withdrawals: 0 };

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.values(dashboardData[type]).forEach(branchData => {
                        if (branchData[targetDate]) {
                            totals[type] += Number(branchData[targetDate]) || 0;
                        }
                    });
                });

                return totals;
            };

            if (loading) {
                return <div className="loading">로딩 중...</div>;
            }

            const totals = calculateTotals();

            return (
                <div>
                    <div className="page-header">
                        <h2 className="page-title">대시보드</h2>
                        <p className="page-subtitle">재원생수, 등록수, 퇴원수 현황을 한눈에 확인하세요</p>
                    </div>

                    <div style={{ display: 'flex', gap: '10px', marginBottom: '20px', borderBottom: '2px solid #e0e0e0' }}>
                        <button onClick={() => setActiveTab('overview')} style={{ padding: '12px 24px', border: 'none', background: activeTab === 'overview' ? '#0d3b36' : 'transparent', color: activeTab === 'overview' ? 'white' : '#666', fontSize: '15px', fontWeight: activeTab === 'overview' ? '600' : '500', cursor: 'pointer', borderRadius: '8px 8px 0 0', transition: 'all 0.2s', position: 'relative', bottom: '-2px' }}>종합 현황</button>
                        <button onClick={() => setActiveTab('compare')} style={{ padding: '12px 24px', border: 'none', background: activeTab === 'compare' ? '#0d3b36' : 'transparent', color: activeTab === 'compare' ? 'white' : '#666', fontSize: '15px', fontWeight: activeTab === 'compare' ? '600' : '500', cursor: 'pointer', borderRadius: '8px 8px 0 0', transition: 'all 0.2s', position: 'relative', bottom: '-2px' }}>기간 비교</button>
                    </div>

                    {activeTab === 'overview' && (
                        <>
                            <div style={{ background: 'white', padding: '20px', borderRadius: '8px', marginBottom: '20px', border: '1px solid #e5e7eb' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '15px', marginBottom: '15px', flexWrap: 'wrap' }}>
                                    <label style={{ fontSize: '14px', fontWeight: '600', minWidth: '70px' }}>조회 날짜:</label>
                                    <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} max={getYesterdayStr()} style={{ padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', cursor: 'pointer' }} />

                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>재원생수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>등록수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>퇴원수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>재원생수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>등록수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>퇴원수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>재원생수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>등록수</th>
                                                                    <th style={{ padding: '8px', textAlign: 'center', border: '1px solid #e5e7eb', fontSize: '13px' }}>퇴원수</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>

                                                                        {/* A 날짜 */}

                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#fef2f2' }}>{branch.dataA.registrations.toLocaleString()}</td>
                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#fef2f2' }}>{branch.dataA.withdrawals.toLocaleString()}</td>

                                                                        {/* B 날짜 */}

                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#eff6ff' }}>{branch.dataB.registrations.toLocaleString()}</td>
                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#eff6ff' }}>{branch.dataB.withdrawals.toLocaleString()}</td>

                                                                        {/* 차이 */}
                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#fefce8', color: branch.diff.students > 0 ? '#22c55e' : branch.diff.students < 0 ? '#ef4444' : '#666', fontWeight: '600' }}>
                                                                            {branch.diff.students > 0 ? '+' : ''}{branch.diff.students.toLocaleString()}
                                                                        </td>
                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#fefce8', color: branch.diff.registrations > 0 ? '#22c55e' : branch.diff.registrations < 0 ? '#ef4444' : '#666', fontWeight: '600' }}>
                                                                            {branch.diff.registrations > 0 ? '+' : ''}{branch.diff.registrations.toLocaleString()}
                                                                        </td>
                                                                        <td style={{ padding: '10px', textAlign: 'center', border: '1px solid #e5e7eb', background: '#fefce8', color: branch.diff.withdrawals > 0 ? '#ef4444' : branch.diff.withdrawals < 0 ? '#22c55e' : '#666', fontWeight: '600' }}>

                            })()}
