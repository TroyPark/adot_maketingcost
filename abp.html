<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>기획본부 - Marketing Cost Compilater</title>
    <link rel="icon" type="image/png" href="image/symbol_white.png">
    <link rel="stylesheet" href="css/abp.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <div id="root">
        <div class="loading">로딩 중...</div>
    </div>

    <!-- Firebase 설정 -->
    <script src="firebase.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const ADMIN_EMAIL = 'admin@dshare.co.kr';
        const ABP_EMAIL = 'abp@dshare.co.kr';
        const BIZ_MK_EMAILS = new Set(['biz_mk1@kogrop.co.kr', 'biz_mk2@kogrop.co.kr']);

        // 기획본부 팀 정의 (Firestore abpInquiries.targetTeam 에 저장되는 id)
        const ABP_TEAM_DEFS = [
            { id: 'biz_plan', name: '사업기획팀', className: 'biz_plan' },
            { id: 'sales_ops', name: '영업지원팀', className: 'sales_ops' },
            { id: 'hrd_academy', name: '학원HRD팀', className: 'hrd_academy' },
            { id: 'eng_lab', name: '영어연구소', className: 'eng_lab' },
            { id: 'content_prod', name: '콘텐츠제작팀', className: 'content_prod' },
            { id: 'it_dev', name: 'IT본부', className: 'it_dev' },
            { id: 'corp_admin', name: '경영지원팀', className: 'corp_admin' },
            { id: 'biz_mk1', name: '사업마케팅1팀', className: 'biz_mk1' },
            { id: 'biz_mk2', name: '사업마케팅2팀', className: 'biz_mk2' }
        ];
        const ABP_TEAM_BY_ID = Object.fromEntries(ABP_TEAM_DEFS.map(t => [t.id, t]));
        // 기획본부(abp.html) 사이드바 노출 순서
        const ABP_SIDEBAR_ORDER = [
            'biz_plan', 'sales_ops', 'hrd_academy', 'eng_lab', 'content_prod',
            'it_dev', 'corp_admin', 'biz_mk1', 'biz_mk2'
        ];
        const TEAMS = ABP_SIDEBAR_ORDER.map(id => ABP_TEAM_BY_ID[id]);
        /** Firestore에 저장된 targetTeam이 현재 기획본부 팀 id와 일치하는지 (팀함·전체함 집계를 맞추기 위함) */
        const isKnownAbpTargetTeam = (teamId) => Boolean(teamId && ABP_TEAM_BY_ID[teamId]);

        /** Firestore: 지점 문의 유형(대·중분류)별 담당 부서 정의 (단일 소스) */
        const INQUIRY_CATEGORY_DEFS_COLLECTION = 'inquiryCategoryDefinitions';
        /** user.html과 동일 — 「담당부서 지정」(코드 주입 대분류, Firestore 카테고리에 없을 수 있음) */
        const ABP_MANUAL_TEAM_MAJOR_ID = 'manual_team';

        function inquiryMajorLabelFromRows(majorId, rows) {
            const hit = (rows || []).find((r) => r.majorId === majorId);
            return hit?.majorLabel || majorId || '-';
        }

        function generateInquiryMinorId(minorLabel) {
            const base = String(minorLabel || 'cat')
                .toLowerCase()
                .replace(/[^a-z0-9가-힣]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 28) || 'cat';
            return base + '_' + Math.random().toString(36).slice(2, 9);
        }

        const getAbpRoleLabel = (email) => {
            if (!email) return '기획본부';
            const parts = String(email).toLowerCase().split('@');
            if (parts.length !== 2) return '기획본부';
            const [local, domain] = parts;
            if (domain === 'kogrop.co.kr' && ABP_TEAM_BY_ID[local]?.name) {
                return ABP_TEAM_BY_ID[local].name;
            }
            return '기획본부';
        };

        // 아이콘 컴포넌트
        const Icons = {
            Dashboard: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
            ),
            Team: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            ),
            Settings: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            ),
            InboxAll: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                </svg>
            ),
            DeptCategory: () => (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    <line x1="12" y1="6" x2="12" y2="12"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                </svg>
            )
        };

        // 날짜 포맷
        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ko-KR', {
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        const sanitizeFileName = (name) =>
            (name || 'file')
                .replace(/[^\w.\-]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');

        const downloadAttachment = async (url, name) => {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name || 'attachment';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch {
                window.open(url, '_blank');
            }
        };

        const uploadInquiryAttachments = async ({ files, inquiryId }) => {
            if (!files || !files.length) return [];
            const uploads = files.map(async (file, idx) => {
                const timestamp = Date.now();
                const safeName = sanitizeFileName(file.name);
                const filePath = `abpInquiries/${inquiryId}/reply/${timestamp}_${idx + 1}_${safeName}`;
                const ref = storage.ref(filePath);
                const uploadTask = await ref.put(file);
                const url = await uploadTask.ref.getDownloadURL();
                return {
                    name: file.name,
                    path: filePath,
                    url,
                    contentType: file.type || '',
                    size: file.size || 0,
                    uploadedAtMs: Date.now()
                };
            });
            return await Promise.all(uploads);
        };

        // 팀별 문의 페이지 (allTeams: true 이면 전체 문의함 — 팀별 문의를 한 목록에서 최신순으로 표시)
        function TeamInquiryPage({ teamId, allTeams, openInquiryId }) {
            const [inquiries, setInquiries] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [selectedInquiry, setSelectedInquiry] = useState(null);
            const [replyText, setReplyText] = useState('');
            const [replyAuthor, setReplyAuthor] = useState('');
            const [replyAttachedFiles, setReplyAttachedFiles] = useState([]); // File[]
            const [isReplying, setIsReplying] = useState(false);
            const fileInputRef = useRef(null);
            const autoOpenDoneRef = useRef(false);

            const [categoryDefRows, setCategoryDefRows] = useState([]);
            const [detailRouteMajorId, setDetailRouteMajorId] = useState('');
            const [detailRouteMinorDocId, setDetailRouteMinorDocId] = useState('');
            const [detailManualTargetTeamId, setDetailManualTargetTeamId] = useState('');
            const [savingCategoryRoute, setSavingCategoryRoute] = useState(false);
            const userPickedCategoryRef = useRef(false);

            const team = allTeams ? null : TEAMS.find(t => t.id === teamId);

            const routeMajorOptions = useMemo(() => {
                const m = new Map();
                (categoryDefRows || []).forEach((r) => {
                    if (r.active === false || !r.majorId) return;
                    if (!m.has(r.majorId)) m.set(r.majorId, r.majorLabel || r.majorId);
                });
                const list = Array.from(m.entries())
                    .map(([majorId, majorLabel]) => ({ majorId, majorLabel }))
                    .sort((a, b) => a.majorLabel.localeCompare(b.majorLabel, 'ko'));
                // 「담당부서 지정」은 코드 주입 (Firestore 정의에 없어도 항상 노출)
                return [{ majorId: ABP_MANUAL_TEAM_MAJOR_ID, majorLabel: '담당부서 지정' }, ...list];
            }, [categoryDefRows]);

            const routeMinorOptions = useMemo(() => {
                if (!detailRouteMajorId) return [];
                if (detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID) return [];
                return (categoryDefRows || [])
                    .filter((r) => r.active !== false && r.majorId === detailRouteMajorId)
                    .slice()
                    .sort((a, b) => (a.minorLabel || '').localeCompare(b.minorLabel || '', 'ko'));
            }, [categoryDefRows, detailRouteMajorId]);

            useEffect(() => {
                const unsub = db.collection(INQUIRY_CATEGORY_DEFS_COLLECTION).onSnapshot(
                    (snapshot) => {
                        const list = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
                        setCategoryDefRows(list);
                    },
                    (err) => console.error('[inquiryCategoryDefinitions] 로드:', err)
                );
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!showDetailModal || !selectedInquiry) return;
                if (userPickedCategoryRef.current) return;
                const inv = selectedInquiry;
                if (inv.inquiryMajor === ABP_MANUAL_TEAM_MAJOR_ID) {
                    setDetailRouteMajorId(ABP_MANUAL_TEAM_MAJOR_ID);
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId(inv.targetTeam || inv.abpTargetTeam || inv.inquiryMinor || '');
                    return;
                }
                const hit = categoryDefRows.find(
                    (r) =>
                        r.active !== false &&
                        r.majorId === inv.inquiryMajor &&
                        String(r.minorId ?? '') === String(inv.inquiryMinor ?? '')
                );
                if (hit) {
                    setDetailRouteMajorId(hit.majorId || '');
                    setDetailRouteMinorDocId(hit.id || '');
                    setDetailManualTargetTeamId('');
                } else {
                    setDetailRouteMajorId('');
                    setDetailRouteMinorDocId('');
                    setDetailManualTargetTeamId('');
                }
            }, [showDetailModal, selectedInquiry, categoryDefRows]);

            // 해당 팀 또는 전체 문의글 로드
            useEffect(() => {
                const base = db.collection('abpInquiries');
                const unsubscribe = (allTeams ? base : base.where('targetTeam', '==', teamId))
                    .onSnapshot((snapshot) => {
                        let data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // 전체 문의함: 팀 미배정·구 스키마 문의는 팀함과 합계가 맞도록 제외
                        if (allTeams) {
                            data = data.filter((row) => isKnownAbpTargetTeam(row.targetTeam));
                        }
                        // 최신순 정렬
                        data.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || new Date(0);
                            return dateB - dateA;
                        });
                        setInquiries(data);
                        setLoading(false);
                    }, (error) => {
                        console.error('문의글 로드 오류:', error);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, [teamId, allTeams]);

            // URL ?open=<abpInquiryId> 딥링크 처리
            useEffect(() => {
                if (!openInquiryId || loading || autoOpenDoneRef.current) return;
                const target = inquiries.find(inq => inq.id === openInquiryId);
                if (!target) return;
                autoOpenDoneRef.current = true;
                openDetail(target);
            }, [openInquiryId, loading, inquiries]);

            // 상세보기
            const openDetail = (inquiry) => {
                userPickedCategoryRef.current = false;
                setReplyText(inquiry.reply || '');
                setReplyAuthor(inquiry.replyAuthor || '');
                setReplyAttachedFiles([]);
                setSelectedInquiry(inquiry);
                setShowDetailModal(true);
                if (inquiry.originalInquiryId) {
                    db.collection('inquiries')
                        .doc(inquiry.originalInquiryId)
                        .get()
                        .then((snap) => {
                            if (!snap.exists) return;
                            const d = snap.data();
                            setSelectedInquiry((prev) => {
                                if (!prev || prev.id !== inquiry.id) return prev;
                                return {
                                    ...prev,
                                    inquiryMajor: prev.inquiryMajor || d.inquiryMajor,
                                    inquiryMinor: prev.inquiryMinor || d.inquiryMinor,
                                    inquiryMajorLabel: prev.inquiryMajorLabel || d.inquiryMajorLabel,
                                    inquiryMinorLabel: prev.inquiryMinorLabel || d.inquiryMinorLabel,
                                    // 문의자 첨부는 Firestore inquiries 에만 있음 — 상세 표시용 병합
                                    attachments: Array.isArray(d.attachments) ? d.attachments : prev.attachments
                                };
                            });
                        })
                        .catch((err) => console.warn('inquiries 보강 로드:', err));
                }
            };

            const handleSaveInquiryCategoryRoute = async () => {
                if (!selectedInquiry) return;
                if (!detailRouteMajorId) {
                    alert('대분류를 선택해주세요.');
                    return;
                }
                setSavingCategoryRoute(true);
                const isManual = detailRouteMajorId === ABP_MANUAL_TEAM_MAJOR_ID;
                const str = (v) => (v != null && v !== undefined ? String(v) : '');
                let abpPayload;
                let invPayload;
                if (isManual) {
                    if (!detailManualTargetTeamId) {
                        alert('담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(detailManualTargetTeamId)) {
                        alert('유효한 담당 부서를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const teamMeta = ABP_TEAM_BY_ID[detailManualTargetTeamId];
                    abpPayload = {
                        targetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId),
                        abpRoutedBy: 'manual_team'
                    };
                    invPayload = {
                        abpTargetTeam: detailManualTargetTeamId,
                        inquiryMajor: ABP_MANUAL_TEAM_MAJOR_ID,
                        inquiryMinor: str(detailManualTargetTeamId),
                        inquiryMajorLabel: '담당부서 지정',
                        inquiryMinorLabel: str(teamMeta?.name || detailManualTargetTeamId)
                    };
                } else {
                    if (!detailRouteMinorDocId) {
                        alert('중분류를 선택해주세요.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    const def = categoryDefRows.find((r) => r.id === detailRouteMinorDocId);
                    if (!def || !def.targetTeam) {
                        alert('선택한 분류를 찾을 수 없습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    if (!isKnownAbpTargetTeam(def.targetTeam)) {
                        alert('분류에 연결된 담당 팀이 올바르지 않습니다.');
                        setSavingCategoryRoute(false);
                        return;
                    }
                    abpPayload = {
                        targetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel),
                        abpRoutedBy: 'firestore'
                    };
                    invPayload = {
                        abpTargetTeam: def.targetTeam,
                        inquiryMajor: def.majorId,
                        inquiryMinor: str(def.minorId),
                        inquiryMajorLabel: str(def.majorLabel),
                        inquiryMinorLabel: str(def.minorLabel)
                    };
                }
                try {
                    await db.collection('abpInquiries').doc(selectedInquiry.id).update({
                        ...abpPayload,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    let inquiriesSyncFailed = false;
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db
                                .collection('inquiries')
                                .doc(selectedInquiry.originalInquiryId)
                                .update({
                                    ...invPayload,
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                        } catch (syncErr) {
                            inquiriesSyncFailed = true;
                            console.error('inquiries 동기화 오류(분류):', syncErr);
                            alert(
                                '기획본부함에는 반영되었습니다.\n\n' +
                                    '다만 지점 문의(inquiries) 동기화에 실패했습니다. Firestore 규칙에서 기획본부 계정이 해당 지점 문의 문서를 수정할 수 있는지 확인해 주세요.\n\n' +
                                    (syncErr.code ? `[${syncErr.code}] ` : '') +
                                    (syncErr.message || String(syncErr))
                            );
                        }
                    }

                    setSelectedInquiry((prev) =>
                        prev
                            ? {
                                  ...prev,
                                  ...abpPayload
                              }
                            : prev
                    );
                    userPickedCategoryRef.current = false;
                    if (!inquiriesSyncFailed) {
                        alert('담당 팀이 선택한 분류에 맞게 반영되었습니다.');
                    }
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('abpInquiries 분류 반영 오류:', error);
                    alert(
                        '기획본부 문의(abpInquiries) 저장에 실패했습니다.\n\n' +
                            (error.code ? `[${error.code}] ` : '') +
                            (error.message || String(error))
                    );
                } finally {
                    setSavingCategoryRoute(false);
                }
            };

            // 답변 저장
            const handleReply = async () => {
                if (!replyText.trim()) {
                    alert('답변 내용을 입력해주세요.');
                    return;
                }
                if (!replyAuthor.trim()) {
                    alert('작성자 이름을 입력해주세요.');
                    return;
                }
                const existingReplyAttachments = Array.isArray(selectedInquiry?.replyAttachments)
                    ? selectedInquiry.replyAttachments
                    : [];
                if (existingReplyAttachments.length + (replyAttachedFiles?.length || 0) > 5) {
                    alert('첨부파일은 최대 5개까지 가능합니다.');
                    return;
                }

                setIsReplying(true);

                try {
                    const abpRef = db.collection('abpInquiries').doc(selectedInquiry.id);
                    const newReplyAttachments = await uploadInquiryAttachments({
                        files: replyAttachedFiles,
                        inquiryId: selectedInquiry.id
                    });
                    const payload = {
                        reply: replyText.trim(),
                        replyAuthor: replyAuthor.trim(),
                        status: 'answered',
                        repliedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        replyAttachments: [...existingReplyAttachments, ...newReplyAttachments]
                    };

                    // 1) 기획본부 문의에만 먼저 저장 (배치에 inquiries를 넣으면 규칙/문서 문제 시 전부 실패할 수 있음)
                    await abpRef.update(payload);

                    // 2) 지점 원본 문의(inquiries) 동기화 — 사용자 화면은 inquiries만 구독함
                    if (selectedInquiry.originalInquiryId) {
                        try {
                            await db.collection('inquiries').doc(selectedInquiry.originalInquiryId).update(payload);
                        } catch (syncErr) {
                            console.error('inquiries 동기화 오류:', syncErr);
                            alert(
                                '기획본부 문의에는 답변이 저장되었습니다.\n\n' +

                                (syncErr.message || String(syncErr))
                            );
                            setShowDetailModal(false);
                            return;
                        }
                    }

                    alert('답변이 저장되었습니다.');
                    setReplyAttachedFiles([]);
                    setShowDetailModal(false);
                } catch (error) {
                    console.error('답변 저장 오류:', error);
                    alert('답변 저장에 실패했습니다: ' + (error.message || error));

            // 상태 배지

        // 대시보드 페이지
        function DashboardPage() {
            // 전일 날짜를 기본값으로 계산
            const getYesterdayStr = () => {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const year = yesterday.getFullYear();
                const month = String(yesterday.getMonth() + 1).padStart(2, '0');
                const day = String(yesterday.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const [loading, setLoading] = useState(true);
            const [dashboardData, setDashboardData] = useState({
                students: {},
                registrations: {},
                withdrawals: {}
            });
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedDate, setSelectedDate] = useState(getYesterdayStr());
            const [dateA, setDateA] = useState(getYesterdayStr()); // 비교 날짜 A
            const [dateB, setDateB] = useState(getYesterdayStr()); // 비교 날짜 B
            const chartRefs = {
                trend: React.useRef(null),
                branch: React.useRef(null),
                compare: React.useRef(null),
                periodTrend: React.useRef(null),
                netChange: React.useRef(null)
            };
            const chartInstances = React.useRef({});

            // 데이터 로드
            useEffect(() => {
                const loadDashboardData = async () => {
                    try {
                        const dataTypes = ['studentCount', 'registrationCount', 'withdrawalCount'];
                        const dataKeys = ['students', 'registrations', 'withdrawals'];

                        for (let i = 0; i < dataTypes.length; i++) {
                            const baseDocId = dataTypes[i];
                            const dataKey = dataKeys[i];
                            const loadedData = {};

                            const snapshot = await db.collection('dashboardData')
                                .where(firebase.firestore.FieldPath.documentId(), '>=', baseDocId)
                                .where(firebase.firestore.FieldPath.documentId(), '<=', baseDocId + '\uf8ff')
                                .get();

                            snapshot.docs.forEach(doc => {
                                const monthData = doc.data().branches || {};
                                Object.keys(monthData).forEach(branchName => {
                                    if (!loadedData[branchName]) {
                                        loadedData[branchName] = {};
                                    }
                                    Object.assign(loadedData[branchName], monthData[branchName]);
                                });
                            });

                            setDashboardData(prev => ({
                                ...prev,
                                [dataKey]: loadedData
                            }));
                        }

                        setLoading(false);
                    } catch (error) {
                        console.error('대시보드 데이터 로드 오류:', error);
                        setLoading(false);
                    }
                };

                loadDashboardData();

                return () => {
                    Object.values(chartInstances.current).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                };
            }, []);

            // 차트 생성/업데이트
            useEffect(() => {
                if (loading || Object.keys(dashboardData.students).length === 0 || activeTab !== 'overview') return;

                const endDate = new Date(selectedDate);
                const startDate = new Date(selectedDate);
                startDate.setDate(endDate.getDate() - 29);

                const dateMap = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {
                        Object.keys(dashboardData[type][branch]).forEach(date => {
                            const dateObj = new Date(date);
                            if (dateObj >= startDate && dateObj <= endDate) {
                                if (!dateMap[date]) {
                                    dateMap[date] = { students: 0, registrations: 0, withdrawals: 0 };
                                }
                                const value = Number(dashboardData[type][branch][date]) || 0;
                                dateMap[date][type] += value;
                            }
                        });
                    });
                });

                const sortedDates = Object.keys(dateMap).sort();

                const branchSelectedDateData = {};

                ['students', 'registrations', 'withdrawals'].forEach(type => {
                    Object.keys(dashboardData[type]).forEach(branch => {
                        if (!branchSelectedDateData[branch]) {
                            branchSelectedDateData[branch] = { students: 0, registrations: 0, withdrawals: 0 };
                        }

                        if (dashboardData[type][branch][selectedDate]) {
                            branchSelectedDateData[branch][type] = Number(dashboardData[type][branch][selectedDate]) || 0;
                        }
                    });
                });

                // 추세 차트
                if (chartRefs.trend.current) {
                    if (chartInstances.current.trend) {
                        chartInstances.current.trend.destroy();
                    }

                    const ctx = chartRefs.trend.current.getContext('2d');
                    chartInstances.current.trend = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: sortedDates,
                            datasets: [
                                {
                                    label: '재원생수',
                                    data: sortedDates.map(date => dateMap[date].students),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '등록수',
